async function runParse(files, meta) {
  const batchId = uuid();
  const batch = { id: batchId, courseId: State.course.id, startedAt: nowISO(), label: meta.title, sourceIds: [], report: null };
  const staging = { batch, meta, items: [], unresolved: [], sources: [], rejected: [] };

  for (const f of files) {
    const existing = (await DB.byIndex('sources', 'fileHash', f.fileHash)).filter(s => s.courseId === State.course.id)[0];
    const src = existing || {
      id: uuid(), courseId: State.course.id, title: meta.title + (files.length > 1 ? ' — ' + f.filename : ''),
      author: meta.author, type: meta.type, filename: f.filename, fileHash: f.fileHash,
      importedAt: nowISO(), detected: 0, admitted: 0, rejected: 0, notes: meta.notes
    };
    let out;
    try {
      if (f.kind === 'rows') out = rowsToCandidates(f.rows);
      else if (f.kind === 'json') out = jsonToCandidates(f.json);
      else out = parseText(f.text, { template: meta.template });
    } catch (e) {
      staging.unresolved.push({ file: f.filename, line: 0, text: 'Extraction failed: ' + e.message });
      continue;
    }
    src.detected = (src.detected || 0) + out.candidates.length;
    staging.sources.push(src);
    batch.sourceIds.push(src.id);
    const ctx = {
      courseId: State.course.id, course: State.course, sourceId: src.id, sourceTitle: src.title,
      filename: f.filename, batchId, srcModule: meta.srcModule, srcChapter: meta.srcChapter,
      defaultDomainId: meta.defaultDomainId, trustSourceAnswers: meta.trustSourceAnswers
    };
    out.candidates.forEach(c => {
      const q = candidateToQuestion(c, ctx);
      staging.items.push({ q, cand: c, keep: true, dup: null, decision: 'import' });
    });
    out.unresolved.forEach(u => staging.unresolved.push({ file: f.filename, line: u.line, text: u.text }));
    if (existing) staging.duplicateFileWarning = true;
  }

  if (!staging.items.length) {
    await modal({
      title: 'No questions detected',
      body: h('div', { class: 'stack' }, [
        h('p', {}, 'Nothing in those files matched a question pattern. ' + staging.unresolved.length + ' block(s) of text were left unresolved.'),
        h('p', { class: 'small muted' }, 'Try a different parsing template, or use “Paste raw text” so you can see exactly what was extracted.'),
        staging.unresolved.length ? h('div', { class: 'diffbox scroll-y', text: staging.unresolved.slice(0, 40).map(u => u.text).join('\n') }) : null
      ])
    });
    return;
  }
  // fingerprints, then duplicate detection against the whole bank
  for (const it of staging.items) await recomputeFingerprint(it.q);
  const bank = await State.questions();
  const verdicts = detectDuplicates(staging.items.map(i => i.q), bank);
  staging.items.forEach(it => {
    const v = verdicts.get(it.q.uuid);
    it.dup = v || null;
    if (v) {
      if (v.conflict) { it.decision = 'conflict'; it.q.status = 'answer_conflict'; it.q.conflict = true; }
      else if (v.cls === 'definite') it.decision = 'merge';
      else { it.decision = 'review'; it.q.status = 'possible_dup'; }
    }
  });
  State.staging = staging;
  go('import');
}

/* ---------- staging preview ----------
   A batch of a few hundred candidates cannot be reviewed one card at a time,
   and "Import all / Reject all" is too blunt to be safe. So the list is
   filterable, tickable and paged, and every batch action applies to the
   current selection — or, when nothing is ticked, to exactly what the filter
   is showing. No action ever touches a row the filter has hidden. */

/* Each filter answers one question a reviewer actually asks of a batch. */
const STAGE_FILTERS = [
  ['all',      'Everything',        () => true],
  ['ready',    'Ready to import',   it => !it.dup && !!it.q.correctOptionId && !!it.q.domainId],
  ['noanswer', 'No answer found',   it => !it.q.correctOptionId],
  ['unmapped', 'No domain',         it => !it.q.domainId],
  ['dup',      'Duplicates',        it => !!it.dup && !it.dup.conflict],
  ['conflict', 'Answer conflicts',  it => !!(it.dup && it.dup.conflict)],
  ['reject',   'Marked reject',     it => it.decision === 'reject']
];

/** Apply a decision to one candidate, keeping its status consistent with it. */
function setStagingDecision(it, d) {
  // merge / review / conflict only mean anything against a matched record.
  if ((d === 'merge' || d === 'review' || d === 'conflict') && !it.dup) return false;
  if (d === 'conflict' && !(it.dup && it.dup.conflict)) return false;
  it.decision = d;
  if (d === 'conflict') { it.q.status = 'answer_conflict'; it.q.conflict = true; }
  else if (d === 'review') { it.q.conflict = false; it.q.status = 'possible_dup'; }
  else if (d === 'import' || d === 'merge' || d === 'reject') {
    // Importing a flagged candidate means "this one stands on its own", so the
    // duplicate and conflict marks come off with it. Otherwise it would be
    // admitted straight back into the review queue it was just cleared from.
    if (it.q.status === 'possible_dup' || it.q.status === 'answer_conflict') {
      it.q.conflict = false;
      it.q.status = it.q.correctOptionId ? 'draft' : 'needs_answer';
    }
  }
  return true;
}

const STAGING_DECISION_LABELS = {
  import: 'will import', reject: 'will reject',
  merge: 'will merge into existing', review: 'will go to review queue', conflict: 'will flag answer conflict'
};
function renderStaging(root) {
  const st = State.staging;
  if (!st.ui) st.ui = { filter: 'all', page: 0, size: 25, sel: new Set() };
  const ui = st.ui;

  const steps = h('div', { class: 'steps' });
  IMPORT_STEPS.forEach(([k, label], i) => steps.appendChild(h('div', { class: 'step', dataset: { on: i === 2 ? '1' : '0', done: i < 2 ? '1' : '0' } }, [h('b', { text: 'Step ' + (i + 1) }), h('span', { text: label })])));
  root.appendChild(steps);

  const counts = () => {
    const c = { import: 0, merge: 0, review: 0, conflict: 0, reject: 0, draft: 0 };
    st.items.forEach(it => {
      c[it.decision] = (c[it.decision] || 0) + 1;
      if (it.decision === 'import' && it.q.status !== 'draft' && it.q.status !== 'active') c.draft++;
    });
    return c;
  };
  const summary = h('div', { class: 'grid g5', style: 'margin-bottom:14px' });
  const drawSummary = () => {
    const c = counts();
    summary.textContent = '';
    const t = (k, v, cls) => summary.appendChild(h('div', { class: 'tile ' + (cls || '') }, [h('span', { class: 'eyebrow', text: k }), h('b', { text: String(v) })]));
    t('Detected', st.items.length);
    t('To import', c.import, c.import ? 'good' : '');
    t('Duplicates to merge', c.merge, c.merge ? 'hot' : '');
    t('Needs review', c.review + c.conflict, (c.review + c.conflict) ? 'hot' : '');
    t('To reject', c.reject, c.reject ? 'hot' : '');
  };
  drawSummary();
  root.appendChild(summary);

  if (st.duplicateFileWarning) root.appendChild(h('div', { class: 'notice warn', style: 'margin-bottom:12px' }, 'One of these files has the same hash as a source already in the register. It has been reused rather than duplicated, and its questions will be matched against what is already in the bank.'));

  /* ---- what the batch actions currently apply to ---- */
  const visible = () => {
    const f = (STAGE_FILTERS.find(x => x[0] === ui.filter) || STAGE_FILTERS[0])[2];
    return st.items.filter(f);
  };
  /** Ticked rows if any are ticked, otherwise everything the filter shows. */
  const scope = () => ui.sel.size ? st.items.filter(it => ui.sel.has(it.q.uuid)) : visible();

  const bulk = h('div', { class: 'card', style: 'margin-bottom:14px' });
  root.appendChild(bulk);
  const list = h('div', { class: 'stack' });
  root.appendChild(list);
  const pager = h('div', { class: 'row', style: 'margin-top:14px;justify-content:center;gap:10px' });
  root.appendChild(pager);

  function drawAll() { drawBulk(); drawList(); drawSummary(); }

  function drawBulk() {
    bulk.textContent = '';
    const shown = visible();
    const target = scope();
    const scopeNote = ui.sel.size
      ? ui.sel.size + ' ticked'
      : shown.length + ' shown' + (ui.filter === 'all' ? '' : ' by this filter');

    const filterSel = h('select', {
      onchange: e => { ui.filter = e.target.value; ui.page = 0; drawAll(); }
    }, STAGE_FILTERS.map(([v, label, fn]) => h('option', { value: v, selected: ui.filter === v }, label + ' (' + st.items.filter(fn).length + ')')));

    const line1 = h('div', { class: 'card-b tight row wrap' }, [
      h('span', { class: 'eyebrow', text: 'Show' }), filterSel,
      h('button', { class: 'btn sm', onclick: () => { shown.forEach(it => ui.sel.add(it.q.uuid)); drawAll(); }, text: 'Tick all shown' }),
      h('button', { class: 'btn sm ghost', disabled: !ui.sel.size, onclick: () => { ui.sel.clear(); drawAll(); }, text: 'Untick all' }),
      h('div', { class: 'spacer' }),
      h('span', { class: 'small muted', text: 'Batch actions apply to ' + scopeNote })
    ]);

    // Merge/review/conflict only ever mean anything against a matched
    // record (setStagingDecision's own eligibility rule) — showing them as
    // live, clickable choices when nothing in scope could actually take
    // them (the common case: a clean import with only a few duplicates)
    // is exactly the kind of decision clutter that invites a confused
    // click on a button that will just silently do nothing to most items.
    const eligibleFor = (d) => target.some(it => {
      if ((d === 'merge' || d === 'review' || d === 'conflict') && !it.dup) return false;
      if (d === 'conflict' && !(it.dup && it.dup.conflict)) return false;
      return true;
    });
    const act = (label, fn, cls, decision) => h('button', { class: 'btn sm ' + (cls || ''), disabled: !target.length || (decision && !eligibleFor(decision)), onclick: fn, text: label });
    const line2 = h('div', { class: 'card-b tight row wrap', style: 'border-top:1px solid var(--rule-soft)' }, [
      h('span', { class: 'eyebrow', text: 'Decide' }),
      act('Import', () => applyDecision('import')),
      act('Merge into existing', () => applyDecision('merge'), '', 'merge'),
      act('Send to review queue', () => applyDecision('review'), '', 'review'),
      act('Flag answer conflict', () => applyDecision('conflict'), '', 'conflict'),
      act('Reject', () => applyDecision('reject'))
    ]);
    const line3 = h('div', { class: 'card-b tight row wrap', style: 'border-top:1px solid var(--rule-soft)' }, [
      h('span', { class: 'eyebrow', text: 'Edit' }),
      act('Set classification', () => bulkClass()),
      act('Trust the source answers', () => bulkTrust()),
      h('div', { class: 'spacer' }),
      h('button', { class: 'btn ghost sm', onclick: async () => { if (await confirmBox('Discard this batch?', 'Nothing has been written to the bank yet. The extracted questions will be lost.')) { State.staging = null; go('import'); } }, text: 'Discard batch' }),
      h('button', { class: 'btn primary', onclick: () => commitBatch(), text: 'Confirm import' })
    ]);
    bulk.appendChild(line1); bulk.appendChild(line2); bulk.appendChild(line3);
  }

  /** Set one decision across the working set, and say what could not take it. */
  function applyDecision(d) {
    const target = scope();
    let done = 0;
    target.forEach(it => { if (setStagingDecision(it, d)) done++; });
    const skipped = target.length - done;
    const why = d === 'merge' || d === 'review' ? ' — they match nothing already in the bank'
      : d === 'conflict' ? ' — they raise no answer conflict' : '';
    toast(done + ' set to ' + d + (skipped ? ' · ' + skipped + ' unchanged' + why : ''), skipped ? 'warn' : 'ok');
    drawAll();
  }

  async function bulkClass() {
    const target = scope();
    const dom = h('select', {}, [h('option', { value: '' }, '— leave unchanged —')].concat(State.course.blueprint.map(d => h('option', { value: d.id }, d.id + ' · ' + d.name))));
    const topic = h('input', { type: 'text', placeholder: 'Leave blank to keep existing' });
    const diff = h('select', {}, [h('option', { value: '' }, '— leave unchanged —')].concat(DIFFICULTY.map(d => h('option', { value: d }, d))));
    const r = await modal({
      title: 'Classify ' + target.length + ' candidate(s)',
      body: h('div', { class: 'grid g2' }, [
        h('div', { class: 'field' }, [h('label', { text: 'Official domain' }), dom]),
        h('div', { class: 'field' }, [h('label', { text: 'Topic' }), topic]),
        h('div', { class: 'field' }, [h('label', { text: 'Difficulty' }), diff])
      ]),
      actions: [{ label: 'Cancel', value: false }, { label: 'Apply', value: true, kind: 'primary' }]
    });
    if (!r) return;
    target.forEach(it => {
      if (dom.value) { it.q.domainId = dom.value; it.q.classVerified = 'verified'; if (it.q.status === 'needs_class') it.q.status = it.q.correctOptionId ? 'draft' : 'needs_answer'; }
      if (topic.value.trim()) it.q.topic = topic.value.trim();
      if (diff.value) it.q.difficulty = diff.value;
    });
    toast('Classification applied to ' + target.length, 'ok');
    drawAll();
  }

  /* Marking an answer verified is a claim about the source, so it is asked for
     explicitly and only ever applies where an answer was actually found. */
  async function bulkTrust() {
    const target = scope();
    const eligible = target.filter(it => it.q.correctOptionId);
    if (!eligible.length) { toast('None of those have an answer to verify', 'warn'); return; }
    const ok = await confirmBox('Treat the source answer as verified?',
      eligible.length + ' of ' + target.length + ' candidate(s) carry an answer from the source. Marking them verified lets them enter practice as Active. Only do this where you trust the source — nothing is fact-checked for you.');
    if (!ok) return;
    eligible.forEach(it => {
      it.q.answerVerified = 'verified'; it.q.verifiedAt = nowISO();
      it.q.verifyNote = 'Source answer trusted at import';
      if (it.q.status === 'needs_answer') it.q.status = it.q.domainId ? 'draft' : 'needs_class';
    });
    toast(eligible.length + ' answer(s) marked verified', 'ok');
    drawAll();
  }

  function drawList() {
    const shown = visible();
    const pages = Math.max(1, Math.ceil(shown.length / ui.size));
    ui.page = clamp(ui.page, 0, pages - 1);
    const slice = shown.slice(ui.page * ui.size, (ui.page + 1) * ui.size);

    list.textContent = '';
    if (!shown.length) {
      list.appendChild(h('div', { class: 'card' }, h('div', { class: 'empty' }, [
        h('h3', { text: 'Nothing matches that filter' }),
        h('p', { class: 'muted', text: 'Switch the filter back to Everything to see the whole batch.' })
      ])));
    } else {
      slice.forEach(it => list.appendChild(stagingRow(it, st.items.indexOf(it))));
    }

    pager.textContent = '';
    pager.appendChild(h('span', { class: 'small muted', text: shown.length + ' candidate(s) in this view' }));
    if (pages > 1) {
      pager.appendChild(h('button', { class: 'btn sm', disabled: ui.page === 0, onclick: () => { ui.page--; drawList(); window.scrollTo(0, 0); }, text: '← Previous' }));
      pager.appendChild(h('span', { class: 'docnum', text: 'Page ' + (ui.page + 1) + ' of ' + pages }));
      pager.appendChild(h('button', { class: 'btn sm', disabled: ui.page >= pages - 1, onclick: () => { ui.page++; drawList(); window.scrollTo(0, 0); }, text: 'Next →' }));
    }
  }

  function stagingRow(it, i) {
    const q = it.q;
    const card = h('div', { class: 'card' });
    const conf = (v) => h('span', { class: 'conf', title: Math.round((v || 0) * 100) + '% confidence' }, h('i', { style: 'width:' + Math.round((v || 0) * 100) + '%;background:' + ((v || 0) >= 0.8 ? 'var(--green)' : (v || 0) >= 0.5 ? 'var(--amber)' : 'var(--pencil)') }));
    const head = h('div', { class: 'card-h' }, [
      h('input', { type: 'checkbox', title: 'Tick for batch actions', checked: ui.sel.has(q.uuid), onchange: e => { e.target.checked ? ui.sel.add(q.uuid) : ui.sel.delete(q.uuid); drawBulk(); } }),
      h('span', { class: 'docnum dim', text: '#' + (i + 1) }),
      h('span', { class: 'tick', dataset: { mark: markFor(q) }, style: 'border:0;width:auto', text: (STATUS[q.status] || {}).mark }),
      statusBadge(q),
      h('span', { class: 'badge ' + (it.decision === 'reject' ? 'b-arch' : it.decision === 'import' ? 'b-active' : 'b-review'), text: STAGING_DECISION_LABELS[it.decision] || it.decision }),
      it.dup ? h('span', { class: 'badge ' + (it.dup.conflict ? 'b-conflict' : 'b-dup'), text: (it.dup.conflict ? 'answer conflict · ' : '') + it.dup.cls + ' duplicate · ' + Math.round(it.dup.sim.score * 100) + '%' }) : null,
      h('div', { class: 'spacer' }),
      h('span', { class: 'tiny dim', text: 'stem' }), conf(q.parseConf && q.parseConf.stem),
      h('span', { class: 'tiny dim', text: 'options' }), conf(q.parseConf && q.parseConf.options),
      h('span', { class: 'tiny dim', text: 'answer' }), conf(q.parseConf && q.parseConf.answer)
    ]);
    const body = h('div', { class: 'card-b' });
    const stem = h('textarea', { style: 'min-height:56px', value: q.stem, oninput: e => { q.stem = e.target.value; } });
    body.appendChild(h('div', { class: 'field' }, [h('label', { text: 'Stem' }), stem]));
    const optBox = h('div', { class: 'stack' });
    const drawOpts = () => {
      optBox.textContent = '';
      q.options.forEach((o, oi) => {
        optBox.appendChild(h('div', { class: 'row', style: 'gap:8px;align-items:flex-start' }, [
          h('label', { class: 'check', style: 'margin-top:8px' }, [
            h('input', { type: 'radio', name: 'c' + q.uuid, checked: q.correctOptionId === o.id, onchange: () => { q.correctOptionId = o.id; if (q.status === 'needs_answer') q.status = q.domainId ? 'draft' : 'needs_class'; drawAll(); } }),
            h('span', { class: 'docnum', text: letterOf(oi) })
          ]),
          h('input', { type: 'text', value: o.text, oninput: e => o.text = e.target.value }),
          h('button', { class: 'btn sm ghost', style: 'margin-top:3px', onclick: () => { q.options.splice(oi, 1); drawOpts(); }, text: '✕' })
        ]));
      });
      optBox.appendChild(h('button', { class: 'btn sm', onclick: () => { q.options.push(makeOption('')); drawOpts(); }, text: '+ Add option' }));
    };
    drawOpts();
    body.appendChild(h('div', { class: 'field' }, [h('label', { text: 'Options — pick the correct one' }), optBox]));
    if (!q.correctOptionId) body.appendChild(h('div', { class: 'notice warn small' }, 'No answer was found in the source. This will be admitted as “Needs answer verification” and kept out of every test session until you set and verify the answer. Nothing will be invented for you.'));
    const g = h('div', { class: 'grid g4', style: 'margin-top:10px' });
    g.appendChild(h('div', { class: 'field' }, [h('label', { text: 'Domain' }), h('select', { onchange: e => { q.domainId = e.target.value || null; if (q.status === 'needs_class' && q.domainId) q.status = 'draft'; drawAll(); } }, [h('option', { value: '' }, 'Unmapped')].concat(State.course.blueprint.map(d => h('option', { value: d.id, selected: q.domainId === d.id }, d.id))))]));
    g.appendChild(h('div', { class: 'field' }, [h('label', { text: 'Topic' }), h('input', { type: 'text', value: q.topic, oninput: e => q.topic = e.target.value })]));
    g.appendChild(h('div', { class: 'field' }, [h('label', { text: 'Difficulty' }), h('select', { onchange: e => q.difficulty = e.target.value }, DIFFICULTY.map(d => h('option', { value: d, selected: q.difficulty === d }, d)))]));
    g.appendChild(h('div', { class: 'field' }, [h('label', { text: 'Decision' }), h('select', {
      onchange: e => { setStagingDecision(it, e.target.value); drawAll(); }
    }, [['import', 'Import'], ['reject', 'Reject'], it.dup ? ['merge', 'Merge into existing'] : null, it.dup ? ['review', 'Send to review queue'] : null, it.dup && it.dup.conflict ? ['conflict', 'Record answer conflict'] : null].filter(Boolean).map(([v, l]) => h('option', { value: v, selected: it.decision === v }, l)))]));
    body.appendChild(g);
    if (q.explanation) body.appendChild(h('div', { class: 'field', style: 'margin-top:10px' }, [h('label', { text: 'Explanation' }), h('textarea', { style: 'min-height:46px', value: q.explanation, oninput: e => q.explanation = e.target.value })]));
    if (q.lockOptionOrder) body.appendChild(h('div', { class: 'notice small', style: 'margin-top:10px' }, 'Option order will stay fixed for this question — it refers to a specific position or contains an “all/none of the above” style choice.'));
    if (it.dup) body.appendChild(h('button', { class: 'btn sm', style: 'margin-top:10px', onclick: () => compareDialog(q, it.dup, it, drawAll), text: 'Compare side by side' }));
    body.appendChild(h('div', { class: 'srcline', style: 'margin-top:8px', text: (q.sourceRefs[0] || {}).filename + ' · ' + (q.locator || '') + (q.originalNumber ? ' · original no. ' + q.originalNumber : '') }));
    card.appendChild(head); card.appendChild(body);
    return card;
  }
  drawAll();

  if (st.unresolved.length) {
    root.appendChild(h('div', { class: 'card', style: 'margin-top:16px' }, [
      h('div', { class: 'card-h' }, [h('h3', { text: 'Unresolved content' }), h('span', { class: 'badge b-draft', text: String(st.unresolved.length) })]),
      h('div', { class: 'card-b' }, [
        h('p', { class: 'small muted' }, 'These lines did not fit a question pattern. They are counted in the reconciliation so nothing disappears silently.'),
        h('div', { class: 'diffbox scroll-y', text: st.unresolved.slice(0, 200).map(u => '[' + u.file + ':' + u.line + '] ' + u.text).join('\n') })
      ])
    ]));
  }

  async function commitBatch() {
    const c = counts();
    const admitted = c.import + c.review + c.conflict;
    const ok = await confirmBox('Admit this batch?',
      admitted + ' question(s) will be admitted and issued permanent Question IDs — ' +
      c.import + ' entering practice immediately' +
      (c.review + c.conflict ? ', ' + (c.review + c.conflict) + ' staying in the review queue until you confirm them' : '') + '. ' +
      (c.merge ? c.merge + ' will be merged into existing records. ' : '') +
      (c.reject ? c.reject + ' will be rejected. ' : '') +
      'Question IDs, once issued, are permanent, including for review-queue items.');
    if (!ok) return;
    try {
      await admitBatch();
    } catch (e) {
      // A DB write failure here (storage full is the realistic one — a
      // large batch's questions, sources and audit rows all land in one
      // pass) must never look like the confirm dialog was simply ignored.
      // State.staging is untouched on failure, so the review is not lost —
      // the student can try again once the underlying problem is fixed.
      await modal({
        title: 'Import could not be saved',
        body: h('div', { class: 'stack' }, [
          h('div', { class: 'notice bad' }, e.message || String(e)),
          h('p', {}, 'Nothing was added — your browser’s storage may be full. Your reviewed batch is still here; free up space (Settings → Backup & Restore) and try Admit again.')
        ])
      });
    }
  }
}

async function admitBatch() {
  const st = State.staging;
  for (const s of st.sources) await DB.put('sources', s);
  const toAdmit = [], toMerge = [], rejected = [], needsRecheck = [];
  st.items.forEach(it => {
    if (it.decision === 'reject') { rejected.push(it); return; }
    if (it.decision === 'merge' && it.dup && it.dup.other && it.dup.other.qid) { toMerge.push(it); return; }
    if (it.decision === 'conflict') { it.q.status = 'answer_conflict'; it.q.conflict = true; }
    if (it.decision === 'review' && it.q.status === 'draft') it.q.status = 'possible_dup';
    // Promote clean drafts to Active only where the answer is actually verified.
    if (it.q.status === 'draft' && it.q.correctOptionId && it.q.domainId && it.q.answerVerified === 'verified') it.q.status = 'active';
    else if (it.q.status === 'draft' && !it.q.correctOptionId) it.q.status = 'needs_answer';
    else if (it.q.status === 'draft' && it.q.answerVerified !== 'verified') it.q.status = 'needs_answer';
    toAdmit.push(it.q);
    if (it.dup) needsRecheck.push(it.q);
  });
  let merged = 0;
  for (const it of toMerge) {
    const target = it.dup.other;
    const existing = await Questions.get(target.uuid);
    if (!existing) { toAdmit.push(it.q); continue; }
    const before = JSON.parse(JSON.stringify(existing));
    existing.sourceRefs = (existing.sourceRefs || []).concat(it.q.sourceRefs);
    if (!existing.explanation && it.q.explanation) existing.explanation = it.q.explanation;
    if (!existing.topic && it.q.topic) existing.topic = it.q.topic;
    existing.updatedAt = nowISO();
    await DB.put('questions', existing);
    await audit('merge', 'question', existing.qid, { sourceRefs: before.sourceRefs.length }, { sourceRefs: existing.sourceRefs.length }, 'Duplicate from batch ' + st.batch.id.slice(0, 8) + ' merged; both sources retained');
    merged++;
    needsRecheck.push(existing);
  }

  // toMerge's fallback path (target deleted mid-review) can still push into
  // toAdmit above, so admit only runs once every candidate's final fate is
  // known — otherwise a late fallback gets counted in the report but never
  // actually gets a QID or reaches the database. Uses the course the batch
  // was actually parsed under (st.batch.courseId), not State.course.id —
  // the two can drift if the course selector was switched mid-review, and
  // a Question ID's prefix must match the course it was really issued for,
  // not whatever happens to be selected at the moment "Admit" is clicked.
  await Questions.admit(toAdmit, st.batch.courseId, 'batch ' + st.batch.id.slice(0, 8));

  // Matched candidates were only ever judged from their own side during
  // staging. Bring the record(s) each one matches up to date too, so a
  // conflict or duplicate found here holds on both sides permanently, not
  // just for the newly admitted question — the same rule an edit follows.
  if (needsRecheck.length) {
    const live = (await Questions.byCourse(st.batch.courseId)).filter(x => x.status !== 'merged' && x.status !== 'rejected');
    const index = buildIndex(live);
    const byUuid = new Map(live.map(x => [x.uuid, x]));
    for (const q of needsRecheck) {
      const before = q.status;
      const r = await recheckQuestion(q, { bank: live, index, byUuid });
      if (r.changed || q.status !== before) await DB.put('questions', q);
    }
  }
  for (const it of rejected) {
    await audit('reject', 'question', '(not admitted)', null, { stem: it.q.stem.slice(0, 90) }, 'Rejected during import review');
  }

  const drafts = toAdmit.filter(q => q.status !== 'active').length;
  const report = {
    detected: st.items.length,
    imported: toAdmit.filter(q => q.status === 'active').length,
    drafts,
    merged,
    possibleDup: toAdmit.filter(q => q.status === 'possible_dup').length,
    conflicts: toAdmit.filter(q => q.status === 'answer_conflict').length,
    incomplete: toAdmit.filter(q => q.status === 'needs_answer' || q.status === 'parsing').length,
    rejected: rejected.length,
    unresolved: st.unresolved.length,
    sources: st.sources.map(s => ({ id: s.id, title: s.title, filename: s.filename, detected: s.detected }))
  };
  report.accounted = report.imported + report.drafts + report.merged + report.rejected;
  report.balanced = report.accounted === report.detected;
  st.batch.report = report;
  st.batch.finishedAt = nowISO();
  await DB.put('batches', st.batch);
  for (const s of st.sources) { s.admitted = (s.admitted || 0) + toAdmit.filter(q => q.sourceId === s.id).length; s.rejected = (s.rejected || 0) + rejected.filter(r => r.q.sourceId === s.id).length; await DB.put('sources', s); }
  await audit('import', 'batch', st.batch.id, null, report, st.meta.title);
  State.staging = null;
  State.invalidate();
  go('import');
  showReconciliation(st.batch);
}

/* ---------- side-by-side duplicate comparison ---------- */
function compareDialog(q, dup, item, redraw, label) {
  const other = dup.other;
  const d = diffWords(q.stem, other.stem);
  const col = (label, qq, parts) => h('div', {}, [
    h('div', { class: 'eyebrow', style: 'margin-bottom:6px', text: label }),
    h('div', { class: 'docnum dim', style: 'margin-bottom:6px', text: qq.qid || 'incoming candidate' }),
    renderDiff(parts),
    h('div', { class: 'stack', style: 'margin-top:8px' }, qq.options.map((o, i) => h('div', { class: 'small' + (o.id === qq.correctOptionId ? '' : ' muted') }, [
      h('span', { class: 'docnum', text: letterOf(i) + ' ' }), o.text, o.id === qq.correctOptionId ? h('span', { class: 'badge b-active', style: 'margin-left:6px', text: 'correct' }) : null
    ]))),
    qq.explanation ? h('div', { class: 'exp small', style: 'margin-top:8px', text: qq.explanation.slice(0, 400) }) : null,
    h('div', { class: 'srcline', style: 'margin-top:8px', text: (qq.sourceRefs || []).map(r => r.sourceTitle || r.filename).join(' · ') })
  ]);
  modal({
    title: 'Duplicate comparison · ' + dup.cls + ' · ' + Math.round(dup.sim.score * 100) + '% similar', wide: true,
    body: h('div', { class: 'stack' }, [
      dup.conflict ? h('div', { class: 'notice bad' }, 'The two records disagree on the correct answer. Neither can enter practice until you decide which is right.') : null,
      h('div', { class: 'grid g2' }, [col(label || 'Incoming', q, d.a), col('Already in bank', other, d.b)]),
      h('div', { class: 'card' }, [h('div', { class: 'card-b tight tiny' }, [
        h('div', { class: 'row wrap', style: 'gap:14px' }, [
          h('span', { text: 'stem tokens ' + Math.round(dup.sim.stemTok * 100) + '%' }),
          h('span', { text: 'stem characters ' + Math.round(dup.sim.stemChr * 100) + '%' }),
          h('span', { text: 'option overlap ' + Math.round(dup.sim.opts * 100) + '%' }),
          h('span', { text: 'answer match ' + Math.round(dup.sim.ans * 100) + '%' })
        ])
      ])])
    ]),
    actions: [
      { label: 'Cancel', value: null },
      { label: 'Keep separate', value: 'sep', kind: 'primary' },
      { label: 'Reject incoming', value: 'rej', kind: 'danger' },
      { label: 'Merge into existing', value: 'merge' }
    ]
  }).then(async v => {
    if (!v) return;
    if (v === 'sep') {
      // Record the dismissal on both sides so a future recheck never
      // re-raises this exact pair, then clear only this one pairing —
      // either record may still be held out of practice by a different one.
      const kind = dup.conflict ? 'conflict' : 'dup';
      item.q.dismissedPairs = Array.from(new Set((item.q.dismissedPairs || []).concat([other.uuid])));
      unflagPairSide(item.q, other.uuid, kind);
      // normalizePairState only re-derives conflict from what's still in
      // conflictWith — clear the flag this specific pairing set so a
      // different still-live pairing (if any) is what decides it now.
      item.q.conflict = false;
      normalizePairState(item.q);
      item.decision = 'import';
      const persisted = other.qid ? await Questions.get(other.uuid) : null;
      if (persisted) {
        persisted.dismissedPairs = Array.from(new Set((persisted.dismissedPairs || []).concat([item.q.uuid])));
        unflagPairSide(persisted, item.q.uuid, kind);
        persisted.conflict = false;
        normalizePairState(persisted);
        persisted.updatedAt = nowISO();
        await DB.put('questions', persisted);
        State.invalidate();
      }
    }
    if (v === 'rej') item.decision = 'reject';
    if (v === 'merge') item.decision = 'merge';
    redraw();
  });
}

/* ============================================================================
   12 · Add from Image — capture, adjust, transcribe, verify
   OCR is optional and local. Where no answer is shown on the page, none is
   invented: the question is admitted needing answer verification.
   ========================================================================== */

async function imageWorkflow(fileOrNull) {
  let file = fileOrNull;
  if (!file) {
    const picked = await pickImage();
    if (!picked) return;
    file = picked;
  }
  let img = await loadImage(file);
  const origImg = img;
  const st = { rotate: 0, contrast: 100, grayscale: false, crop: null, scale: 1 };
  const canvas = h('canvas');
  const stage = h('div', { class: 'imgstage' }, canvas);
  const ctx = canvas.getContext('2d');

  function paint() {
    const rad = st.rotate * Math.PI / 180;
    const swap = st.rotate % 180 !== 0;
    const w = swap ? img.height : img.width, hgt = swap ? img.width : img.height;
    const maxW = 900, s = Math.min(1, maxW / w);
    canvas.width = Math.round(w * s); canvas.height = Math.round(hgt * s);
    ctx.save();
    ctx.filter = 'contrast(' + st.contrast + '%)' + (st.grayscale ? ' grayscale(1)' : '');
    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.rotate(rad);
    ctx.drawImage(img, -img.width * s / 2, -img.height * s / 2, img.width * s, img.height * s);
    ctx.restore();
  }
  paint();

  // simple drag-to-crop
  let dragging = null;
  canvas.addEventListener('pointerdown', e => {
    const r = canvas.getBoundingClientRect();
    dragging = { x: (e.clientX - r.left) * canvas.width / r.width, y: (e.clientY - r.top) * canvas.height / r.height };
  });
  canvas.addEventListener('pointerup', e => {
    if (!dragging) return;
    const r = canvas.getBoundingClientRect();
    const x2 = (e.clientX - r.left) * canvas.width / r.width, y2 = (e.clientY - r.top) * canvas.height / r.height;
    const x = Math.min(dragging.x, x2), y = Math.min(dragging.y, y2), w = Math.abs(x2 - dragging.x), hh = Math.abs(y2 - dragging.y);
    dragging = null;
    if (w > 24 && hh > 24) {
      // Bake the crop into a new source image — rotate/contrast/grayscale
      // are already reflected in these pixels (the canvas was painted with
      // them), so later adjustments now apply cleanly on top of the crop
      // instead of paint() silently redrawing the full original photo.
      const data = ctx.getImageData(x, y, w, hh);
      const cropCanvas = document.createElement('canvas');
      cropCanvas.width = w; cropCanvas.height = hh;
      cropCanvas.getContext('2d').putImageData(data, 0, 0);
      img = cropCanvas;
      st.rotate = 0; st.contrast = 100; st.grayscale = false; st.crop = true;
      paint();
      toast('Cropped. Rotate, contrast and grayscale now apply to the cropped image — use Reset to start over from the original photo.');
    }
  });

  const ocrStatus = h('div', { class: 'small muted', text: Settings.get('ocrEnabled') ? 'Local OCR engine enabled.' : 'OCR is off — transcribe on the right, or enable a local OCR engine in Settings.' });
  const textArea = h('textarea', { style: 'min-height:300px;font-family:var(--mono);font-size:13px', placeholder: 'Type or paste what the image says.\n\nExample:\n\nWhich control is MOST effective…?\nA) …\nB) …\nC) …\nD) …\nAnswer: C\nExplanation: …' });
  const parsedInfo = h('div', { class: 'small muted', text: 'Nothing parsed yet.' });
  const reparse = debounce(() => {
    if (!textArea.value.trim()) { parsedInfo.textContent = 'Nothing parsed yet.'; return; }
    const out = parseText(textArea.value, { template: 'auto' });
    parsedInfo.textContent = out.candidates.length + ' question(s) detected · ' + out.candidates.filter(c => c.answerLetter).length + ' with a stated answer.';
  }, 320);
  textArea.addEventListener('input', reparse);

  // Two separate "Contrast +" / "Contrast −" buttons read as two controls;
  // grouped under one "Contrast" label they read as one. "Try external
  // OCR" is only ever useful once it's actually turned on in Settings
  // (clicking it while off just redirects there) — showing it to every
  // student, on by default, added a control almost nobody uses yet.
  const contrastGroup = h('div', { class: 'row', style: 'gap:2px;align-items:center' }, [
    h('span', { class: 'tiny dim', style: 'margin-right:2px', text: 'Contrast' }),
    h('button', { class: 'btn sm', title: 'Lower contrast', onclick: () => { st.contrast = clamp(st.contrast - 25, 50, 300); paint(); }, text: '−' }),
    h('button', { class: 'btn sm', title: 'Higher contrast', onclick: () => { st.contrast = clamp(st.contrast + 25, 50, 300); paint(); }, text: '+' })
  ]);
  const controls = h('div', { class: 'row wrap', style: 'gap:6px;margin-bottom:8px' }, [
    h('button', { class: 'btn sm', onclick: () => { st.rotate = (st.rotate + 90) % 360; paint(); }, text: '↻ Rotate' }),
    h('button', { class: 'btn sm', onclick: () => { st.grayscale = !st.grayscale; paint(); }, text: 'Grayscale' }),
    contrastGroup,
    h('button', { class: 'btn sm', onclick: () => { img = origImg; st.rotate = 0; st.contrast = 100; st.grayscale = false; st.crop = null; paint(); }, text: 'Reset' }),
    h('button', { class: 'btn sm primary', onclick: () => runOCR(canvas, textArea, ocrStatus), text: 'Run OCR' }),
    Settings.get('externalOcrEnabled') ? h('button', { class: 'btn sm', title: 'Sends this image to an API you configure yourself — see Settings → Images and OCR', onclick: () => runExternalOCR(canvas, textArea, ocrStatus), text: 'Try external OCR' }) : null
  ]);

  const bodyContent = h('div', { class: 'stack' }, [
    h('div', { class: 'notice small' }, 'Drag on the image to crop to the question block. Whatever ends up in the text box on the right is what gets parsed — check it against the image before continuing.'),
    h('div', { class: 'grid g2' }, [
      h('div', {}, [controls, stage, ocrStatus]),
      h('div', { class: 'field' }, [h('label', { text: 'Extracted text — edit freely' }), textArea, parsedInfo])
    ])
  ]);
  // Cancel, the ✕ button and Escape all resolve modal() the same falsy way —
  // loop so any of the three can be walked back from a confirm dialog
  // instead of silently discarding a crop/adjustment/transcription in progress.
  // That guard only ever covers the app's own controls, though — an actual
  // tab close, refresh, or Back button bypasses it entirely, so the global
  // beforeunload handler checks this flag too while real work is at risk.
  window._imageWorkflowOpen = true;
  try {
    let res;
    for (; ;) {
      res = await modal({
        title: 'Add from image', wide: true, sticky: true,
        body: bodyContent,
        actions: [{ label: 'Cancel', value: false }, { label: 'Continue to import', value: true, kind: 'primary' }]
      });
      if (res) break;
      const hasWork = !!(textArea.value.trim() || st.crop || st.rotate || st.contrast !== 100 || st.grayscale);
      if (!hasWork) return;
      const discard = await confirmBox('Discard this image?', 'Your crop, adjustments and transcribed text will be lost.', true, 'Discard');
      if (discard) return;
    }
    if (!textArea.value.trim()) return;

    // keep a compressed copy of the source image for provenance
    let imageId = null;
    if (Settings.get('storeSourceImages')) {
      const dataUrl = canvas.toDataURL('image/jpeg', 0.72);
      const approxKB = Math.round(dataUrl.length * 0.75 / 1024);
      if (approxKB <= Settings.get('imageMaxKB')) {
        imageId = uuid();
        await DB.put('images', { id: imageId, dataUrl, hash: await sha256(dataUrl), capturedAt: nowISO(), filename: file.name || 'pasted-image', ocrText: textArea.value, sizeKB: approxKB });
      } else {
        toast('Image not stored — it is ' + approxKB + ' KB, above the ' + Settings.get('imageMaxKB') + ' KB limit in Settings.', 'warn', 5000);
      }
    }
    const blob = new Blob([textArea.value], { type: 'text/plain' });
    const f = new File([blob], (file.name || 'image') + '.txt', { type: 'text/plain' });
    const parsedF = await readFile(f);
    parsedF.sourceType = 'image';
    parsedF.imageId = imageId;
    await sourceDialog([parsedF]);
    // attach the image to the questions of this batch
    if (imageId && State.staging) State.staging.items.forEach(it => { if (!it.q.imageId) it.q.imageId = imageId; });
  } finally {
    window._imageWorkflowOpen = false;
  }
}

function pickImage() {
  return new Promise(resolve => {
    let done = false;
    const finish = (file) => {
      if (done) return;
      done = true;
      window.removeEventListener('focus', onFocus);
      input.remove();
      resolve(file);
    };
    const input = h('input', { type: 'file', accept: 'image/*', capture: 'environment', class: 'hidden', onchange: e => finish(e.target.files[0] || null) });
    // No 'change' event fires at all when the picker is dismissed without
    // choosing a file — cancelling is a completely ordinary thing to do,
    // and without this the whole workflow just silently sat there with no
    // error, no retry, nothing. 'cancel' covers browsers that support it;
    // the window regaining focus after the native picker closes (with no
    // file chosen in time for 'change' to beat it) is the fallback for
    // ones that don't.
    input.addEventListener('cancel', () => finish(null));
    document.body.appendChild(input);
    input.click();
    const onFocus = () => setTimeout(() => finish(null), 300);
    window.addEventListener('focus', onFocus, { once: true });
  });
}
function loadImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => { res(im); setTimeout(() => URL.revokeObjectURL(url), 2000); };
    im.onerror = () => rej(new Error('That image could not be opened.'));
    im.src = url;
  });
}

/**
 * OCR hook. No engine is bundled, because no OCR library small enough to embed
 * offline exists — so this loads a local vendor script if you have placed one
 * next to index.html. Nothing is ever sent over the network by this app.
 */
async function runOCR(canvas, textArea, statusEl) {
  if (!Settings.get('ocrEnabled')) {
    await modal({
      title: 'OCR is not enabled',
      body: h('div', { class: 'stack' }, [
        h('p', {}, 'No OCR engine is bundled with this application. Nothing is sent to a server, so text recognition needs an engine on your own machine.'),
        h('p', { class: 'small muted' }, 'To enable it: download tesseract.js, put tesseract.min.js and its worker and language files in a folder called vendor next to index.html, then switch OCR on in Settings.'),
        h('p', { class: 'small muted', style: 'margin:0' }, 'Until then, transcribe the question in the box on the right — the parser handles the rest.')
      ])
    });
    return;
  }
  if (textArea.value.trim() && !await confirmBox('Replace the current text?', 'Running OCR will overwrite what is already in the box — including anything you typed or corrected by hand.', false, 'Run OCR')) return;
  statusEl.textContent = 'Loading the local OCR engine…';
  try {
    if (!self.Tesseract) {
      await new Promise((res, rej) => {
        const s = h('script', { src: Settings.get('ocrScriptPath'), onload: res, onerror: () => rej(new Error('Could not load ' + Settings.get('ocrScriptPath'))) });
        document.head.appendChild(s);
      });
    }
    statusEl.textContent = 'Reading the image…';
    const out = await self.Tesseract.recognize(canvas, 'eng');
    const words = (out.data && out.data.words) || [];
    const low = words.filter(w => w.confidence < 70).length;
    textArea.value = (out.data && out.data.text) || '';
    textArea.dispatchEvent(new Event('input'));
    statusEl.textContent = 'OCR complete · ' + words.length + ' word(s), ' + low + ' below 70% confidence. Check anything that looks like I/1/l or O/0.';
  } catch (e) {
    statusEl.textContent = 'OCR failed: ' + e.message + ' — transcribe manually instead.';
  }
}

/* ---------- external OCR: bring your own API key ----------
   Local Tesseract OCR above is the default because it never leaves this
   machine. If it isn't set up, or its output is too rough on a hard page,
   this is the alternative: the user's own API key, read from a plain-text
   file in the SAME folder they already connected for their question bank —
   never typed into the app, never stored in IndexedDB, never written into
   the question bank JSON, and never part of any export or backup. It is
   read fresh from disk only at the moment the user explicitly clicks
   "Try external OCR" with the feature switched on in Settings, and the
   image is sent only to the endpoint that file names — nowhere else. */
const OCR_ENV_FILE = 'mcq-mastery.env';

/** Parse KEY=VALUE lines from a small text file, tolerating blank lines and
    # comments. Not a general .env parser — quoting/escaping is deliberately
    unsupported, so the format stays obvious to read and edit by hand. */
function parseEnvText(text) {
  const out = {};
  String(text || '').split('\n').forEach(raw => {
    const line = raw.trim();
    if (!line || line[0] === '#') return;
    const i = line.indexOf('=');
    if (i < 0) return;
    out[line.slice(0, i).trim()] = line.slice(i + 1).trim();
  });
  return out;
}

/** Read mcq-mastery.env from the connected folder. Read fresh every call —
    not cached — so editing the file and retrying works without a reload.
    Returns null if there is nothing to read (no folder connected, single-file
    tier with no folder handle, the file does not exist, or permission has
    lapsed) rather than throwing: those are all "unavailable", not errors. */
async function readOcrEnvFile() {
  if (!FileStore.dirHandle) return null;
  let fh;
  try {
    fh = await FileStore.dirHandle.getFileHandle(OCR_ENV_FILE, { create: false });
  } catch (e) {
    return null; // NotFoundError (no such file) and permission errors alike: just unavailable
  }
  const file = await fh.getFile();
  if (!file.size) return null;
  return parseEnvText(await file.text());
}

function downloadOcrEnvTemplate() {
  const sample = [
    '# ' + OCR_ENV_FILE + ' — external OCR configuration',
    '#',
    '# Save this file, filled in, directly in the same folder you connected',
    '# for your question bank (Settings -> Where your data lives). MCQ Mastery',
    '# reads it only when you click "Try external OCR" with that feature',
    '# switched on in Settings, and only to send that one image to ENDPOINT.',
    '# It is never written into your question bank file and never leaves',
    '# this folder any other way.',
    '#',
    '# ENDPOINT must accept an OpenAI-compatible chat-completions request with',
    '# an image_url content part — this covers OpenAI itself and most',
    '# OpenAI-compatible providers and local servers. Examples:',
    '#   https://api.openai.com/v1/chat/completions',
    '#   https://api.groq.com/openai/v1/chat/completions',
    'ENDPOINT=',
    '',
    '# Your API key for that endpoint.',
    'API_KEY=',
    '',
    '# The model name that endpoint expects, e.g. gpt-4o-mini',
    'MODEL='
  ].join('\n');
  download(OCR_ENV_FILE, new Blob([sample], { type: 'text/plain' }));
  toast('Template downloaded — fill it in and save it in your connected folder', 'ok', 5000);
}

/** Send the cropped/adjusted canvas to whatever OCR API the user has
    configured in mcq-mastery.env. Opt-in only, gated on its own Settings
    flag with its own honest copy — this is the one path in the app that
    sends anything over the network, and it never runs unless the user has
    both switched it on and provided their own endpoint and key. */
async function runExternalOCR(canvas, textArea, statusEl) {
  if (!Settings.get('externalOcrEnabled')) {
    await modal({
      title: 'External OCR is off',
      body: h('div', { class: 'stack' }, [
        h('p', {}, 'This sends the image to an API you configure yourself — your own key, your own endpoint — instead of reading it on this machine. That is a real trade: your own judgement on what you trust with exam content, in exchange for OCR that may read a hard page better than the local engine.'),
        h('p', { class: 'small muted' }, 'Turn it on in Settings → Images and OCR, then save a filled-in ' + OCR_ENV_FILE + ' in your connected folder — a template is one click away there.'),
        h('p', { class: 'small muted', style: 'margin:0' }, 'Nothing is sent anywhere until you do both and click this again.')
      ])
    });
    return;
  }
  if (!FileStore.dirHandle) {
    statusEl.textContent = 'External OCR needs a connected folder (Settings → Where your data lives) holding ' + OCR_ENV_FILE + '.';
    return;
  }
  if (textArea.value.trim() && !await confirmBox('Replace the current text?', 'Running external OCR will overwrite what is already in the box — including anything you typed or corrected by hand.', false, 'Run OCR')) return;
  statusEl.textContent = 'Reading ' + OCR_ENV_FILE + '…';
  let cfg;
  try { cfg = await readOcrEnvFile(); }
  catch (e) { statusEl.textContent = 'Could not read ' + OCR_ENV_FILE + ': ' + e.message; return; }
  if (!cfg || !cfg.ENDPOINT || !cfg.API_KEY) {
    statusEl.textContent = 'No usable ' + OCR_ENV_FILE + ' found — it needs an ENDPOINT= and an API_KEY= line. Download the template in Settings.';
    return;
  }
  statusEl.textContent = 'Sending the image to ' + cfg.ENDPOINT + '…';
  try {
    const res = await fetch(cfg.ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.API_KEY },
      body: JSON.stringify({
        model: cfg.MODEL || 'gpt-4o-mini',
        max_tokens: 1200,
        messages: [{
          role: 'user',
          content: [
            { type: 'text', text: 'Transcribe this multiple-choice exam question exactly as printed: the question stem, then each answer option on its own line prefixed with its letter, then "Answer: X" if the page states which is correct, then any explanation shown. Plain text only — no markdown, no commentary, nothing invented that is not on the page.' },
            { type: 'image_url', image_url: { url: canvas.toDataURL('image/jpeg', 0.85) } }
          ]
        }]
      })
    });
    if (!res.ok) throw new Error('API returned ' + res.status + ' — ' + (await res.text()).slice(0, 200));
    const json = await res.json();
    const text = json && json.choices && json.choices[0] && json.choices[0].message && json.choices[0].message.content;
    if (!text) throw new Error('The API response did not look like OCR text — check MODEL= and ENDPOINT= in ' + OCR_ENV_FILE + '.');
    textArea.value = text;
    textArea.dispatchEvent(new Event('input'));
    statusEl.textContent = 'External OCR complete. Check it against the image — nothing here is fact-checked for you.';
  } catch (e) {
    statusEl.textContent = 'External OCR failed: ' + e.message + ' — transcribe manually instead.';
  }
}

async function reviewDuplicate(q) {
  const fresh = await Questions.get(q.uuid);
  if (!fresh) { toast('That question no longer exists', 'bad'); return; }
  const bank = (await State.questions()).filter(x => x.uuid !== fresh.uuid && x.status !== 'merged' && x.status !== 'rejected');
  const index = buildIndex(bank);
  const dismissed = new Set(fresh.dismissedPairs || []);
  const pool = candidatesFor(fresh, index, fresh.uuid);
  let best = null;
  pool.forEach(o => {
    if (dismissed.has(o.uuid) || (o.dismissedPairs || []).indexOf(fresh.uuid) >= 0) return;
    const sim = similarity(fresh, o);
    const cls = classifyPair(fresh, o, sim);
    if (cls === 'distinct') return;
    if (!best || sim.score > best.sim.score) best = { other: o, sim, cls, conflict: answersConflict(fresh, o) };
  });
  if (!best) {
    // Nothing left to compare against — recheckQuestion settles the status,
    // clearing whatever pairing brought this into the queue and picking up
    // anything else that might still be holding it out of practice.
    await recheckQuestion(fresh, {});
    fresh.updatedAt = nowISO();
    await DB.put('questions', fresh); State.invalidate();
    toast('No duplicate remains — released from the queue', 'ok'); (function(){ State.importStep='check'; return go('import'); })(); return;
  }
  const item = { q: fresh, decision: 'review' };
  compareDialog(fresh, best, item, async () => {
    if (item.decision === 'merge') {
      // Merge is a bigger, harder-to-undo write than reject (recovering it
      // means finding the far less visible Unmerge control in Question
      // detail → Provenance), yet it sat as one of four equal-weight
      // buttons with zero confirmation while reject — the smaller change —
      // already had one.
      const ok = await confirmBox('Combine these into one record?', 'This merges ' + fresh.qid + ' into ' + best.other.qid + ' — both sources are kept, but ' + fresh.qid + ' stops appearing on its own. You can split them apart again later from Question detail → Provenance.');
      if (!ok) { State.importStep = 'check'; go('import'); return; }
      await mergeQuestions(best.other.uuid, fresh.uuid, 'Merged from review queue'); toast('Merged into ' + best.other.qid, 'ok');
    }
    else if (item.decision === 'reject') {
      // Unlike a staging candidate, this record already has a permanent
      // Question ID and is already in the database — rejecting it here is
      // a real status change to a persisted record, not discarding
      // something that was never written, so it gets the same kind of
      // confirmation Archive already has.
      const ok = await confirmBox('Reject this question?', 'It leaves the bank, but the record and its Question ID are retained — you can bring it back from the Question Bank by changing its status.');
      if (!ok) { State.importStep = 'check'; go('import'); return; }
      fresh.status = 'rejected'; fresh.updatedAt = nowISO(); await DB.put('questions', fresh); await audit('reject', 'question', fresh.qid, null, null, 'Rejected as duplicate'); toast('Rejected');
    }
    else {
      // 'sep' already recorded the dismissal and cleared this one pairing in
      // memory (see compareDialog) — a full recheck confirms nothing else is
      // still holding it back before persisting.
      await recheckQuestion(fresh, {});
      fresh.updatedAt = nowISO();
      await DB.put('questions', fresh);
      toast('Kept separate');
    }
    State.invalidate(); (function(){ State.importStep='check'; return go('import'); })();
  }, 'This record');
}

    card.appendChild(h('div', { class: 'card-h' }, [h('h3', { text: 'Why answers went wrong' }), h('div', { class: 'spacer' }), h('span', { class: 'tiny dim', text: total + ' incorrect attempt(s)' })]));
    rows.forEach(r => tb.appendChild(h('tr', {}, [
      h('td', { text: r.key }), h('td', { class: 'num', text: String(r.n) }),
      h('td', {}, h('div', { class: 'bar' }, h('i', { class: 'r', style: 'width:' + Math.round(r.share * 100) + '%' }))),
      h('td', { class: 'num right', text: Math.round(r.share * 100) + '%' })
    ])));
    card.appendChild(h('div', { class: 'tbl-wrap' }, h('table', {}, [h('thead', {}, h('tr', {}, ['Mistake category', 'Count', '', 'Share'].map(x => h('th', { text: x })))), tb])));
    root.appendChild(card);
    return;
  }
  if (AnaState.by === 'mode') {
    const m = new Map();
    attempts.forEach(a => { const k = a.mode; if (!m.has(k)) m.set(k, { n: 0, c: 0, ms: 0 }); const g = m.get(k); g.n++; if (a.correct) g.c++; g.ms += a.ms || 0; });
    card.appendChild(h('div', { class: 'card-h' }, h('h3', { text: 'Performance by practice mode' })));
    Array.from(m.entries()).forEach(([k, g]) => tb.appendChild(h('tr', {}, [
      h('td', { text: (MODES[k] || { label: k }).label }), h('td', { class: 'num', text: String(g.n) }),
      h('td', { class: 'num', text: String(g.c) }),
      h('td', {}, h('div', { class: 'bar' }, h('i', { class: g.c / g.n >= 0.75 ? 'g' : g.c / g.n >= 0.6 ? 'a' : 'r', style: 'width:' + Math.round(g.c / g.n * 100) + '%' }))),
      h('td', { class: 'num right', text: pct(g.c, g.n) }),
      h('td', { class: 'num right', text: fmtDur(g.ms / g.n) })
    ])));
    card.appendChild(h('div', { class: 'tbl-wrap' }, h('table', {}, [h('thead', {}, h('tr', {}, ['Mode', 'Attempts', 'Correct', '', 'Accuracy', 'Avg time'].map(x => h('th', { text: x })))), tb])));
    root.appendChild(card);
    return;
  }

  const keyFn = {
    domain: q => q.domainId || null,
    topic: q => q.topic || '(no topic)',
    module: q => q.srcModule || '(no module)',
    source: q => q.sourceId,
    difficulty: q => q.difficulty
  }[AnaState.by];
  const groups = groupStats(active, keyFn);
  const label = (k) => {
    if (AnaState.by === 'domain') return k === '—' || !k ? 'Unmapped' : State.domainName(k);
    if (AnaState.by === 'source') { const s = sources.find(x => x.id === k); return s ? s.title : '(no source)'; }
    return k;
  };
  // attach period attempts
  const attByKey = new Map();
  attempts.forEach(a => {
    const q = byUuid.get(a.questionUuid); if (!q) return;
    const k = keyFn(q) || '—';
    if (!attByKey.has(k)) attByKey.set(k, { n: 0, c: 0, g: 0, ms: 0 });
    const g = attByKey.get(k); g.n++; if (a.correct) g.c++; if (a.correct && a.confidence === 'guessed') g.g++; g.ms += a.ms || 0;
  });

  card.appendChild(h('div', { class: 'card-h' }, [h('h3', { text: 'By ' + AnaState.by }), h('div', { class: 'spacer' }), h('span', { class: 'tiny dim', text: 'weak = below expectation on the evidence available' })]));
  groups.sort((a, b) => (b.total - a.total)).forEach(g => {
    const per = attByKey.get(g.key) || { n: 0, c: 0, g: 0, ms: 0 };
    const w = weaknessScore(g, Settings.get('weakMinSample'));
    const acc = per.n ? per.c / per.n : null;
    tb.appendChild(h('tr', {}, [
      h('td', {}, [h('b', { class: 'small', text: label(g.key) }), w.score == null ? h('div', { class: 'evidence', text: 'insufficient evidence' }) : h('div', { class: 'evidence', text: w.why[0] })]),
      h('td', { class: 'num', text: String(g.total) }),
      h('td', { class: 'num', text: pct(g.attempted, g.total) }),
      h('td', { class: 'num', text: g.firstAcc == null ? '—' : Math.round(g.firstAcc * 100) + '%' }),
      h('td', {}, h('div', { class: 'bar' }, h('i', { class: acc == null ? '' : acc >= 0.75 ? 'g' : acc >= 0.6 ? 'a' : 'r', style: 'width:' + Math.round((acc || 0) * 100) + '%' }))),
      h('td', { class: 'num right', text: acc == null ? '—' : Math.round(acc * 100) + '%' }),
      h('td', { class: 'num right', text: per.c ? Math.round(per.g / per.c * 100) + '%' : '—' }),
      h('td', { class: 'num right', text: per.n ? fmtDur(per.ms / per.n) : '—' }),
      h('td', { class: 'num right', text: w.score == null ? '—' : String(w.score) })
    ]));
  });
  card.appendChild(h('div', { class: 'tbl-wrap' }, h('table', {}, [
    h('thead', {}, h('tr', {}, ['Group', 'Questions', 'Coverage', 'First-attempt', '', 'Accuracy', 'Guessed', 'Avg time', 'Weakness'].map(x => h('th', { text: x })))), tb
  ])));
  root.appendChild(card);
};


/* ============================================================================
   14 · Backup, export and restore
   The backup is a plain ZIP of JSON files. Anything that can read a ZIP can
   read your data — that is the migration path, not a promise.
   ========================================================================== */

const BACKUP_STORES = ['courses', 'questions', 'questionVersions', 'sources', 'batches', 'attempts', 'sessions', 'settings', 'audit', 'images', 'idRegister', 'tombstones', 'presets', 'notes'];

/**
 * A backup that must succeed before anything is destroyed.
 *
 * Unlike the ordinary backup button this one is not advice — the caller
 * aborts if it fails. When a data folder is connected the file is written
 * there and read back to confirm it exists and is not empty, because a
 * backup nobody verified is not a backup.
 *
 * Returns { ok, where, name, size }.
 */
async function safetyBackup(reason) {
  const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
  const name = 'mcq-mastery-safety-backup-' + stamp + '.zip';
  try {
    const { blob, manifest } = await buildBackup('all');
    if (!blob || !blob.size) throw new Error('The backup came out empty.');

    // Prefer the connected folder: a download can be silently blocked or
    // land somewhere the person will not find again.
    if (FileStore.connected && FileStore.dirHandle) {
      const fh = await FileStore.dirHandle.getFileHandle(name, { create: true });
      const w = await fh.createWritable();
      await w.write(blob);
      await w.close();
      const back = await (await fh.getFile());
      if (!back || back.size !== blob.size) throw new Error('The backup file did not write correctly.');
      await Settings.set('lastBackupAt', nowISO());
      await audit('backup', 'system', '', null, { scope: 'all', reason: reason, file: name, counts: manifest.counts }, 'Safety backup before a destructive action');
      return { ok: true, where: 'folder', name: name, size: blob.size };
    }

    download(name, blob);
    await Settings.set('lastBackupAt', nowISO());
    await audit('backup', 'system', '', null, { scope: 'all', reason: reason, file: name, counts: manifest.counts }, 'Safety backup before a destructive action');
    return { ok: true, where: 'download', name: name, size: blob.size };
  } catch (e) {
    return { ok: false, error: e.message || String(e) };
  }
}

/**
 * Run a safety backup and show the result. Returns true only when it is safe
 * to proceed — either the backup worked, or the person explicitly accepted
 * going ahead without one.
 */
async function requireSafetyBackup(reason) {
  toast('Taking a safety backup first…');
  const res = await safetyBackup(reason);
  if (res.ok) {
    const proceed = await modal({
      title: 'Safety backup saved',
      body: h('div', { class: 'stack' }, [
        h('div', { class: 'notice ok small' }, res.where === 'folder'
          ? 'Written into your data folder as ' + res.name + ' (' + bytes(res.size) + ').'
          : 'Downloaded as ' + res.name + ' (' + bytes(res.size) + '). Check your downloads folder before continuing.'),
        h('p', { class: 'small muted' }, 'If anything about the next step goes wrong, restore this file from Backup & Restore.')
      ]),
      actions: [{ label: 'Stop here', value: false }, { label: 'Continue', value: true, kind: 'primary' }]
    });
    return !!proceed;
  }
  const proceed = await modal({
    title: 'The safety backup failed',
    body: h('div', { class: 'stack' }, [
      h('div', { class: 'notice bad' }, res.error),
      h('p', {}, 'Nothing has been deleted. Going ahead now would leave you with no way back.'),
      h('p', { class: 'small muted' }, 'The safe course is to stop, fix the backup, and try again.')
    ]),
    actions: [{ label: 'Stop — do not delete anything', value: false, kind: 'primary' }, { label: 'Delete anyway, without a backup', value: true, kind: 'danger' }]
  });
  return !!proceed;
}

async function buildBackup(scope) {
  const entries = [];
  const counts = {}, checks = {};
  for (const name of BACKUP_STORES) {
    let rows = await DB.all(name);
    if (scope === 'course' && State.course) {
      if (name === 'courses') rows = rows.filter(r => r.id === State.course.id);
      else if (name === 'idRegister') rows = rows.filter(r => r.courseId === State.course.id);
      else if (['questions', 'sources', 'batches', 'attempts', 'sessions', 'presets'].indexOf(name) >= 0) rows = rows.filter(r => r.courseId === State.course.id);
    }
    const json = JSON.stringify(rows);
    counts[name] = rows.length;
    checks[name] = await sha256(json);
    entries.push({ name: 'data/' + name + '.json', data: json });
  }
  const manifest = {
    app: APP.name, appVersion: APP.version, schemaVersion: APP.schema,
    createdAt: nowISO(), scope: scope || 'all',
    courseId: scope === 'course' && State.course ? State.course.id : null,
    counts, checksums: checks, checksumAlgorithm: 'SHA-256 over the JSON text of each file'
  };
  entries.unshift({ name: 'manifest.json', data: JSON.stringify(manifest, null, 2) });
  entries.push({
    name: 'README.txt',
    data: [
      APP.name + ' backup', '',
      'Created: ' + manifest.createdAt,
      'Schema version: ' + manifest.schemaVersion,
      '', 'Every file under data/ is a JSON array from one object store.',
      'manifest.json lists record counts and a SHA-256 checksum for each file.',
      'To restore, open the app and use Backup & Restore → Restore from backup.',
      'To migrate elsewhere, read the JSON directly — no proprietary format is used.'
    ].join('\n')
  });
  return { blob: await zipFiles(entries), manifest };
}

/** Same shape as buildBackup(), but sourced from an in-memory payload — a
    Drive snapshot already pulled down — rather than IndexedDB. Used when a
    sync decision is about to overwrite Drive's copy: that content was never
    in this browser's database, so buildBackup() can't reach it. */
async function buildBackupFromPayload(payload) {
  const entries = [];
  const counts = {}, checks = {};
  for (const name of BACKUP_STORES) {
    const rows = Array.isArray(payload.stores && payload.stores[name]) ? payload.stores[name] : [];
    const json = JSON.stringify(rows);
    counts[name] = rows.length;
    checks[name] = await sha256(json);
    entries.push({ name: 'data/' + name + '.json', data: json });
  }
  const manifest = {
    app: APP.name, appVersion: APP.version, schemaVersion: payload.schema || APP.schema,
    createdAt: nowISO(), scope: 'all', courseId: null,
    counts, checksums: checks, checksumAlgorithm: 'SHA-256 over the JSON text of each file'
  };
  entries.unshift({ name: 'manifest.json', data: JSON.stringify(manifest, null, 2) });
  entries.push({
    name: 'README.txt',
    data: [
      APP.name + ' backup — the Google Drive copy, saved just before it was overwritten', '',
      'Created: ' + manifest.createdAt,
      'Schema version: ' + manifest.schemaVersion,
      '', 'Every file under data/ is a JSON array from one object store.',
      'manifest.json lists record counts and a SHA-256 checksum for each file.',
      'To restore, open the app and use Backup & Restore → Restore from backup.',
      'To migrate elsewhere, read the JSON directly — no proprietary format is used.'
    ].join('\n')
  });
  return { blob: await zipFiles(entries), manifest };
}

/** Mirrors safetyBackup(), for a Drive payload about to be overwritten
    rather than this browser's own IndexedDB. Always downloads — Drive is
    never the active backend at the same time a local folder is (see
    "Where your data lives" in Settings), so there is nowhere else to put it. */
async function backupExternalPayload(payload, filePrefix, reason) {
  const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
  const name = filePrefix + '-safety-backup-' + stamp + '.zip';
  try {
    const { blob, manifest } = await buildBackupFromPayload(payload);
    if (!blob || !blob.size) throw new Error('The backup came out empty.');
    download(name, blob);
    await audit('backup', 'system', '', null, { scope: 'all', reason, file: name, counts: manifest.counts }, 'Safety backup before it was overwritten');
    return { ok: true, name, size: blob.size };
  } catch (e) {
    return { ok: false, error: e.message || String(e) };
  }
}

/** Same "back up first, ask before proceeding without one" shape as
    requireSafetyBackup(), for content about to be overwritten that was
    never in this browser's IndexedDB to begin with — a Drive copy, or an
    existing local file connected to without being loaded. `label` names
    it in the dialog copy ("the Drive copy", "the existing file"). */
async function requireExternalBackup(payload, filePrefix, label, reason) {
  toast('Backing up ' + label + ' first…');
  const res = await backupExternalPayload(payload, filePrefix, reason);
  if (res.ok) {
    const proceed = await modal({
      title: 'Backup saved',
      body: h('div', { class: 'stack' }, [
        h('div', { class: 'notice ok small' }, 'A copy of ' + label + ' was downloaded as ' + res.name + ' (' + bytes(res.size) + '). Check your downloads folder before continuing.'),
        h('p', { class: 'small muted' }, 'If anything about the next step goes wrong, restore this file from Backup & Restore.')
      ]),
      actions: [{ label: 'Stop here', value: false }, { label: 'Continue', value: true, kind: 'primary' }]
    });
    return !!proceed;
  }
  const proceed = await modal({
    title: 'Could not back up ' + label,
    body: h('div', { class: 'stack' }, [
      h('div', { class: 'notice bad' }, res.error),
      h('p', {}, 'Nothing has been overwritten. Going ahead now would leave no way back to ' + label + '.'),
      h('p', { class: 'small muted' }, 'The safe course is to stop, fix the backup, and try again.')
    ]),
    actions: [{ label: 'Stop — do not overwrite', value: false, kind: 'primary' }, { label: 'Overwrite anyway, without a backup', value: true, kind: 'danger' }]
  });
  return !!proceed;
}
