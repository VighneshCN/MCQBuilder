/* ============================================================
   MCQ MASTERY — "controlled document" design system
   Palette, type and structure derive from audit working papers:
   ledger stock, ink-blue rules, pencil-red tick marks, stamped
   document-control numbers set in monospace. A blue-to-violet
   gradient (--grad, --accent-1/--accent-2) marks primary actions and
   headline numbers; the "Sora Var" display font on headings gives it
   presence beyond the ledger register. Sora is embedded as a base64
   data: URI (see the @font-face just below) rather than linked, so it
   costs nothing at runtime and never becomes a third network call —
   the "no network requests" claim in ARCHITECTURE.md still holds.
   ============================================================ */
:root{
  --ink-900:#0E1720; --ink-800:#16202B; --ink-700:#22303E;
  --paper:#E9EEF2; --surface:#FFFFFF; --surface-2:#F3F6F8; --surface-3:#E3EAEF;
  --rule:#C3D0DA; --rule-soft:#DBE3E9;
  --txt:#16202B; --txt-2:#48596A; --txt-3:#5A6A7B;
  --blue:#1F4E79; --blue-2:#2C6BA0; --blue-tint:#E4EDF5;
  --pencil:#BC432A; --pencil-tint:#FAE8E3;
  --green:#12654C; --green-tint:#DFF0E8;
  --amber:#8A5A0B; --amber-tint:#FAEED6;
  --rose:#95203A; --rose-tint:#FBE3E7;
  --violet:#463A85; --violet-tint:#E9E6F6;
  --focus:#2C6BA0;
  --accent-1:#1F4E79; --accent-2:#5B3FBF;
  --grad:linear-gradient(135deg,var(--accent-1) 0%,var(--accent-2) 100%);
  --shadow:0 1px 2px rgba(16,32,46,.07),0 8px 24px -14px rgba(16,32,46,.28);
  --shadow-lg:0 4px 10px rgba(16,32,46,.09),0 32px 68px -26px rgba(16,32,46,.40);
  --r:8px; --r-lg:14px;
  --mono:ui-monospace,"SF Mono","SFMono-Regular","Cascadia Mono","Segoe UI Mono","Roboto Mono",Menlo,Consolas,monospace;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --display:'Sora Var',var(--ui);
  --rail:212px;
}
:root,[data-theme="light"]{color-scheme:light}
[data-theme="dark"]{color-scheme:dark;
  --paper:#0C141C; --surface:#151F29; --surface-2:#1B2733; --surface-3:#23303D;
  --rule:#2E3E4C; --rule-soft:#243240;
  --txt:#DDE6EC; --txt-2:#9DAEBC; --txt-3:#8898A4;
  --blue:#79B2E0; --blue-2:#9BC9EE; --blue-tint:#16293A;
  --pencil:#E98D76; --pencil-tint:#33201B;
  --green:#6DC5A4; --green-tint:#122C25;
  --amber:#DFAE5C; --amber-tint:#31260F;
  --rose:#E68699; --rose-tint:#341A21;
  --violet:#A79BE4; --violet-tint:#221D3B;
  --focus:#9BC9EE;
  --accent-1:#79B2E0; --accent-2:#B79CF0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -18px rgba(0,0,0,.8);
  --shadow-lg:0 4px 14px rgba(0,0,0,.45),0 34px 78px -26px rgba(0,0,0,.85);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--txt);
  font-family:var(--ui); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overscroll-behavior-y:none;
}
h1,h2,h3,h4{margin:0; font-family:var(--display); font-weight:600; letter-spacing:-.01em}
p{margin:0 0 .7em}
a{color:var(--blue)}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:3px}
::selection{background:var(--blue-tint); color:var(--txt)}
hr{border:0;border-top:1px solid var(--rule-soft);margin:16px 0}

/* --- document-control typography ------------------------------------ */
.eyebrow{
  font-family:var(--mono); font-size:10.5px; font-weight:600;
  letter-spacing:.14em; text-transform:uppercase; color:var(--txt-3);
}
.docnum{font-family:var(--mono); font-size:12px; letter-spacing:.02em; font-variant-numeric:tabular-nums}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums}
.page-title{font-size:23px; letter-spacing:-.02em}
.muted{color:var(--txt-2)}
.dim{color:var(--txt-3)}
.small{font-size:13px}
.tiny{font-size:12px}
.right{text-align:right}
.center{text-align:center}
.nowrap{white-space:nowrap}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.spacer{flex:1}
.hidden{display:none !important}

/* --- app frame -------------------------------------------------------- */
.app{display:grid; grid-template-columns:var(--rail) 1fr; min-height:100dvh}
.rail{
  background:linear-gradient(180deg,var(--ink-700) 0%,var(--ink-900) 100%);
  color:#D6E0E8; display:flex; flex-direction:column;
  position:sticky; top:0; height:100dvh; border-right:1px solid var(--ink-900);
}
[data-theme="dark"] .rail{background:linear-gradient(180deg,#0F1922 0%,#080D13 100%)}
.brand{padding:18px 16px 14px; border-bottom:1px solid rgba(255,255,255,.09)}
.brand-mark{display:flex;align-items:center;gap:9px}
.brand-tick{
  width:22px;height:22px;flex:none;border:1.5px solid #E98D76;border-radius:3px;
  display:grid;place-items:center;color:#E98D76;font-family:var(--mono);font-size:13px;font-weight:700;line-height:1
}
.brand-name{font-family:var(--mono);font-size:12.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:#F0F5F8}
.brand-sub{margin-top:5px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#7C8FA0}
.course-pick{padding:12px 12px 10px;border-bottom:1px solid rgba(255,255,255,.09)}
.course-pick label{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#7C8FA0;margin-bottom:5px}
.course-pick select{
  width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);
  color:#E8EFF4;border-radius:var(--r);padding:7px 8px;font-size:13.5px;
  text-overflow:ellipsis;overflow:hidden;white-space:nowrap;
}
.course-pick select option{background:#16202B;color:#E8EFF4}
.nav{padding:10px 8px;flex:1;overflow:auto}
.nav-item{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:none;border:0;color:#B9C8D3;padding:8px 10px;border-radius:var(--r);
  cursor:pointer;font-size:14px;position:relative;
}
.nav-item:hover{background:rgba(255,255,255,.07);color:#F0F5F8}
.nav-item[aria-current="page"]{background:rgba(255,255,255,.11);color:#fff;font-weight:500}
.nav-item[aria-current="page"]::before{
  content:"";position:absolute;left:-8px;top:6px;bottom:6px;width:3px;background:#E98D76;border-radius:0 3px 3px 0
}
.nav-ico{width:17px;flex:none;text-align:center;font-family:var(--mono);font-size:12.5px;opacity:.85}
.nav-badge{
  margin-left:auto;font-family:var(--mono);font-size:10.5px;font-weight:600;
  background:#C0442B;color:#fff;border-radius:20px;padding:1px 6px;
}
.storagebar{margin-top:auto;padding:9px 10px;border-top:1px solid rgba(255,255,255,.09);display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12.5px;line-height:1.45}
.storagebar .sb-dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--amber)}
.storagebar .sb-label{color:rgba(255,255,255,.82);flex:1;min-width:0;word-break:break-word}
.storagebar .sb-sub{width:100%;color:rgba(255,255,255,.6)}
.storagebar[data-tone="ok"] .sb-dot{background:var(--green)}
.storagebar[data-tone="bad"] .sb-dot{background:var(--rose)}
.storagebar[data-tone="bad"] .sb-label{color:#ffd7de}
.storagebar .btn{width:100%;margin-top:2px}
.rail-foot{padding:10px;border-top:1px solid rgba(255,255,255,.09);display:flex;gap:6px}
.rail-btn{
  flex:1;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);color:#C6D4DE;
  border-radius:var(--r);padding:6px;cursor:pointer;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase
}
.rail-btn:hover{background:rgba(255,255,255,.14);color:#fff}

.main{min-width:0;display:flex;flex-direction:column}
.control-band{
  position:sticky;top:0;z-index:20;background:var(--surface);
  border-bottom:1px solid var(--rule);padding:14px 26px 12px;
}
.control-band::after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--grad);
  opacity:.55;
}
.band-top{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.band-stats{display:flex;gap:22px;margin-left:auto;flex-wrap:wrap}
.band-stat{text-align:right}
.band-stat b{
  display:block;font-family:var(--mono);font-size:16px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums;
  color:var(--accent-1);background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.view{padding:22px 26px 80px;max-width:1220px;width:100%}
@media(max-width:880px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;inset:0 auto 0 0;width:250px;z-index:60;transform:translateX(-100%);transition:transform .18s ease}
  .rail.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(10,20,28,.5);z-index:55}
  .control-band{padding:11px 14px}
  .view{padding:16px 14px 90px}
  .band-stats{width:100%;margin-left:0;gap:16px;justify-content:flex-start}
  .band-stat{text-align:left}
  .btn{min-height:40px}
  .btn.sm{min-height:36px;min-width:36px;padding:6px 11px}
  .opt{padding:14px 15px}
  .nav-item{min-height:44px}
  .rail-btn{min-height:40px}
  .chip{min-height:36px}
  .palette{grid-template-columns:repeat(auto-fill,minmax(44px,1fr))}
  /* The sticky page header sits under z-index:20; toasts (z-index:200)
     would otherwise land right on top of the title on a narrow screen where
     there is no wide margin to sit in beside it. Push them below it instead. */
  .toasts{top:auto;bottom:12px;right:12px;left:12px;width:auto;max-width:none}
}
.btn.menu-btn{display:none}
@media(max-width:880px){.btn.menu-btn{display:inline-flex}}

/* --- surfaces --------------------------------------------------------- */
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.card.clickable{cursor:pointer;transition:transform .14s ease,box-shadow .14s ease,border-color .14s ease;width:100%}
.card.clickable:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--accent-1)}
.card.clickable:active{transform:translateY(0)}
.card-h{padding:13px 16px;border-bottom:1px solid var(--rule-soft);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-b{padding:16px}
.card-b.tight{padding:10px 16px}
.grid{display:grid;gap:14px;align-items:start}
.grid.stretch{align-items:stretch}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media(max-width:1000px){.g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.g2,.g3,.g4,.g5{grid-template-columns:1fr}}

/* --- metric tiles ----------------------------------------------------- */
.tile{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-lg);padding:13px 15px;position:relative;overflow:hidden}
.tile .eyebrow{display:block;margin-bottom:7px}
.tile b{
  font-family:var(--mono);font-size:26px;font-weight:600;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;display:block;
  color:var(--accent-1);background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.tile .sub{margin-top:6px;font-size:12.5px;color:var(--txt-2)}
.tile.hot{border-color:var(--pencil)}
.tile.hot b{color:var(--pencil);background:none;-webkit-text-fill-color:currentColor}
.tile.good b{color:var(--green);background:none;-webkit-text-fill-color:currentColor}

.method-row{display:flex;align-items:flex-start;gap:11px;padding:8px;margin:0 -8px;border-radius:var(--r);cursor:pointer;text-align:left;width:calc(100% + 16px);background:none;border:0;font:inherit;color:inherit}
.method-row:hover,.method-row:focus-visible{background:var(--surface-2)}
.method-ico{flex:none;width:32px;height:32px;border-radius:var(--r);background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:15px;color:var(--txt-2)}
.method-row:hover .method-ico,.method-row:focus-visible .method-ico{background:var(--blue-tint);color:var(--blue)}
.method-title{font-family:var(--display);font-weight:600;font-size:13.5px;color:var(--txt)}
.card-desc{font-size:13.5px;line-height:1.45;color:var(--txt-2);margin-top:2px}
.method-ico.correct-pick{color:#fff}
[data-theme="dark"] .method-ico.correct-pick{color:#0B141C}
.q-prev-lg{font-size:15px;line-height:1.5}
.evidence{font-size:13.5px;line-height:1.45;color:var(--txt-2)}

/* --- buttons ---------------------------------------------------------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  background:var(--surface);border:1px solid var(--rule);color:var(--txt);
  padding:7px 13px;border-radius:var(--r);cursor:pointer;font-size:13.5px;
  transition:background .12s ease,border-color .12s ease,transform .06s ease,filter .12s ease,box-shadow .12s ease;
  text-decoration:none;white-space:nowrap;
}
.btn:hover{background:var(--surface-2);border-color:var(--txt-3)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.primary{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 3px 10px -3px rgba(31,78,121,.4)}
[data-theme="dark"] .btn.primary{color:#0B141C;box-shadow:0 3px 12px -3px rgba(121,178,224,.35)}
.btn.primary:hover{filter:brightness(1.08);box-shadow:0 5px 16px -3px rgba(31,78,121,.45)}
[data-theme="dark"] .btn.primary:hover{box-shadow:0 5px 18px -3px rgba(121,178,224,.4)}
.btn.primary:active{filter:brightness(.96)}
.btn.danger{background:var(--rose);border-color:var(--rose);color:#fff}
[data-theme="dark"] .btn.danger{color:#1A0E12}
.btn.ghost{background:transparent;border-color:transparent;color:var(--txt-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--txt)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.lg{padding:11px 20px;font-size:15px}
.btn.block{width:100%}
.btn-group{display:inline-flex;border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.btn-group button{border:0;background:none;padding:6px 12px;cursor:pointer;font-size:13px;color:var(--txt-2);border-right:1px solid var(--rule-soft)}
.btn-group button:last-child{border-right:0}
.btn-group button[aria-pressed="true"]{background:var(--blue);color:#fff}
[data-theme="dark"] .btn-group button[aria-pressed="true"]{color:#0B141C}

/* --- form controls ---------------------------------------------------- */
.field{display:flex;flex-direction:column;gap:5px}
.field > label{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--txt-3)}
input[type=text],input[type=number],input[type=search],input[type=date],select,textarea{
  background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);
  padding:7px 9px;font-size:14px;width:100%;
}
textarea{resize:vertical;min-height:70px;line-height:1.5}
input:disabled,select:disabled,textarea:disabled{background:var(--surface-3);color:var(--txt-3)}
.check{display:flex;align-items:flex-start;gap:8px;cursor:pointer;font-size:13.5px;padding:2px 0}
.check input{margin-top:3px;flex:none;accent-color:var(--blue)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  border:1px solid var(--rule);background:var(--surface);border-radius:20px;
  padding:4px 11px;font-size:12.5px;cursor:pointer;color:var(--txt-2)
}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
[data-theme="dark"] .chip[aria-pressed="true"]{color:#0B141C}

/* --- status badges (verification vocabulary) -------------------------- */
.badge{
  display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);
  font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  padding:2.5px 7px;border-radius:3px;border:1px solid transparent;white-space:nowrap
}
.b-active{background:var(--green-tint);color:var(--green);border-color:var(--green)}
.b-draft{background:var(--surface-3);color:var(--txt-2);border-color:var(--rule)}
.b-review{background:var(--amber-tint);color:var(--amber);border-color:var(--amber)}
.b-conflict{background:var(--rose-tint);color:var(--rose);border-color:var(--rose)}
.b-dup{background:var(--violet-tint);color:var(--violet);border-color:var(--violet)}
.b-arch{background:var(--surface-3);color:var(--txt-3);border-color:var(--rule)}
.b-info{background:var(--blue-tint);color:var(--blue);border-color:var(--blue)}

/* --- the signature: audit tick-mark gutter ---------------------------- */
.tick{
  width:22px;flex:none;align-self:stretch;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:13px;font-weight:700;line-height:1;
  border-right:1px solid var(--rule-soft);color:var(--txt-3);
}
.tick[data-mark="verified"]{color:var(--green)}
.tick[data-mark="review"]{color:var(--amber)}
.tick[data-mark="conflict"]{color:var(--rose)}
.tick[data-mark="dup"]{color:var(--violet)}

/* --- tables ----------------------------------------------------------- */
.tbl-wrap{overflow:auto;border-radius:0 0 var(--r-lg) var(--r-lg)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{
  text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--txt-3);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--rule);
  background:var(--surface-2);position:sticky;top:0;z-index:2;white-space:nowrap
}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--txt)}
td{padding:9px 12px;border-bottom:1px solid var(--rule-soft);vertical-align:top}
tbody tr:hover{background:var(--surface-2)}
tbody tr.sel{background:var(--blue-tint)}
td.gut{width:26px;padding:9px 0 9px 10px;font-family:var(--mono);font-weight:700}
.q-prev{max-width:520px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.bar{height:5px;background:var(--surface-3);border-radius:3px;overflow:hidden;min-width:52px}
.bar > i{display:block;height:100%;background:var(--blue);border-radius:3px}
.bar > i.g{background:var(--green)} .bar > i.a{background:var(--amber)} .bar > i.r{background:var(--pencil)}

/* --- empty / notice --------------------------------------------------- */
.empty{padding:38px 22px;text-align:center;color:var(--txt-2)}
.empty h3{margin-bottom:6px;font-size:16px;color:var(--txt)}
.notice{
  border:1px solid var(--rule);border-left:3px solid var(--blue);background:var(--surface-2);
  border-radius:var(--r);padding:11px 13px;font-size:13.5px
}
.notice.warn{border-left-color:var(--amber);background:var(--amber-tint)}
.notice.bad{border-left-color:var(--pencil);background:var(--pencil-tint)}
.notice.ok{border-left-color:var(--green);background:var(--green-tint)}
.notice.small{font-size:13.5px}

/* --- practice / question rendering ------------------------------------ */
.q-shell{max-width:840px;margin:0 auto}
.q-stem{font-size:17.5px;line-height:1.62;margin:4px 0 18px;white-space:pre-wrap;overflow-wrap:break-word;word-break:break-word}
@media(max-width:640px){.q-stem{font-size:16.5px}}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-lg);
  padding:13px 15px;cursor:pointer;font-size:15.5px;line-height:1.5;
  transition:border-color .12s ease,background .12s ease;
  overflow-wrap:break-word;word-break:break-word;
}
.opt:hover:not(:disabled){border-color:var(--blue);background:var(--blue-tint)}
.opt:disabled{cursor:default}
.opt .lt{
  font-family:var(--mono);font-weight:700;font-size:13px;width:24px;height:24px;flex:none;
  border:1px solid var(--rule);border-radius:5px;display:grid;place-items:center;margin-top:1px;color:var(--txt-2)
}
.opt[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-tint)}
.opt[aria-pressed="true"] .lt{background:var(--blue);border-color:var(--blue);color:#fff}
.opt.correct{border-color:var(--green);background:var(--green-tint)}
.opt.correct .lt{background:var(--green);border-color:var(--green);color:#fff}
.opt.wrong{border-color:var(--pencil);background:var(--pencil-tint)}
.opt.wrong .lt{background:var(--pencil);border-color:var(--pencil);color:#fff}
[data-theme="dark"] .opt[aria-pressed="true"] .lt,
[data-theme="dark"] .opt.correct .lt,
[data-theme="dark"] .opt.wrong .lt{color:#0B141C}
.reveal{margin-top:18px;border-top:1px solid var(--rule);padding-top:16px}
.exp{background:var(--surface-2);border:1px solid var(--rule-soft);border-radius:var(--r-lg);padding:13px 15px;white-space:pre-wrap;font-size:14.5px;line-height:1.6;overflow-wrap:break-word;word-break:break-word}
.qmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}

/* --- exam palette ----------------------------------------------------- */
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;max-height:300px;overflow:auto;padding:2px}
.pal{
  aspect-ratio:1;border:1px solid var(--rule);background:var(--surface);border-radius:5px;
  font-family:var(--mono);font-size:12px;cursor:pointer;color:var(--txt-2);position:relative
}
.pal.answered{background:var(--blue);border-color:var(--blue);color:#fff}
[data-theme="dark"] .pal.answered{color:#0B141C}
.pal.flagged::after{content:"";position:absolute;top:2px;right:2px;width:6px;height:6px;background:var(--pencil);border-radius:50%}
.pal.cur{outline:2px solid var(--focus);outline-offset:1px}
.timer{font-family:var(--mono);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.timer.low{color:var(--pencil)}

/* --- modal ------------------------------------------------------------ */
.modal-bg{position:fixed;inset:0;background:rgba(10,20,28,.55);display:grid;place-items:center;z-index:100;padding:16px}
.modal{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);width:min(760px,100%);max-height:88dvh;display:flex;flex-direction:column}
.modal.wide{width:min(1080px,100%)}
.modal-h{padding:14px 18px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:10px}
.modal-b{padding:18px;overflow:auto}
.modal-f{padding:12px 18px;border-top:1px solid var(--rule);display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}

/* --- toast ------------------------------------------------------------ */
.toasts{position:fixed;top:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none;width:calc(100% - 32px);max-width:400px}
.toast{background:var(--ink-800);color:#EAF1F6;padding:10px 15px;border-radius:var(--r);box-shadow:var(--shadow-lg);font-size:13.5px;border-left:3px solid var(--blue-2);width:100%}
.toast.ok{border-left-color:#6DC5A4} .toast.bad{border-left-color:#E98D76} .toast.warn{border-left-color:#DFAE5C}

/* --- dropzone & import ------------------------------------------------ */
.drop{
  border:2px dashed var(--rule);border-radius:var(--r-lg);padding:34px 18px;text-align:center;
  background:var(--surface-2);cursor:pointer;transition:border-color .12s ease,background .12s ease
}
.drop:hover,.drop.over{border-color:var(--blue);background:var(--blue-tint)}
.steps{display:flex;gap:0;flex-wrap:wrap;margin-bottom:16px;border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.step{flex:1;min-width:112px;padding:9px 11px;border-right:1px solid var(--rule-soft);font-size:12.5px;color:var(--txt-3)}
.step:last-child{border-right:0}
.step b{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase}
.step[data-on="1"]{background:var(--blue-tint);color:var(--blue)}
.step[data-done="1"]{color:var(--green)}
.recon{width:100%;font-size:13.5px}
.recon td{padding:6px 10px}
.recon tr.total td{border-top:2px solid var(--txt);font-weight:600;background:var(--surface-2)}
.recon .amt{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.balanced{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.conf{display:inline-block;width:34px;height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden;vertical-align:middle}
.conf > i{display:block;height:100%}
.diffbox{background:var(--surface-2);border:1px solid var(--rule-soft);border-radius:var(--r);padding:10px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;overflow-wrap:break-word;word-break:break-word}
mark.dif{background:var(--amber-tint);color:var(--amber);border-radius:2px;padding:0 2px;font-weight:600}
.imgstage{background:var(--surface-3);border:1px solid var(--rule);border-radius:var(--r);overflow:auto;max-height:440px;display:grid;place-items:center;padding:8px}
.imgstage canvas,.imgstage img{max-width:100%;display:block}
kbd{font-family:var(--mono);font-size:11px;background:var(--surface-3);border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px;padding:1px 5px}
.scroll-y{max-height:420px;overflow:auto}
.dl-list{display:flex;flex-direction:column;gap:8px}
.srcline{font-family:var(--mono);font-size:11.5px;color:var(--txt-3);word-break:break-word}
progress{width:100%;height:6px;appearance:none;border:0}
progress::-webkit-progress-bar{background:var(--surface-3);border-radius:3px}
progress::-webkit-progress-value{background:var(--blue);border-radius:3px}
@media(prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
@media print{.rail,.control-band,.btn,.toasts{display:none !important}.app{display:block}.view{padding:0;max-width:none}}
</style>
</head>
<body>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="modalRoot"></div>
<div class="app" id="app"></div>
<noscript><p style="padding:24px">This application needs JavaScript. It runs entirely on your device — nothing is sent anywhere.</p></noscript>
<script>/* ============================================================================
   MCQ MASTERY — local-first controlled MCQ bank
   01 · Core: utilities, seeded RNG, hashing, IndexedDB data-access layer
   ========================================================================== */
'use strict';
const APP = { name: 'MCQ Mastery', version: '1.2.0', schema: 3 };

/* ---------- tiny DOM + format helpers ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
function h(tag, attrs, kids) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k === 'text') e.textContent = v;
    else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
    else if (k === 'dataset') for (const d in v) e.dataset[d] = v[d];
    /* A <textarea> has no value *attribute* — its value is its text content.
       setAttribute('value', …) on one is silently ignored, which is how a
       populated question can render as an empty box. Set the property. */
    else if (k === 'value' && tag === 'textarea') { e.value = v; e.defaultValue = v; }
    else e.setAttribute(k, v === true ? '' : v);
  }
  if (kids != null) (Array.isArray(kids) ? kids : [kids]).forEach(k => {
    if (k == null || k === false) return;
    e.appendChild(typeof k === 'string' || typeof k === 'number' ? document.createTextNode(String(k)) : k);
  });
  return e;
}
/** Escape untrusted text for the rare places we build HTML strings. */
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const pad = (n, w) => String(n).padStart(w, '0');
const nowISO = () => new Date().toISOString();
const todayKey = (d) => {
  const t = d ? new Date(d) : new Date();
  return t.getFullYear() + '-' + pad(t.getMonth() + 1, 2) + '-' + pad(t.getDate(), 2);
};
const addDays = (n, from) => { const d = from ? new Date(from) : new Date(); d.setDate(d.getDate() + n); return d.toISOString(); };
function fmtDate(iso, withTime) {
  if (!iso) return '—';
  const d = new Date(iso); if (isNaN(d)) return '—';
  const s = d.toLocaleDateString(undefined, { day: '2-digit', month: 'short', year: 'numeric' });
  return withTime ? s + ' ' + d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' }) : s;
}
function fmtDur(ms) {
  if (ms == null) return '—';
  const s = Math.round(ms / 1000);
  if (s < 60) return s + 's';
  const m = Math.floor(s / 60);
  return m + 'm ' + pad(s % 60, 2) + 's';
}
function clock(ms) {
  const t = Math.max(0, Math.floor(ms / 1000));
  const hh = Math.floor(t / 3600), mm = Math.floor((t % 3600) / 60), ss = t % 60;
  return (hh ? pad(hh, 2) + ':' : '') + pad(mm, 2) + ':' + pad(ss, 2);
}
const pct = (n, d, dp) => (!d ? '—' : (100 * n / d).toFixed(dp == null ? 0 : dp) + '%');
const bytes = (n) => n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(1) + ' MB';
function debounce(fn, ms) { let t; return function () { clearTimeout(t); const a = arguments, x = this; t = setTimeout(() => fn.apply(x, a), ms || 220); }; }
function download(name, blob) {
  const url = URL.createObjectURL(blob);
  const a = h('a', { href: url, download: name });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

/* ---------- ids ---------- */
function uuid() {
  if (self.crypto && crypto.randomUUID) { try { return crypto.randomUUID(); } catch (e) { /* insecure ctx */ } }
  const b = new Uint8Array(16);
  (self.crypto && crypto.getRandomValues) ? crypto.getRandomValues(b) : b.forEach((_, i) => b[i] = Math.floor(Math.random() * 256));
  b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
  const x = Array.from(b, v => v.toString(16).padStart(2, '0')).join('');
  return x.slice(0, 8) + '-' + x.slice(8, 12) + '-' + x.slice(12, 16) + '-' + x.slice(16, 20) + '-' + x.slice(20);
}

/* ---------- hashing (SubtleCrypto with a deterministic fallback) ---------- */
function fnv1a128(input) {
  // Deterministic non-cryptographic fallback for insecure contexts (file://).
  const bytesArr = typeof input === 'string' ? new TextEncoder().encode(input) : new Uint8Array(input);
  const seeds = [0x811c9dc5, 0x01000193, 0x9e3779b9, 0x85ebca6b];
  const out = seeds.map((s, i) => {
    let hsh = s >>> 0;
    for (let j = 0; j < bytesArr.length; j++) {
      hsh ^= bytesArr[(j + i * 7) % bytesArr.length];
      hsh = Math.imul(hsh, 16777619) >>> 0;
    }
    return hsh >>> 0;
  });
  return out.map(v => v.toString(16).padStart(8, '0')).join('');
}
async function sha256(input) {
  const data = typeof input === 'string' ? new TextEncoder().encode(input) : new Uint8Array(input);
  if (self.crypto && crypto.subtle && crypto.subtle.digest) {
    try {
      const d = await crypto.subtle.digest('SHA-256', data);
      return Array.from(new Uint8Array(d), b => b.toString(16).padStart(2, '0')).join('');
    } catch (e) { /* fall through */ }
  }
  return 'fnv:' + fnv1a128(data);
}
function crc32(u8) {
  let c, tbl = crc32.t;
  if (!tbl) {
    tbl = crc32.t = new Int32Array(256);
    for (let n = 0; n < 256; n++) { c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; tbl[n] = c; }
  }
  let crc = -1;
  for (let i = 0; i < u8.length; i++) crc = (crc >>> 8) ^ tbl[(crc ^ u8[i]) & 0xFF];
  return (crc ^ -1) >>> 0;
}

/* ---------- seeded RNG (mulberry32) + Fisher–Yates ---------- */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function seedFrom(str) { let hsh = 2166136261 >>> 0; for (let i = 0; i < str.length; i++) { hsh ^= str.charCodeAt(i); hsh = Math.imul(hsh, 16777619) >>> 0; } return hsh >>> 0; }
function newSeed() { return (Math.floor(Math.random() * 0xFFFFFFFF) ^ Date.now()) >>> 0; }
/** Seeded Fisher–Yates. Returns a new array; the input is not mutated. */
function shuffle(arr, rng) {
  const a = arr.slice(), r = rng || Math.random;
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}

/* ============================================================================
   IndexedDB data-access layer.
   UI code never touches a transaction directly — it goes through DB / repos.
   ========================================================================== */
const STORES = {
  courses:         { keyPath: 'id', idx: [] },
  questions:       { keyPath: 'uuid', idx: ['courseId', 'qid', 'status', 'fingerprint', 'batchId', 'sourceId', 'nextReviewAt', 'domainId', 'canonicalUuid'] },
  questionVersions:{ keyPath: 'id', auto: true, idx: ['questionUuid'] },
  sources:         { keyPath: 'id', idx: ['courseId', 'fileHash'] },
  batches:         { keyPath: 'id', idx: ['courseId'] },
  attempts:        { keyPath: 'id', auto: true, idx: ['questionUuid', 'sessionId', 'courseId', 'ts'] },
  sessions:        { keyPath: 'id', idx: ['courseId', 'status', 'startedAt'] },
  settings:        { keyPath: 'k' },
  audit:           { keyPath: 'id', auto: true, idx: ['ts', 'entityId', 'action'] },
  images:          { keyPath: 'id' },
  idRegister:      { keyPath: 'courseId' },
  tombstones:      { keyPath: 'qid' },
  presets:         { keyPath: 'id', idx: ['courseId'] },
  notes:           { keyPath: 'id', idx: ['courseId', 'domainId'] },
  /** Holds the file/folder handle only. Never exported, never synced. */
  fsmeta:          { keyPath: 'k' }
};

/* Set by the file-backed store (module 17) once it loads. Declared here with
   `var` so the DAL can reference them safely regardless of module order. */
var _writeHook = null;   // (storeName) => void   — called after a write
var _writeVeto = null;   // (storeName) => bool   — true means refuse the write

const DB = {
  db: null,
  async open() {
    if (this.db) return this.db;
    if (!self.indexedDB) throw new Error('IndexedDB is unavailable in this browser context.');
    this.db = await new Promise((res, rej) => {
      const req = indexedDB.open('mcq_mastery', APP.schema);
      req.onupgradeneeded = (ev) => {
        const db = req.result;
        for (const name in STORES) {
          const spec = STORES[name];
          let st;
          if (!db.objectStoreNames.contains(name)) st = db.createObjectStore(name, { keyPath: spec.keyPath, autoIncrement: !!spec.auto });
          else st = req.transaction.objectStore(name);
          (spec.idx || []).forEach(ix => { if (!st.indexNames.contains(ix)) st.createIndex(ix, ix, { unique: false }); });
        }
        void ev;
      };
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(req.error || new Error('Could not open the local database.'));
      req.onblocked = () => rej(new Error('Another tab is holding the database open. Close it and reload.'));
    });
    this.db.onversionchange = () => { this.db.close(); this.db = null; };
    return this.db;
  },
  tx(names, mode) { return this.db.transaction(names, mode || 'readonly'); },
  _p(req) { return new Promise((res, rej) => { req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error); }); },
  get(store, key) { return this._p(this.tx(store).objectStore(store).get(key)); },
  all(store) { return this._p(this.tx(store).objectStore(store).getAll()); },
  count(store) { return this._p(this.tx(store).objectStore(store).count()); },

  /* --- raw writes: no read-only guard, no change tracking ---
     Used by the file-sync layer itself, which must be able to rebuild
     IndexedDB from the file without tripping its own guards. */
  putRaw(store, val) { const t = this.tx(store, 'readwrite'); return this._p(t.objectStore(store).put(val)); },
  delRaw(store, key) { const t = this.tx(store, 'readwrite'); return this._p(t.objectStore(store).delete(key)); },
  clearRaw(store) { const t = this.tx(store, 'readwrite'); return this._p(t.objectStore(store).clear()); },
  putManyRaw(store, vals) {
    if (!vals.length) return Promise.resolve([]);
    const t = this.tx(store, 'readwrite'), os = t.objectStore(store);
    vals.forEach(v => os.put(v));
    return new Promise((res, rej) => { t.oncomplete = () => res(vals); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); });
  },

  /* --- guarded writes: everything in the app uses these --- */
  put(store, val) { return this._guard(store, () => this.putRaw(store, val), 'p', val); },
  putMany(store, vals) { return this._guard(store, () => this.putManyRaw(store, vals), 'm', vals); },
  del(store, key) { return this._guard(store, () => this.delRaw(store, key), 'd', key); },
  clear(store) { return this._guard(store, () => this.clearRaw(store), 'c', null); },

  /**
   * One choke point for every mutation: refuse it when the app is
   * read-only, and otherwise tell the file layer what changed.
   * The generated key is handed on as well — an auto-increment store assigns
   * the id inside IndexedDB, and a journal entry missing it would replay as a
   * brand new record rather than the same one.
   */
  async _guard(store, run, op, payload) {
    if (_writeVeto && _writeVeto(store)) {
      const err = new Error(typeof READONLY_MSG !== 'undefined' ? READONLY_MSG : 'The app is read-only.');
      err.name = 'ReadOnlyError';
      throw err;
    }
    const out = await run();
    if (_writeHook) _writeHook(store, op, payload, out);
    return out;
  },

  byIndex(store, index, value) { return this._p(this.tx(store).objectStore(store).index(index).getAll(value)); },
  /** Stream a store/index without materialising everything at once. */
  each(store, fn, index, range) {
    return new Promise((res, rej) => {
      const os = this.tx(store).objectStore(store);
      const src = index ? os.index(index) : os;
      const req = src.openCursor(range || null);
      req.onsuccess = () => { const c = req.result; if (!c) return res(); const r = fn(c.value); if (r === false) return res(); c.continue(); };
      req.onerror = () => rej(req.error);
    });
  }
};

/* ---------- settings ----------
   Some settings describe the app (theme, OCR); those stay global.
   Others describe how a *qualification* is practised — a CISA mock is not
   a DISA mock — and those are stored per course, keyed 'name@courseId'.  */
const COURSE_SETTINGS = ['mockCount', 'mockMinutes', 'mockAllowPause', 'srIntervals', 'weakMinSample', 'masteryTarget'];
function isCourseSetting(k) { return COURSE_SETTINGS.indexOf(k) >= 0; }
function courseKey(k, courseId) { return k + '@' + courseId; }

const Settings = {
  cache: {},
  defaults: {
    theme: 'light',
    activeCourseId: null,
    mockCount: 150,
    mockMinutes: 240,
    mockAllowPause: false,
    srIntervals: { wrong: 1, guessed: 1, lowConf: 3, medConf: 7, highConf: 14, unknown: 3, ladder: [14, 30, 60, 90] },
    weakMinSample: 5,
    masteryTarget: 75,
    shuffleOptions: true,
    confirmLeaveMock: true,
    ocrEnabled: false,
    ocrScriptPath: 'vendor/tesseract.min.js',
    externalOcrEnabled: false,
    storeSourceImages: true,
    imageMaxKB: 500,
    driveClientId: '',
    notesMaxKB: 2000,
    lastBackupAt: null
  },
  async load() {
    const rows = await DB.all('settings');
    this.cache = Object.assign({}, this.defaults);
    rows.forEach(r => { this.cache[r.k] = r.v; });
    return this.cache;
  },
  /**
   * Resolution order for a per-course setting:
   *   1. a value you saved for this course
   *   2. a sensible default carried on the course record (a CISA mock is
   *      150 questions; a DISA AT is 200)
   *   3. the app-wide default
   * Global settings skip straight to step 3's cache lookup.
   */
  get(k, courseId) {
    const cid = courseId || (State && State.course ? State.course.id : null);
    if (cid && isCourseSetting(k)) {
      const ck = courseKey(k, cid);
      if (this.cache[ck] !== undefined) return this.cache[ck];
      const course = (State.courses || []).find(c => c.id === cid);
      if (course && course.defaults && course.defaults[k] !== undefined) return course.defaults[k];
    }
    return this.cache[k] !== undefined ? this.cache[k] : this.defaults[k];
  },
  async set(k, v, courseId) {
    const cid = courseId || (State && State.course ? State.course.id : null);
    const key = (cid && isCourseSetting(k)) ? courseKey(k, cid) : k;
    this.cache[key] = v;
    await DB.put('settings', { k: key, v });
    return v;
  },
  /** Forget a course's overrides when the course itself is deleted. */
  async clearCourse(courseId) {
    for (const k of COURSE_SETTINGS) {
      const ck = courseKey(k, courseId);
      if (this.cache[ck] !== undefined) { delete this.cache[ck]; await DB.del('settings', ck); }
    }
  }
};

/* ---------- audit trail ---------- */
async function audit(action, entityType, entityId, prev, next, note) {
  await DB.put('audit', { ts: nowISO(), action, entityType, entityId: entityId || '', prev: prev === undefined ? null : prev, next: next === undefined ? null : next, note: note || '' });
}

/* ---------- toasts & modals ---------- */
function toast(msg, kind, ms) {
  // A storage failure can fire before the shell has rendered. Losing the
  // message is acceptable; taking the app down with it is not.
  const host = $('#toasts');
  if (!host) { try { console.warn('[toast]', msg); } catch (e) { } return; }
  const t = h('div', { class: 'toast ' + (kind || ''), role: 'status', text: msg });
  host.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 260); }, ms || 3200);
}
function modal(opts) {
  return new Promise(resolve => {
    const root = $('#modalRoot');
    // A dialog with nowhere to render must not take the app down; callers
    // already treat a falsy answer as "cancelled".
    if (!root) { resolve(null); return; }
    const bg = h('div', { class: 'modal-bg' });
    const box = h('div', { class: 'modal' + (opts.wide ? ' wide' : ''), role: 'dialog', 'aria-modal': 'true', 'aria-label': opts.title || 'Dialog' });
    const body = h('div', { class: 'modal-b' });
    if (typeof opts.body === 'string') body.appendChild(h('div', { html: opts.body })); else if (opts.body) body.appendChild(opts.body);
    const foot = h('div', { class: 'modal-f' });
    const close = (val) => { bg.remove(); document.removeEventListener('keydown', onKey); resolve(val); };
    (opts.actions || [{ label: 'Close', value: null }]).forEach(a => {
      foot.appendChild(h('button', { class: 'btn ' + (a.kind || ''), onclick: async () => { if (a.before && (await a.before(body)) === false) return; close(a.value); }, text: a.label }));
    });
    box.appendChild(h('div', { class: 'modal-h' }, [h('h3', { text: opts.title || '' }), h('div', { class: 'spacer' }), h('button', { class: 'btn ghost sm', 'aria-label': 'Close', onclick: () => close(null), text: '✕' })]));
    box.appendChild(body); box.appendChild(foot); bg.appendChild(box); root.appendChild(bg);
    const onKey = (e) => { if (e.key === 'Escape') close(null); };
    document.addEventListener('keydown', onKey);
    bg.addEventListener('mousedown', e => { if (e.target === bg && !opts.sticky) close(null); });
    setTimeout(() => { const f = box.querySelector('input,textarea,select,button.primary'); if (f) f.focus(); }, 30);
  });
}
/** confirmLabel names what the confirm button actually does — "Delete" is
    only right when the action is a deletion. Leave it unset for that case;
    pass it explicitly for anything else styled as dangerous (a replace, a
    load-and-overwrite), so the button never claims to delete something it
    is actually loading or replacing. */
const confirmBox = (title, msg, danger, confirmLabel) => modal({
  title, body: h('p', { text: msg }),
  actions: [{ label: 'Cancel', value: false }, { label: confirmLabel || (danger ? 'Delete' : 'Confirm'), value: true, kind: danger ? 'danger' : 'primary' }]
});


/* ============================================================================
   02 · Domain model — courses, record statuses, Question ID controls, repos
   Everything is scoped by courseId so a second syllabus is a data change,
   not a code change.
   ========================================================================== */

const STATUS = {
  draft:            { label: 'Draft',              badge: 'b-draft',    mark: '·', practice: false },
  parsing:          { label: 'Parsing incomplete', badge: 'b-draft',    mark: '·', practice: false },
  needs_content:    { label: 'Needs content review', badge: 'b-review', mark: '~', practice: false },
  needs_answer:     { label: 'Needs answer verification', badge: 'b-review', mark: '?', practice: false },
  needs_class:      { label: 'Needs classification', badge: 'b-review', mark: '~', practice: false },
  possible_dup:     { label: 'Possible duplicate',  badge: 'b-dup',     mark: '=', practice: false },
  answer_conflict:  { label: 'Answer conflict',     badge: 'b-conflict', mark: '✕', practice: false },

/* ---------- Question ID allocation register ----------
   Human-readable IDs are allocated only at admission, are never reused and
   never change. Retired IDs leave a tombstone.                             */
const IdRegister = {
  // get() and put() below are each their own IndexedDB transaction, so two
  // calls issued close together (a double-click on "New question", an
  // admit racing a restore) could both read the same lastSeq before either
  // writes back and hand out the same "permanent, never reused" Question ID
  // to two different questions. Chaining every call through this one
  // in-memory queue makes the read-then-write effectively atomic within
  // this tab, the same way one shared line at a counter would.
  _queue: Promise.resolve(),
  _serialize(fn) {
    const run = this._queue.then(fn, fn);
    this._queue = run.then(() => { }, () => { });
    return run;
  },
  next(courseId, count, meta) {
    return this._serialize(async () => {
      let reg = await DB.get('idRegister', courseId);
      if (!reg) reg = { courseId, lastSeq: 0, allocations: [] };
      const course = await DB.get('courses', courseId);
      const prefix = (course && course.qidPrefix) || 'Q';
      const ids = [];
      for (let i = 0; i < count; i++) ids.push(prefix + '-Q-' + pad(++reg.lastSeq, 6));
      reg.allocations.push({ ts: nowISO(), from: ids[0], to: ids[ids.length - 1], count, note: (meta && meta.note) || '' });
      if (reg.allocations.length > 500) reg.allocations = reg.allocations.slice(-500);
      await DB.put('idRegister', reg);
      return ids;
    });
  },
  /** Raise the watermark so a restore can never re-issue an existing ID. */
  reserveUpTo(courseId, seq) {
    return this._serialize(async () => {
      let reg = await DB.get('idRegister', courseId) || { courseId, lastSeq: 0, allocations: [] };
      if (seq > reg.lastSeq) { reg.lastSeq = seq; reg.allocations.push({ ts: nowISO(), from: '', to: '', count: 0, note: 'Watermark raised to ' + seq + ' by restore' }); await DB.put('idRegister', reg); }
    });
  },
  seqOf(qid) { const m = /-Q-(\d+)$/.exec(qid || ''); return m ? parseInt(m[1], 10) : 0; }
};

const Questions = {
  get: (uuidStr) => DB.get('questions', uuidStr),
  async byCourse(courseId) {

  },
  async byQid(qid) {
    const rows = await DB.byIndex('questions', 'qid', qid);
    return rows[0] || null;
  },
  async save(q, reason, noVersion) {
    const prev = await DB.get('questions', q.uuid);
    if (prev && !noVersion && materiallyDifferent(prev, q)) {
      await DB.put('questionVersions', {
        questionUuid: q.uuid, version: prev.version,
        snapshot: JSON.parse(JSON.stringify(prev)), changedAt: nowISO(), reason: reason || 'edit'
      });
      q.version = (prev.version || 1) + 1;
    }
    q.updatedAt = nowISO();
    await recomputeFingerprint(q);
    // Whatever changed — a typo fix, a corrected answer, a hand-typed
    // question reaching a stem for the first time — recheck it against the
    // rest of the bank now, not just at the moment it was imported.
    await recheckQuestion(q, {});
    await DB.put('questions', q);
    if (prev) await audit('edit', 'question', q.qid || q.uuid, summarise(prev), summarise(q), reason || '');
    return q;
  },
  async putRaw(q) { await DB.put('questions', q); return q; },
  async admit(list, courseId, note) {
    // Allocates the permanent Question IDs. Called once, at the end of import.
    const need = list.filter(q => !q.qid);
    const ids = need.length ? await IdRegister.next(courseId, need.length, { note: note || 'import' }) : [];
    need.forEach((q, i) => { q.qid = ids[i]; });
    for (const q of list) { await recomputeFingerprint(q); }
    await DB.putMany('questions', list);
    if (list.length) await audit('import', 'question', (list[0].qid || '') + '…' + (list[list.length - 1].qid || ''), null, { count: list.length }, note || '');
    return list;

}
function materiallyDifferent(a, b) {
  if (a.stem !== b.stem) return true;
  if (a.correctOptionId !== b.correctOptionId) return true;
  if ((a.options || []).length !== (b.options || []).length) return true;
  for (let i = 0; i < (a.options || []).length; i++) {
    if (a.options[i].id !== b.options[i].id || a.options[i].text !== b.options[i].text) return true;
  }
  if ((a.explanation || '') !== (b.explanation || '')) return true;
  return false;
}

/* ============================================================================
   03 · Normalisation, fingerprints and duplicate detection
   ========================================================================== */

const STOPWORDS = new Set(('a an the of to in for on with and or is are was were be been which that this these those ' +
  'as at by from it its into their there than then when what who whom whose how why does do did not no nor but if ' +
  'should would could may might can will shall your you we they he she i').split(' '));

/** Strip numbering, option labels, headers/footers and cosmetic punctuation. */
function normText(s) {
  let t = String(s || '');
  if (t.normalize) t = t.normalize('NFKC');
  t = t.toLowerCase()
    .replace(/[\u2018\u2019\u201B\u2032]/g, "'")
    .replace(/[\u201C\u201D\u2033]/g, '"')
    .replace(/[\u2010-\u2015\u2212]/g, '-')
    .replace(/\u00a0/g, ' ')
    .replace(/\u2026/g, '...')
    .replace(/^\s*(q(uestion)?\s*[.\-:)]?\s*)?\d{1,4}\s*[.)\-:]\s+/i, '')  // leading question number
    .replace(/^\s*[\(\[]?[a-h][\)\].:]\s+/i, '')                            // leading option label
    .replace(/page\s+\d+\s+of\s+\d+/g, ' ')
    .replace(/[\u2022\u25cf\u25aa\u00b7]/g, ' ')
    // Everything that is not a letter, digit, whitespace or per-cent sign is
    // cosmetic for comparison purposes and becomes a space. This is what makes
    // "weakness. What" and "weakness — what" fingerprint identically.
    .replace(/[^\p{L}\p{N}\s%]/gu, ' ')
    .replace(/\s+/g, ' ')
    .trim();
  return t;
}
function tokens(s) {
  return normText(s).split(' ').filter(w => w.length > 1 && !STOPWORDS.has(w));
}
function contentKey(q) {
  const stem = normText(q.stem);
  const opts = (q.options || []).map(o => normText(o.text)).filter(Boolean).sort().join('|');
  return stem + '||' + opts;
}
async function recomputeFingerprint(q) {
  q.normStem = normText(q.stem);
  q.tokens = Array.from(new Set(tokens(q.stem))).slice(0, 60);
  q.fingerprint = await sha256(contentKey(q));
  return q.fingerprint;
}

/* ---------- similarity ---------- */
function jaccard(aSet, bSet) {
  if (!aSet.size || !bSet.size) return 0;
  let inter = 0;
  aSet.forEach(v => { if (bSet.has(v)) inter++; });
  return inter / (aSet.size + bSet.size - inter);
}
function shingles(str, n) {
  const t = normText(str).replace(/\s+/g, ' ');
  const out = new Set();
  for (let i = 0; i + n <= t.length; i++) out.add(t.substr(i, n));
  return out;
}
function optionOverlap(a, b) {
  const A = (a.options || []).map(o => normText(o.text)).filter(Boolean);
  const B = (b.options || []).map(o => normText(o.text)).filter(Boolean);
  if (!A.length || !B.length) return 0;
  let hit = 0;
  A.forEach(x => { if (B.indexOf(x) >= 0) hit++; });
  return hit / Math.max(A.length, B.length);
}
function correctTextOf(q) {
  const o = (q.options || []).find(x => x.id === q.correctOptionId);
  return o ? normText(o.text) : '';
}
/** Weighted composite score in [0,1] with an inspectable breakdown. */
/* Comparing two questions needs token sets, character shingles and a content
   key for each. Rebuilding those inside every comparison meant recomputing
   the same question's data hundreds of times per import. They are cached on
   the question instead, and thrown away whenever any question is written, so
   an edit can never be compared against stale text.
   The cache is non-enumerable, so it never reaches the data file. */
let SIM_GEN = 0;
function bumpSimGen() { SIM_GEN++; }

function simParts(q) {
  if (q.__sim && q.__simGen === SIM_GEN) return q.__sim;
  const ansText = correctTextOf(q);
  const parts = {
    tok: new Set(tokens(q.stem)),
    shg: shingles(q.stem, 5),
    ckey: contentKey(q),
    ansText: ansText,
    ansTok: ansText ? new Set(tokens(ansText)) : null,
    tags: new Set(q.tags || [])
  };
  try {
    Object.defineProperty(q, '__sim', { value: parts, writable: true, enumerable: false, configurable: true });
    Object.defineProperty(q, '__simGen', { value: SIM_GEN, writable: true, enumerable: false, configurable: true });
  } catch (e) { /* frozen object: fall back to recomputing each time */ }
  return parts;
}

function similarity(a, b) {
  const A = simParts(a), B = simParts(b);
  const stemTok = jaccard(A.tok, B.tok);
  const stemChr = jaccard(A.shg, B.shg);
  const opts = optionOverlap(a, b);
  const ans = (A.ansText && B.ansText) ? (A.ansText === B.ansText ? 1 : jaccard(A.ansTok, B.ansTok)) : 0;
  const dom = (a.domainId && b.domainId) ? (a.domainId === b.domainId ? 1 : 0) : 0.5;
  const kw = jaccard(A.tags, B.tags);
  const score = 0.34 * stemTok + 0.26 * stemChr + 0.22 * opts + 0.10 * ans + 0.05 * dom + 0.03 * kw;
  return { score, stemTok, stemChr, opts, ans, dom, kw };
}
function classifyPair(a, b, sim) {
  if (simParts(a).ckey === simParts(b).ckey) return 'definite';
  if (sim.score >= 0.90 && sim.opts >= 0.7) return 'definite';
  if (sim.score >= 0.80) return 'likely';
  if (sim.score >= 0.62) return 'possible';
  return 'distinct';
}
function answersConflict(a, b) {
  const x = simParts(a).ansText, y = simParts(b).ansText;
  if (!x || !y) return false;
  return x !== y;
}

/* ---------- blocking index so detection stays fast at scale ---------- */
/* A token found in a large share of the bank carries no signal — "following",
   "information", "organization" appear everywhere — so indexing on it turns
   every lookup into a near-full scan. These bounds keep duplicate detection
   proportional to the bank rather than quadratic in it. */
const DUP_MAX_KEYS = 8;      // index/query keys per question
const DUP_MAX_BUCKET = 400;  // a bucket bigger than this is not discriminating
const DUP_MAX_POOL = 400;    // comparisons per candidate, worst case

function qTokens(q) {
  return (q.tokens && q.tokens.length ? q.tokens : tokens(q.stem)) || [];
}
/** The rarest tokens in this question, which are the ones worth indexing. */
function rareKeys(q, df, maxDf) {
  const t = Array.from(new Set(qTokens(q)));
  const rare = t.filter(w => (df.get(w) || 0) <= maxDf);
  const pick = (rare.length ? rare : t)
    .sort((a, b) => ((df.get(a) || 0) - (df.get(b) || 0)) || (b.length - a.length));
  return pick.slice(0, DUP_MAX_KEYS);
}

function buildIndex(list) {
  const byFp = new Map(), byTok = new Map(), df = new Map();
  const all = [];
  list.forEach(q => {
    const t = Array.from(new Set(qTokens(q)));
    all.push(t);
    t.forEach(w => df.set(w, (df.get(w) || 0) + 1));
  });
  // Anything in more than 2% of the bank is treated as noise, with a floor so
  // small banks still index normally.
  const maxDf = Math.max(20, Math.ceil(list.length * 0.02));
  const index = { byFp, byTok, df, maxDf };
  list.forEach(q => addToIndex(index, q));
  return index;
}

/** Add one question to a live index, so a batch can be checked against itself. */
function addToIndex(index, q) {
  if (q.fingerprint) {
    if (!index.byFp.has(q.fingerprint)) index.byFp.set(q.fingerprint, []);
    index.byFp.get(q.fingerprint).push(q);
  }
  rareKeys(q, index.df, index.maxDf).forEach(w => {
    if (!index.byTok.has(w)) index.byTok.set(w, []);
    index.byTok.get(w).push(q);
  });
}

function candidatesFor(q, index, excludeUuid) {
  const seen = new Map();
  // An exact fingerprint match is definitive and is always considered,
  // whatever the token bounds below decide.
  if (q.fingerprint && index.byFp.has(q.fingerprint)) {
    index.byFp.get(q.fingerprint).forEach(o => seen.set(o.uuid, o));
  }
  const keys = rareKeys(q, index.df, index.maxDf);
  for (const w of keys) {
    const bucket = index.byTok.get(w);
    if (!bucket || bucket.length > DUP_MAX_BUCKET) continue;
    for (const o of bucket) {
      seen.set(o.uuid, o);
      if (seen.size >= DUP_MAX_POOL) break;
    }
    if (seen.size >= DUP_MAX_POOL) break;
  }
  if (excludeUuid) seen.delete(excludeUuid);
  return Array.from(seen.values());
}

/**
 * Compare a set of candidate questions against the existing bank and against
 * each other. Returns per-candidate verdicts; nothing is merged here.
 */
function detectDuplicates(candidates, bank) {
  const index = buildIndex(bank);
  const results = new Map();
  candidates.forEach(q => {
    // Earlier candidates are already in the index, so within-batch duplicates
    // are caught without rescanning the whole batch for every question.
    const pool = candidatesFor(q, index, q.uuid);
    let best = null;
    for (const other of pool) {
      if (other.uuid === q.uuid) continue;
      if (other.status === 'merged' || other.status === 'rejected') continue;
      const sim = similarity(q, other);
      const cls = classifyPair(q, other, sim);
      if (cls === 'distinct') continue;
      const rec = { other, sim, cls, conflict: answersConflict(q, other) };
      const rank = { definite: 3, likely: 2, possible: 1 };
      if (!best || rank[cls] > rank[best.cls] || (rank[cls] === rank[best.cls] && sim.score > best.sim.score)) best = rec;
    }
    results.set(q.uuid, best);
    // Fold this candidate into the index so the rest of the batch can match
    // against it, on both fingerprint and tokens.
    addToIndex(index, q);
  });
  return results;
}

/* ---------- bank-wide conflict & duplicate tracking ----------
   detectDuplicates() above only ever judges the *incoming* side of a match —
   it was built for the staging screen, where the other side is a read-only
   snapshot of the bank. Nothing re-checked a question once it was admitted,
   so an edit that turned two Active questions into an answer conflict, or a
   hand-typed question that happened to duplicate one already there, could
   sail through unnoticed — and even a conflict caught at import time only
   ever benched the newer record, leaving its older, equally-wrong partner
   sitting in Active. ARCHITECTURE.md promises both sides are held out of
   practice; recheckQuestion() is what actually makes that true, called
   after every save, admission, merge and unmerge, on both sides of any pair
   it finds — not just the record that happened to trigger it. */

/** Add otherUuid to q's pairing list. Pure list mutation — does not touch
    status or the conflict flag, so it is safe to call from anywhere without
    worrying what else might be poking those fields. Returns true if new. */
function flagPairSide(q, otherUuid, kind) {
  const listKey = kind === 'conflict' ? 'conflictWith' : 'dupWith';
  const list = q[listKey] || (q[listKey] = []);
  if (list.indexOf(otherUuid) >= 0) return false;
  list.push(otherUuid);
  return true;
}
/** Drop a pairing that no longer holds. Pure list mutation, as above. */
function unflagPairSide(q, otherUuid, kind) {
  const listKey = kind === 'conflict' ? 'conflictWith' : 'dupWith';
  const before = q[listKey] || [];
  const after = before.filter(u => u !== otherUuid);
  if (after.length === before.length) return false;
  q[listKey] = after;
  return true;
}
/** The single source of truth for status/conflict given conflictWith and
    dupWith: unconditionally re-derives both from the two lists every time —
    q.conflict/q.status are never trusted as input, only as output, so a
    stale value from a moment ago (a conflict that just resolved into a plain
    duplicate, a review-queue button presetting fresh.status) can never get
    stuck. The one case that needs a flag with no pairing behind it — merging
    two records whose sources disagreed — is intentionally NOT special-cased
    here; mergeQuestions re-asserts it itself, right after calling this,
    because only it knows that reason still holds. Always call this after any
    flagPairSide/unflagPairSide, even when only one pairing among several
    changed. */
function normalizePairState(q) {
  const hasConflict = !!(q.conflictWith && q.conflictWith.length);
  const hasDup = !!(q.dupWith && q.dupWith.length);
  if (hasConflict) { q.conflict = true; q.status = 'answer_conflict'; return; }
  q.conflict = false;
  if (hasDup) { if (q.status !== 'possible_dup') q.status = 'possible_dup'; return; }
  if (q.status === 'answer_conflict' || q.status === 'possible_dup') {
    q.status = (q.correctOptionId && q.answerVerified === 'verified') ? (q.domainId ? 'active' : 'needs_class') : 'needs_answer';
  }
}

/**
 * Bring one question's conflictWith / dupWith up to date against the rest of
 * its course's live bank, and update BOTH sides of every pairing it finds or
 * clears — whatever caused the recheck: a manual edit, hand entry, an
 * admission, or an unmerge. A pair either side has explicitly dismissed
 * ("keep separate") is never re-raised. Persists q's partners directly (raw
 * DB.put, never Questions.save) so this can never recurse into itself; the
 * caller is responsible for persisting q itself.
 * Pass { bank, index, byUuid } to reuse a pre-built index across a bulk scan.
 */
async function recheckQuestion(q, opts) {
  opts = opts || {};
  if (!q.stem || !q.stem.trim() || !q.options || q.options.length < 2) {
    normalizePairState(q);
    return { changed: false, newConflicts: [], newDups: [], touchedOthers: [] };
  }
  const bank = opts.bank || (await Questions.byCourse(q.courseId)).filter(x => x.uuid !== q.uuid);
  const live = bank.filter(x => x.status !== 'merged' && x.status !== 'rejected');
  const index = opts.index || buildIndex(live);
  const byUuid = opts.byUuid || new Map(live.map(x => [x.uuid, x]));
  const dismissed = new Set(q.dismissedPairs || []);

  const stillConflict = new Set(), stillDup = new Set();
  for (const other of candidatesFor(q, index, q.uuid)) {
    if (other.uuid === q.uuid) continue;
    if (dismissed.has(other.uuid) || (other.dismissedPairs || []).indexOf(q.uuid) >= 0) continue;
    const sim = similarity(q, other);
    const cls = classifyPair(q, other, sim);
    if (cls === 'distinct') continue;
    if (answersConflict(q, other)) stillConflict.add(other.uuid); else stillDup.add(other.uuid);
  }

  const wasConflict = new Set(q.conflictWith || []), wasDup = new Set(q.dupWith || []);
  const added = [], removed = [];
  wasConflict.forEach(u => { if (!stillConflict.has(u)) removed.push([u, 'conflict']); });
  wasDup.forEach(u => { if (!stillDup.has(u)) removed.push([u, 'dup']); });
  stillConflict.forEach(u => { if (!wasConflict.has(u)) added.push([u, 'conflict']); });
  stillDup.forEach(u => { if (!wasDup.has(u)) added.push([u, 'dup']); });

  removed.forEach(([u, kind]) => unflagPairSide(q, u, kind));
  added.forEach(([u, kind]) => flagPairSide(q, u, kind));
  // Re-derive q's own status/conflict every pass, even with nothing added or
  // removed — a caller may have preset a stale value on q before calling in.
  normalizePairState(q);

  const touched = new Map();
  const otherOf = async (u) => byUuid.get(u) || await Questions.get(u);
  for (const [u, kind] of removed) {
    const other = await otherOf(u);
    if (other && unflagPairSide(other, q.uuid, kind)) { normalizePairState(other); touched.set(u, other); }
  }
  for (const [u, kind] of added) {
    const other = await otherOf(u);
    if (!other) continue;
    const isNew = flagPairSide(other, q.uuid, kind);
    normalizePairState(other);
    touched.set(u, other);
    if (isNew && kind === 'conflict') await audit('conflict', 'question', other.qid || other.uuid, null, { conflictWith: q.qid || q.uuid }, 'Answer conflict detected against ' + (q.qid || q.uuid) + ' during recheck');
  }
  for (const [, other] of touched) { other.updatedAt = nowISO(); await DB.put('questions', other); }

  return {
    changed: added.length > 0 || removed.length > 0,
    newConflicts: added.filter(([, k]) => k === 'conflict').map(([u]) => u),
    newDups: added.filter(([, k]) => k === 'dup').map(([u]) => u),
    touchedOthers: Array.from(touched.keys())
  };
}

/** Full-bank sweep — for data imported before this feature existed, or after
    edits made outside the normal save path (a restore, a manual DB edit).
    Always persists q: normalizePairState can correct a record even when its
    pairing lists themselves did not change. */
async function rescanCourseForPairs(courseId, onProgress) {
  const all = await Questions.byCourse(courseId);
  const live = all.filter(x => x.status !== 'merged' && x.status !== 'rejected');
  const index = buildIndex(live);
  const byUuid = new Map(live.map(x => [x.uuid, x]));
  let newConflicts = 0, newDups = 0, cleared = 0, checked = 0;
  for (const q of live) {
    const before = q.status;
    const r = await recheckQuestion(q, { bank: live, index, byUuid });
    if (r.changed || q.status !== before) {
      q.updatedAt = nowISO();
      await DB.put('questions', q);
      newConflicts += r.newConflicts.length;
      newDups += r.newDups.length;
      if (!r.newConflicts.length && !r.newDups.length && r.changed) cleared++;
    }
    checked++;
    if (onProgress && checked % 25 === 0) onProgress(checked, live.length);
  }
  return { checked, newConflicts, newDups, cleared };
}

/** Word-level diff used by the side-by-side duplicate reviewer. */
function diffWords(a, b) {
  const A = String(a || '').split(/(\s+)/), B = String(b || '').split(/(\s+)/);
  const n = A.length, m = B.length;
  // LCS table capped for safety on very long stems
  if (n * m > 400000) return { a: [{ t: a, s: 'same' }], b: [{ t: b, s: 'same' }] };
  const dp = [];
  for (let i = 0; i <= n; i++) dp.push(new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const ra = [], rb = [];
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (A[i] === B[j]) { ra.push({ t: A[i], s: 'same' }); rb.push({ t: B[j], s: 'same' }); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { ra.push({ t: A[i], s: 'diff' }); i++; }
    else { rb.push({ t: B[j], s: 'diff' }); j++; }
  }
  while (i < n) ra.push({ t: A[i++], s: 'diff' });
  while (j < m) rb.push({ t: B[j++], s: 'diff' });
  return { a: ra, b: rb };
}
function renderDiff(parts) {
  const box = h('div', { class: 'diffbox' });
  parts.forEach(p => box.appendChild(p.s === 'diff' ? h('mark', { class: 'dif', text: p.t }) : document.createTextNode(p.t)));
  return box;
}

/* ---------- merge / unmerge ---------- */
async function mergeQuestions(canonicalUuid, dupUuid, note) {
  const canon = await Questions.get(canonicalUuid);
  const dup = await Questions.get(dupUuid);
  if (!canon || !dup) throw new Error('One of the records no longer exists.');
  const before = JSON.parse(JSON.stringify(canon));
  // Keep provenance from both sides. Never drop a source reference.
  const refs = (canon.sourceRefs || []).concat(dup.sourceRefs || []);
  const seen = new Set(); canon.sourceRefs = refs.filter(r => { const k = r.sourceId + '|' + (r.locator || ''); if (seen.has(k)) return false; seen.add(k); return true; });
  if (dup.qid) canon.aliasQids = Array.from(new Set((canon.aliasQids || []).concat([dup.qid])));
  canon.mergedFrom = (canon.mergedFrom || []).concat([{
    uuid: dup.uuid, qid: dup.qid, at: nowISO(), snapshot: JSON.parse(JSON.stringify(dup)),
    // Just enough of the pre-merge canonical record for Unmerge to
    // actually undo what this specific merge changed, without touching
    // anything a later edit or a different merge has since added.
    before: { sourceRefs: before.sourceRefs, explanation: before.explanation, topic: before.topic, domainId: before.domainId, conflict: before.conflict, status: before.status }
  }]);
  if (!canon.explanation && dup.explanation) canon.explanation = dup.explanation;
  if (!canon.topic && dup.topic) canon.topic = dup.topic;
  if (!canon.domainId && dup.domainId) canon.domainId = dup.domainId;
  const mergeConflict = answersConflict(canon, dup);
  if (mergeConflict) { canon.conflict = true; canon.status = 'answer_conflict'; }
  // dup is leaving the live pool — anything still pointing at it as a
  // conflict or duplicate partner would otherwise be left referencing a
  // merged record. Clear it from those partners' pairing lists.
  for (const u of (dup.conflictWith || []).concat(dup.dupWith || [])) {
    const other = await Questions.get(u);
    if (!other) continue;
    const kind = (other.conflictWith || []).indexOf(dup.uuid) >= 0 ? 'conflict' : 'dup';
    if (unflagPairSide(other, dup.uuid, kind)) { normalizePairState(other); other.updatedAt = nowISO(); await DB.put('questions', other); }
  }
  dup.status = 'merged'; dup.canonicalUuid = canon.uuid; dup.conflictWith = []; dup.dupWith = []; dup.updatedAt = nowISO();
  await DB.put('questions', dup);
  await Questions.save(canon, 'merge:' + (dup.qid || dup.uuid), true);
  // Questions.save's recheck derives status purely from conflictWith/dupWith,
  // which will never include dup — it is already merged away by the time the
  // recheck runs. A conflict that exists only because the two records being
  // merged disagreed on the answer needs to be reasserted here, the one
  // place that still knows why.
  if (mergeConflict && (!canon.conflict || canon.status !== 'answer_conflict')) {
    canon.conflict = true; canon.status = 'answer_conflict'; canon.updatedAt = nowISO();
    await DB.put('questions', canon);
  }
  await audit('merge', 'question', canon.qid || canon.uuid, { mergedQid: dup.qid }, summarise(canon), note || '');
  State.invalidate();
  return canon;
}
async function unmergeQuestion(dupUuid) {
  const dup = await Questions.get(dupUuid);
  if (!dup || dup.status !== 'merged') throw new Error('That record is not a merged duplicate.');
  const canon = dup.canonicalUuid ? await Questions.get(dup.canonicalUuid) : null;
  if (canon) {
    const entry = (canon.mergedFrom || []).find(m => m.uuid === dup.uuid);
    canon.mergedFrom = (canon.mergedFrom || []).filter(m => m.uuid !== dup.uuid);
    canon.aliasQids = (canon.aliasQids || []).filter(a => a !== dup.qid);

    if (entry && entry.before) {
      const before = entry.before;
      // Only revert a field if it's still exactly what this merge set it
      // to — a later edit, or a different merge, may have legitimately
      // changed it since, and Unmerge must not silently discard that.
      if (!before.explanation && canon.explanation === dup.explanation) canon.explanation = before.explanation || '';
      if (!before.topic && canon.topic === dup.topic) canon.topic = before.topic || '';
      if (!before.domainId && canon.domainId === dup.domainId) canon.domainId = before.domainId || null;
      // Source references this specific duplicate contributed, and that no
      // other source (canon's own, or another merged-in duplicate) also
      // claims, can be dropped along with it.
      const dupKeys = new Set((entry.snapshot.sourceRefs || []).map(r => r.sourceId + '|' + (r.locator || '')));
      const beforeKeys = new Set((before.sourceRefs || []).map(r => r.sourceId + '|' + (r.locator || '')));
      canon.sourceRefs = (canon.sourceRefs || []).filter(r => {
        const k = r.sourceId + '|' + (r.locator || '');
        return beforeKeys.has(k) || !dupKeys.has(k);
      });
      // An answer-conflict status that exists only because of this merge —
      // canon had neither the flag nor the status before it, and has no
      // other merged-in duplicate or live conflict pairing that would
      // still cause it — can clear along with the merge that caused it.
      if (!before.conflict && canon.conflict && !(canon.mergedFrom || []).length && !(canon.conflictWith || []).length) {
        canon.conflict = false;
        if (canon.status === 'answer_conflict') canon.status = before.status || (canon.answerVerified === 'verified' ? 'active' : 'needs_answer');
      }
    }
    canon.updatedAt = nowISO();
    await DB.put('questions', canon);
  }
  dup.status = dup.answerVerified === 'verified' ? 'active' : 'needs_answer';
  dup.canonicalUuid = null; dup.updatedAt = nowISO();
  // Re-entering the live pool — the bank may have moved on while this was
  // merged away, so it needs the same recheck a fresh edit would get.
  await recheckQuestion(dup, {});
  await DB.put('questions', dup);
  await audit('unmerge', 'question', dup.qid || dup.uuid, null, { restoredStatus: dup.status }, '');
  State.invalidate();
  return dup;
}


/* ============================================================================
   04 · File extraction — no third-party libraries.
   ZIP is read/written with the browser's native Compression Streams, which is
   what makes DOCX, XLSX and the backup package work with zero dependencies.
   ========================================================================== */

const HAS_CS = typeof self.DecompressionStream === 'function';

async function inflateRaw(u8) {
  if (!HAS_CS) throw new Error('This browser cannot decompress archives (needs DecompressionStream).');
  const ds = new DecompressionStream('deflate-raw');
  const blob = new Blob([u8]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(blob).arrayBuffer());
}
async function inflateZlib(u8) {
  if (!HAS_CS) throw new Error('This browser cannot decompress streams (needs DecompressionStream).');
  const ds = new DecompressionStream('deflate');
  const blob = new Blob([u8]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(blob).arrayBuffer());
}
async function deflateRaw(u8) {
  if (typeof self.CompressionStream !== 'function') return null;
  const cs = new CompressionStream('deflate-raw');
  const blob = new Blob([u8]).stream().pipeThrough(cs);
  return new Uint8Array(await new Response(blob).arrayBuffer());
}

/* ---------- ZIP reader ---------- */
async function unzip(arrayBuffer) {
  const u8 = new Uint8Array(arrayBuffer), dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  let eocd = -1;
  for (let i = u8.length - 22; i >= 0 && i > u8.length - 66000; i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('Not a valid archive (no central directory found).');
  const count = dv.getUint16(eocd + 10, true);
  let off = dv.getUint32(eocd + 16, true);
  const files = {};
  for (let n = 0; n < count; n++) {
    if (dv.getUint32(off, true) !== 0x02014b50) break;
    const method = dv.getUint16(off + 10, true);
    const csize = dv.getUint32(off + 20, true);
    const nameLen = dv.getUint16(off + 28, true);
    const extraLen = dv.getUint16(off + 30, true);
    const cmtLen = dv.getUint16(off + 32, true);
    const lho = dv.getUint32(off + 42, true);
    const name = new TextDecoder().decode(u8.subarray(off + 46, off + 46 + nameLen));
    const lNameLen = dv.getUint16(lho + 26, true), lExtraLen = dv.getUint16(lho + 28, true);
    const dataOff = lho + 30 + lNameLen + lExtraLen;
    const raw = u8.subarray(dataOff, dataOff + csize);
    files[name] = { method, raw };
    off += 46 + nameLen + extraLen + cmtLen;
  }
  const api = {
    names: () => Object.keys(files),
    has: (n) => !!files[n],
    async bin(n) {
      const f = files[n]; if (!f) return null;
      return f.method === 0 ? f.raw.slice() : await inflateRaw(f.raw);
    },
    async text(n) { const b = await api.bin(n); return b ? new TextDecoder().decode(b) : null; }
  };
  return api;
}

/* ---------- ZIP writer ---------- */
async function zipFiles(entries) {
  // entries: [{name, data:(string|Uint8Array)}]
  const enc = new TextEncoder();
  const chunks = [], central = [];
  let offset = 0;
  for (const e of entries) {
    const nameB = enc.encode(e.name);
    const dataB = typeof e.data === 'string' ? enc.encode(e.data) : e.data;
    const crc = crc32(dataB);
    let comp = await deflateRaw(dataB);
    let method = 8;
    if (!comp || comp.length >= dataB.length) { comp = dataB; method = 0; }
    const lh = new Uint8Array(30 + nameB.length);
    const ldv = new DataView(lh.buffer);
    ldv.setUint32(0, 0x04034b50, true); ldv.setUint16(4, 20, true); ldv.setUint16(6, 0, true);
    ldv.setUint16(8, method, true); ldv.setUint16(10, 0, true); ldv.setUint16(12, 0x2821, true);
    ldv.setUint32(14, crc, true); ldv.setUint32(18, comp.length, true); ldv.setUint32(22, dataB.length, true);
    ldv.setUint16(26, nameB.length, true); ldv.setUint16(28, 0, true);
    lh.set(nameB, 30);
    chunks.push(lh, comp);
    const cd = new Uint8Array(46 + nameB.length);
    const cdv = new DataView(cd.buffer);
    cdv.setUint32(0, 0x02014b50, true); cdv.setUint16(4, 20, true); cdv.setUint16(6, 20, true);
    cdv.setUint16(8, 0, true); cdv.setUint16(10, method, true); cdv.setUint16(12, 0, true); cdv.setUint16(14, 0x2821, true);
    cdv.setUint32(16, crc, true); cdv.setUint32(20, comp.length, true); cdv.setUint32(24, dataB.length, true);
    cdv.setUint16(28, nameB.length, true); cdv.setUint32(42, offset, true);
    cd.set(nameB, 46);
    central.push(cd);
    offset += lh.length + comp.length;
  }
  const cdSize = central.reduce((a, c) => a + c.length, 0);
  const eocd = new Uint8Array(22), edv = new DataView(eocd.buffer);
  edv.setUint32(0, 0x06054b50, true);
  edv.setUint16(8, entries.length, true); edv.setUint16(10, entries.length, true);
  edv.setUint32(12, cdSize, true); edv.setUint32(16, offset, true);
  return new Blob(chunks.concat(central, [eocd]), { type: 'application/zip' });
}

/* ---------- DOCX → text (paragraphs and tables preserved) ---------- */
async function docxToText(arrayBuffer) {
  const zip = await unzip(arrayBuffer);
  const xml = await zip.text('word/document.xml');
  if (!xml) throw new Error('This does not look like a .docx file. If it is a legacy .doc, open it in Word and save as .docx.');
  const body = /<w:body[^>]*>([\s\S]*?)<\/w:body>/.exec(xml);
  // Expand self-closing empty paragraphs first: left as-is, the block walker
  // treats <w:p/> as an opening tag and swallows the next table whole.
  const src = (body ? body[1] : xml).replace(/<w:p\b[^>]*\/>/g, '<w:p></w:p>');
  const out = [];
  // Walk block-level elements in document order.
  const blockRe = /<w:(p|tbl)\b[^>]*>[\s\S]*?<\/w:\1>/g;
  let m;
  while ((m = blockRe.exec(src))) {
    if (m[1] === 'p') { const t = wpText(m[0]); out.push(t); }
    else {
      const rows = m[0].match(/<w:tr\b[^>]*>[\s\S]*?<\/w:tr>/g) || [];
      rows.forEach(r => {
        const cells = (r.match(/<w:tc\b[^>]*>[\s\S]*?<\/w:tc>/g) || []).map(c => {
          return (c.match(/<w:p\b[^>]*>[\s\S]*?<\/w:p>/g) || []).map(wpText).join(' ').trim();
        });
        out.push(cells.join('\t'));
      });
