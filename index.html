      h('div', { class: 'row wrap' }, [
        h('div', { style: 'flex:1;min-width:220px' }, [
          h('b', { text: 'Unfinished ' + MODES[resumable.mode].label.toLowerCase() + ' session' }),
          h('div', { class: 'small muted', text: done + ' of ' + resumable.questionUuids.length + ' answered · started ' + fmtDate(resumable.startedAt, true) })
        ]),
        h('button', { class: 'btn primary', onclick: () => runSession(resumable), text: 'Resume' }),
        h('button', {
          class: 'btn', onclick: async () => {
            // A mock exam never commits answers until it is submitted, so
            // discarding one mid-way genuinely loses everything answered —
            // unlike other modes, which record each answer as it happens.
            const mockLoss = resumable.mode === 'mock' && done > 0;
            const ok = await confirmBox('Discard this session?', mockLoss
              ? done + ' answered question(s) will be lost — a timed mock only records results when you submit it, so nothing so far has been saved to your history.'
              : 'This just ends the unfinished session — anything already answered is already recorded in your history.', mockLoss);
            if (!ok) return;
            await Session.abandon(resumable); toast('Session discarded'); go('practice');
          }, text: 'Discard'
        })
      ])
    ]));
  }

  const noteCount = (await NotesStore.list(State.course.id)).length;
  if (noteCount) {
    root.appendChild(h('div', { class: 'card', style: 'margin-bottom:16px' }, h('div', { class: 'card-b' },
      h('button', { class: 'method-row', onclick: () => go('notes') }, [
        h('span', { class: 'method-ico', text: '▧' }),
        h('div', {}, [h('div', { class: 'method-title', text: 'Worth a quick look first?' }), h('div', { class: 'card-desc', text: noteCount + ' revision note(s) saved for this course — open Notes' })])
      ])
    )));
  }

  if (!pool.length) {
    root.appendChild(h('div', { class: 'card' }, h('div', { class: 'empty' }, [
      h('h3', { text: 'No question is ready for practice yet' }),
      h('p', { class: 'muted', text: all.length ? 'You have ' + all.length + ' record(s), but a question only becomes eligible once it is Active with a verified correct answer.' : 'Import questions to get started.' }),
      h('div', { class: 'row', style: 'justify-content:center;margin-top:10px' }, [
        h('button', { class: 'btn primary', onclick: () => go(all.length ? 'review' : 'import'), text: all.length ? 'Open Needs Checking' : 'Open Add Questions' })
      ])
    ])));
    return;
  }

  if (resumable) {
    root.appendChild(h('p', { class: 'small muted', style: 'margin:0 0 12px' }, 'Resume or discard the unfinished session above before starting a new one — otherwise it would be silently left behind and hard to find again.'));
  }
  const grid = h('div', { class: 'grid g3 stretch' });
  Object.keys(MODES).forEach(m => {
    const info = MODES[m];
    let count = null;
    if (m === 'spaced') count = due.length;
    if (m === 'redo') count = applyFilters(pool, { incorrect: true }).length + applyFilters(pool, { guessed: true }).length;
    grid.appendChild(h('button', {
      class: 'card clickable', style: 'text-align:left;border:1px solid var(--rule);padding:0' + (resumable ? ';opacity:.5' : ''),
      disabled: !!resumable,
      title: resumable ? 'Resume or discard your unfinished session first' : '',
      onclick: () => configureMode(m)
    }, [
      h('div', { class: 'card-b' }, [
        h('div', { class: 'row' }, [h('h3', { style: 'font-size:15.5px', text: info.label }), h('div', { class: 'spacer' }), count != null ? h('span', { class: 'badge ' + (count ? 'b-review' : 'b-draft'), text: count + ' ready' }) : null]),
        h('p', { class: 'card-desc', style: 'margin:6px 0 0', text: info.desc })
      ])
    ]));
  });
  root.appendChild(grid);
  if (preselect && MODES[preselect]) setTimeout(() => configureMode(preselect), 20);
};

/* ---------- mode configuration ---------- */
async function configureMode(mode) {
  const all = await State.questions();
  const pool = eligiblePool(all);
  const body = h('div', { class: 'stack' });
  const f = { domains: [], topics: [], sources: [], modules: [], difficulty: [], batches: [] };
  const cfg = { filters: f, count: mode === 'mock' ? Settings.get('mockCount') : 20, weighted: mode === 'mixed' || mode === 'mock', minutes: Settings.get('mockMinutes') };

  const countLabel = h('span', { class: 'docnum' });
  const recount = () => {
    let p = applyFilters(pool, f);
    if (mode === 'spaced') p = p.filter(q => q.nextReviewAt && new Date(q.nextReviewAt) <= new Date());
    countLabel.textContent = p.length + ' eligible';
    countLabel.style.color = p.length < cfg.count ? 'var(--pencil)' : 'var(--green)';
    warn.classList.toggle('hidden', p.length >= cfg.count);
    warn.textContent = 'Only ' + p.length + ' question(s) match. The session will run with what is available rather than repeating any question.';
  };
  const warn = h('div', { class: 'notice warn hidden' });

  const chipRow = (label, items, arr) => {
    const box = h('div', { class: 'seg' });
    items.forEach(it => {
      box.appendChild(h('button', {
        class: 'chip', 'aria-pressed': 'false',
        onclick: (e) => {
          const on = e.currentTarget.getAttribute('aria-pressed') === 'true';
          e.currentTarget.setAttribute('aria-pressed', on ? 'false' : 'true');
          const i = arr.indexOf(it.v);
          if (on) { if (i >= 0) arr.splice(i, 1); } else if (i < 0) arr.push(it.v);
          recount();
        }, text: it.label
      }));
    });
    return h('div', { class: 'field' }, [h('label', { text: label }), box]);
  };

  if (mode !== 'spaced') {
    body.appendChild(chipRow('Domains — leave empty for all', State.course.blueprint.map(d => ({ v: d.id, label: d.id + ' · ' + d.name.split(' ').slice(0, 4).join(' ') })).concat([{ v: null, label: 'Unmapped' }]), f.domains));
  }
  if (mode === 'domain' || mode === 'custom') {
    const topics = Array.from(new Set(pool.map(q => q.topic).filter(Boolean))).sort().slice(0, 40);
    if (topics.length) body.appendChild(chipRow('Topics', topics.map(t => ({ v: t, label: t })), f.topics));
    const mods = Array.from(new Set(pool.map(q => q.srcModule).filter(Boolean))).sort();
    if (mods.length) body.appendChild(chipRow('Source modules', mods.map(t => ({ v: t, label: t })), f.modules));
  }
  if (mode === 'custom') {
    const srcs = await DB.byIndex('sources', 'courseId', State.course.id);
    if (srcs.length) body.appendChild(chipRow('Sources', srcs.map(s => ({ v: s.id, label: s.title })), f.sources));
    body.appendChild(chipRow('Difficulty', DIFFICULTY.map(d => ({ v: d, label: d })), f.difficulty));
    const flags = h('div', { class: 'grid g2' });
    [['neverAttempted', 'Never attempted'], ['incorrect', 'Previously incorrect'], ['guessed', 'Guessed correct'], ['lowConfidence', 'Answered with low confidence'], ['flagged', 'Flagged'], ['due', 'Due for review'], ['notMastered', 'Below mastery target']].forEach(([k, label]) => {
      flags.appendChild(h('label', { class: 'check' }, [h('input', { type: 'checkbox', onchange: (e) => { f[k] = e.target.checked; if (k === 'notMastered') f.masteryTarget = Settings.get('masteryTarget'); recount(); } }), h('span', { text: label })]));
    });
    body.appendChild(h('div', { class: 'field' }, [h('label', { text: 'Include only' }), flags]));
  }
  if (mode === 'redo') { f.incorrect = false; body.appendChild(h('div', { class: 'notice' }, 'This mode gathers everything you got wrong, everything you guessed correctly, low-confidence answers and anything flagged.')); }
  if (mode === 'weak') body.appendChild(h('div', { class: 'notice' }, 'Questions are ranked by topic weakness, recent mistakes, guessed answers and overdue reviews. The ranking reasons are shown on the results screen.'));

  const countInput = h('input', { type: 'number', min: '1', max: '250', value: String(cfg.count), onchange: (e) => { cfg.count = clamp(parseInt(e.target.value, 10) || 1, 1, 250); recount(); } });
  const row = h('div', { class: 'grid g2' }, [h('div', { class: 'field' }, [h('label', { text: 'Number of questions' }), countInput])]);
  if (mode === 'mock') {
    row.appendChild(h('div', { class: 'field' }, [h('label', { text: 'Time limit (minutes)' }), h('input', { type: 'number', min: '5', max: '600', value: String(cfg.minutes), onchange: (e) => cfg.minutes = clamp(parseInt(e.target.value, 10) || 60, 5, 600) })]));
  }
  body.appendChild(row);
  if (mode === 'mixed') {
    body.appendChild(h('label', { class: 'check' }, [h('input', { type: 'checkbox', checked: true, onchange: (e) => cfg.weighted = e.target.checked }), h('span', { text: 'Distribute by official exam weights (' + State.course.blueprint.map(d => d.weight + '%').join(' / ') + ')' })]));
  }
  body.appendChild(h('div', { class: 'row' }, [h('span', { class: 'eyebrow', text: 'Matching pool' }), countLabel]));
  body.appendChild(warn);
  recount();

  const res = await modal({
    title: MODES[mode].label, body, wide: mode === 'custom',
    actions: [
      { label: 'Cancel', value: null },
      mode === 'custom' ? { label: 'Save as preset', value: 'preset' } : null,
      { label: 'Start', value: 'start', kind: 'primary' }
    ].filter(Boolean)
  });
  if (!res) return;
  if (mode === 'spaced') { f.due = true; }
  if (mode === 'redo') { cfg.redo = true; }
  if (res === 'preset') {
    const name = prompt('Name this preset');
    if (name) { await DB.put('presets', { id: uuid(), courseId: State.course.id, name, mode, config: cfg, createdAt: nowISO() }); toast('Preset saved', 'ok'); }
    return;
  }
  try {
    if (cfg.redo) {
      // union of incorrect / guessed / low confidence / flagged
      const base = applyFilters(pool, f);
      const keep = base.filter(q => q.stats.incorrect > 0 || q.stats.guessedCorrect > 0 || q.flagged || (q.stats.attempts > 0 && (q.stats.confidence || 1) < 0.5));
      if (!keep.length) { toast('Nothing to redo yet — no incorrect, guessed or flagged questions.', 'warn', 4200); return; }
      cfg.filters = Object.assign({}, f, { explicitUuids: keep.map(q => q.uuid) });
      const s = await Session.create(mode, Object.assign({}, cfg, { filters: { ...f } }));
      s.questionUuids = shuffle(keep.map(q => q.uuid), mulberry32(s.seed)).slice(0, cfg.count);
      s.optionOrders = {};
      const rng2 = mulberry32(s.seed ^ 0x9e3779b9);
      keep.forEach(q => { s.optionOrders[q.uuid] = (Settings.get('shuffleOptions') && !q.lockOptionOrder) ? shuffle(q.options.map(o => o.id), rng2) : q.options.map(o => o.id); });
      await Session.save(s);
      runSession(s);
      return;
    }
    const s = await Session.create(mode, cfg);
    runSession(s);
  } catch (e) {
    modal({ title: 'Cannot start this session', body: h('p', { text: e.message }) });
  }
}

/* ---------- runner ---------- */
async function runSession(s) {
  State.session = s;
  State.view = 'runner';
  const all = await State.questions();
  const byId = new Map(all.map(q => [q.uuid, q]));
  const isMock = s.mode === 'mock';
  const target = $('#view');
  let idx = s.cursor || 0;
  let qStart = Date.now();
  let tickTimer = null;

  if (s.leftAt) { s.elapsedMs = (s.elapsedMs || 0) + (Date.now() - s.leftAt); s.leftAt = null; }
  s.lastTickAt = Date.now();
  const tick = async () => {
    const nowT = Date.now();
    s.elapsedMs = (s.elapsedMs || 0) + (nowT - s.lastTickAt);
    s.lastTickAt = nowT;
    if (isMock) {
      const left = s.timeLimitMs - s.elapsedMs;
      const t = $('#mockTimer');
      if (t) { t.textContent = clock(left); t.classList.toggle('low', left < 600000); }
      if (left <= 0) { clearInterval(tickTimer); toast('Time is up. The exam has been submitted.', 'warn', 5000); await submitMock(); return; }
      if (s.elapsedMs % 15000 < 1100) await Session.save(s);
    }
  };
  if (isMock) { tickTimer = setInterval(tick, 1000); }

  const stop = () => { if (tickTimer) clearInterval(tickTimer); document.removeEventListener('keydown', onKey); State.runnerStop = null; };
  // Confirm-and-clean-up, shared by the runner's own Exit/Pause button and
  // by go()'s nav-rail guard below — so leaving via either path behaves
  // identically: same confirm wording, same real-time gap stamped for a
  // non-pausable mock, same save, and critically the same State.session =
  // null, without which every later nav click would re-show this same
  // confirm forever and a resumed mock's elapsed time would silently stop
  // advancing while "away" instead of accounting for the real gap.
  // Returns true once actually left, false if the student declined.
  const leaveGuarded = async () => {
    if (isMock && Settings.get('confirmLeaveMock')) {
      const ok = await confirmBox('Pause the exam?', Settings.get('mockAllowPause')
        ? 'The timer stops and you can resume from the Practice screen.'
        : 'Pausing is disabled in Settings, so the timer keeps running. Your answers are saved either way.');
      if (!ok) return false;
    }
    if (isMock && !Settings.get('mockAllowPause')) s.leftAt = Date.now();
    stop();
    await Session.save(s);
    State.session = null;
    return true;
  };
  State.runnerStop = leaveGuarded;

  function render() {
    target.textContent = '';
    const q = byId.get(s.questionUuids[idx]);
    if (!q) { target.appendChild(h('div', { class: 'notice bad' }, 'This question is no longer in the bank.')); return; }
    const rec = s.responses[q.uuid];
    const answered = !!rec;
    const revealed = answered && MODES[s.mode].reveal;
    const order = s.optionOrders[q.uuid] || q.options.map(o => o.id);
    const opts = order.map(id => q.options.find(o => o.id === id)).filter(Boolean);

    const head = h('div', { class: 'row wrap', style: 'margin-bottom:14px' }, [
      h('span', { class: 'docnum', text: (idx + 1) + ' / ' + s.questionUuids.length }),
      h('span', { class: 'badge b-info', text: MODES[s.mode].label }),
      !isMock ? h('span', { class: 'badge b-draft', text: State.domainShort(q.domainId) }) : null,
      h('div', { class: 'spacer' }),
      isMock ? h('span', { class: 'timer', id: 'mockTimer', text: clock(s.timeLimitMs - (s.elapsedMs || 0)) }) : null,
      h('button', {
        class: 'btn sm', 'aria-pressed': String(!!s.flags[q.uuid]),
        onclick: async () => {
          // Persisted to the question record itself, not just this
          // session's own flag map — otherwise flagging a question after
          // already answering it (an ordinary "that one was tricky" order)
          // would quietly vanish the moment this session is discarded,
          // even though the Discard dialog reassures the student that
          // "anything already answered is already recorded".
          s.flags[q.uuid] = !s.flags[q.uuid]; q.flagged = !!s.flags[q.uuid];
          await Promise.all([Session.save(s), DB.put('questions', q)]);
          State.invalidate();
          render();
        },
        text: s.flags[q.uuid] ? '⚑ Flagged' : '⚐ Flag'
      }),
      h('button', { class: 'btn sm ghost', onclick: () => leave(), text: isMock ? (Settings.get('mockAllowPause') ? 'Pause' : 'Leave') : 'Exit' })
    ]);

    const shell = h('div', { class: 'q-shell' });
    shell.appendChild(head);
    if (isMock) shell.appendChild(mockPaletteBar());
    if (!isMock) shell.appendChild(h('div', { class: 'qmeta' }, [h('span', { class: 'docnum dim', text: q.qid || '(unassigned)' })]));
    shell.appendChild(h('div', { class: 'q-stem', text: q.stem }));
    if (q.imageId) shell.appendChild(h('div', { id: 'qimg', class: 'imgstage', style: 'margin-bottom:14px' }));

    const list = h('div', { class: 'opts' });
    opts.forEach((o, i) => {
      const chosen = rec && rec.selectedOptionId === o.id;
      let cls = 'opt';
      if (revealed) {
        if (o.id === q.correctOptionId) cls += ' correct';
        else if (chosen) cls += ' wrong';
      }
      list.appendChild(h('button', {
        class: cls, 'aria-pressed': String(!!chosen), disabled: revealed,
        onclick: () => choose(q, o.id)
      }, [h('span', { class: 'lt', text: letterOf(i) }), h('span', { style: 'flex:1', text: o.text })]));
    });
    shell.appendChild(list);

    if (revealed) {
      const rev = h('div', { class: 'reveal stack' });
      rev.appendChild(h('div', { class: 'row' }, [
        h('span', { class: 'badge ' + (rec.correct ? 'b-active' : 'b-conflict'), text: rec.correct ? '✓ Correct' : '✕ Incorrect' }),
        h('span', { class: 'small muted', text: 'Answer: ' + letterOf(order.indexOf(q.correctOptionId)) + ' · ' + fmtDur(rec.ms) }),
        q.srReason ? h('span', { class: 'small dim', text: '· ' + q.srReason }) : null
      ]));
      if (q.explanation) rev.appendChild(h('div', { class: 'exp', text: q.explanation }));
      else rev.appendChild(h('div', { class: 'notice warn' }, 'No explanation was captured for this question. Add one from the Question Bank so future revisions are useful.'));
      rev.appendChild(learningPointBox(q));
      shell.appendChild(rev);
    }

    const navRow = h('div', { class: 'row', style: 'margin-top:20px;gap:8px' }, [
      h('button', { class: 'btn', disabled: idx === 0, onclick: () => move(-1), text: '← Previous' }),
      h('div', { class: 'spacer' }),
      idx < s.questionUuids.length - 1
        ? h('button', { class: 'btn primary', onclick: () => move(1), text: 'Next →' })
        : h('button', { class: 'btn primary', onclick: () => isMock ? confirmSubmit() : finish(), text: isMock ? 'Submit exam' : 'Finish session' })
    ]);
    shell.appendChild(navRow);
    target.appendChild(shell);
    if (q.imageId) loadImageInto('#qimg', q.imageId);
    qStart = Date.now();
  }

  function mockPaletteBar() {
    const wrap = h('div', { class: 'card', style: 'margin-bottom:14px' });
    const b = h('div', { class: 'card-b tight' });
    const answered = s.questionUuids.filter(u => s.responses[u]).length;
    b.appendChild(h('div', { class: 'row small', style: 'margin-bottom:8px' }, [
      h('span', { class: 'eyebrow', text: 'Question palette' }),
      h('div', { class: 'spacer' }),
      h('span', { class: 'num', text: answered + ' answered · ' + (s.questionUuids.length - answered) + ' left' })
    ]));
    const pal = h('div', { class: 'palette' });
    s.questionUuids.forEach((u, i) => {
      pal.appendChild(h('button', {
        class: 'pal' + (s.responses[u] ? ' answered' : '') + (s.flags[u] ? ' flagged' : '') + (i === idx ? ' cur' : ''),
        onclick: () => { saveTime(); idx = i; s.cursor = i; Session.save(s); render(); },
        'aria-label': 'Question ' + (i + 1), text: String(i + 1)
      }));
    });
    b.appendChild(pal);
    wrap.appendChild(b);
    return wrap;
  }

  function saveTime() { /* time is captured per response */ }

  async function choose(q, optId) {
    const ms = Date.now() - qStart;
    if (MODES[s.mode].confidence) {
      const conf = await askConfidence(q, optId);
      if (conf === null) return;
      const correct = optId === q.correctOptionId;
      let mistake = null;
      if (!correct) mistake = await askMistake();
      await Session.answer(s, q, optId, { ms, confidence: conf, mistake });
      State.invalidate();
      const all2 = await State.questions();
      byId.clear(); all2.forEach(x => byId.set(x.uuid, x));
    } else {
      s.responses[q.uuid] = { selectedOptionId: optId, correct: optId === q.correctOptionId, ms, confidence: null, mistake: null, at: nowISO(), qVersion: q.version };
      await Session.save(s);
    }
    render();
  }

  function move(d) {
    idx = clamp(idx + d, 0, s.questionUuids.length - 1);
    s.cursor = idx; Session.save(s); render();
  }
  async function leave() {
    if (await leaveGuarded()) go('practice');
  }
  async function confirmSubmit() {
    const unanswered = s.questionUuids.filter(u => !s.responses[u]).length;
    const flagged = Object.keys(s.flags).filter(k => s.flags[k]).length;
    const ok = await confirmBox('Submit the exam?',
      unanswered ? unanswered + ' question(s) are still unanswered' + (flagged ? ' and ' + flagged + ' are flagged' : '') + '. Submitting is final for this attempt.'
        : 'All questions are answered' + (flagged ? ', ' + flagged + ' flagged' : '') + '. Submitting is final for this attempt.');
    if (ok) await submitMock();
  }
  async function submitMock() { stop(); await Session.finish(s); State.session = null; State.invalidate(); showResults(s); }
  async function finish() { stop(); await Session.finish(s); State.session = null; State.invalidate(); showResults(s); }

  function onKey(e) {
    if (e.target.matches('input,textarea,select') || $('.modal-bg')) return;
    const q = byId.get(s.questionUuids[idx]);
    if (!q) return;
    const order = s.optionOrders[q.uuid] || q.options.map(o => o.id);
    const k = e.key.toUpperCase();
    const li = LETTERS.indexOf(k);
    const ni = '12345678'.indexOf(e.key);
    if ((li >= 0 && li < order.length) || (ni >= 0 && ni < order.length)) {
      if (!s.responses[q.uuid] || !MODES[s.mode].reveal) { e.preventDefault(); choose(q, order[li >= 0 ? li : ni]); }
      return;
    }
    if (k === 'F') { e.preventDefault(); s.flags[q.uuid] = !s.flags[q.uuid]; q.flagged = !!s.flags[q.uuid]; Promise.all([Session.save(s), DB.put('questions', q)]).then(() => { State.invalidate(); render(); }); }
    else if (e.key === 'ArrowRight' || k === 'N' || e.key === 'Enter') { e.preventDefault(); if (idx < s.questionUuids.length - 1) move(1); }
    else if (e.key === 'ArrowLeft' || k === 'P') { e.preventDefault(); move(-1); }
    else if (e.key === '?') { e.preventDefault(); showShortcuts(); }
  }
  document.addEventListener('keydown', onKey);
  $$('.nav-item').forEach(b => b.setAttribute('aria-current', 'false'));
  await band(MODES[s.mode].label, 'Session ' + s.id.slice(0, 8), [{ k: 'Seed', v: String(s.seed) }]);
  render();
}

function learningPointBox(q) {
  const ta = h('textarea', { placeholder: 'What will you remember next time? One line is enough.', value: q.learningPoint || '' });
  const save = debounce(async () => {
    const fresh = await Questions.get(q.uuid);
    fresh.learningPoint = ta.value.slice(0, 600);
    await DB.put('questions', fresh);
    State.invalidate();
  }, 700);
  ta.addEventListener('input', save);
  return h('div', { class: 'field' }, [h('label', { text: 'My learning point' }), ta]);
}

function askConfidence(q, optId) {
  void q; void optId;
  return modal({
    title: 'How did you arrive at that?', sticky: true,
    body: h('p', { class: 'muted', text: 'This is what separates knowing from getting lucky, so the mastery score can tell them apart.' }),
    actions: CONFIDENCE.map(c => ({ label: c.label, value: c.k, kind: c.k === 'knew' ? 'primary' : '' }))
  });
}
function askMistake() {
  return modal({
    title: 'What went wrong?', sticky: true,
    body: h('div', { class: 'seg' }, MISTAKES.map(([k, label]) =>
      h('button', { class: 'chip', dataset: { k }, onclick: (e) => { e.currentTarget.closest('.modal').dataset.pick = k; $$('.chip', e.currentTarget.parentNode).forEach(c => c.setAttribute('aria-pressed', 'false')); e.currentTarget.setAttribute('aria-pressed', 'true'); }, text: label }))),
    actions: [
      { label: 'Skip', value: null },
      { label: 'Save', kind: 'primary', value: '__pick', before: (body) => { const sel = body.querySelector('.chip[aria-pressed="true"]'); askMistake._v = sel ? sel.dataset.k : null; } }
    ]
  }).then(v => v === '__pick' ? askMistake._v : null);
}

/* ---------- results ---------- */
async function showResults(s) {
  const all = await State.questions();
  const byId = new Map(all.map(q => [q.uuid, q]));
  const sc = sessionScore(s, byId);
  State.view = 'results';
  const target = $('#view');
  target.textContent = '';
  await band('Session results', MODES[s.mode].label + ' · ' + fmtDate(s.endedAt || s.startedAt, true), [
    { k: 'Score', v: sc.correct + '/' + sc.total },
    { k: 'Accuracy', v: Math.round(sc.accuracy * 100) + '%', color: sc.accuracy >= 0.75 ? 'var(--green)' : sc.accuracy >= 0.6 ? 'var(--amber)' : 'var(--pencil)' }
  ], [h('button', { class: 'btn', onclick: () => go('practice'), text: 'Back to practice' })]);

  const tiles = h('div', { class: 'grid g4', style: 'margin-bottom:16px' });
  const t = (k, v, sub, cls) => tiles.appendChild(h('div', { class: 'tile ' + (cls || '') }, [h('span', { class: 'eyebrow', text: k }), h('b', { text: v }), sub ? h('div', { class: 'sub', text: sub }) : null]));
  t('Correct', String(sc.correct), 'of ' + sc.answered + ' answered', sc.accuracy >= 0.75 ? 'good' : '');
  t('Unanswered', String(sc.total - sc.answered), sc.total - sc.answered ? 'Left blank' : 'None');
  t('Guessed correct', String(sc.guessedCorrect), 'Counted as weak knowledge', sc.guessedCorrect ? 'hot' : '');
  t('Average time', fmtDur(sc.avgMs), 'per answered question');
  target.appendChild(tiles);

  // domain breakdown
  const domCard = h('div', { class: 'card', style: 'margin-bottom:16px' }, [h('div', { class: 'card-h' }, h('h3', { text: 'By domain' }))]);
  const tb = h('tbody');
  sc.byDomain.forEach((g, k) => {
    const acc = g.answered ? g.correct / g.answered : 0;
    tb.appendChild(h('tr', {}, [
      h('td', { text: k === 'unmapped' ? 'Unmapped' : State.domainName(k) }),
      h('td', { class: 'num', text: String(g.total) }),
      h('td', { class: 'num', text: g.correct + ' / ' + g.answered }),
      h('td', {}, h('div', { class: 'bar' }, h('i', { class: acc >= 0.75 ? 'g' : acc >= 0.6 ? 'a' : 'r', style: 'width:' + Math.round(acc * 100) + '%' }))),
      h('td', { class: 'num right', text: g.answered ? Math.round(acc * 100) + '%' : '—' })
    ]));
  });
  domCard.appendChild(h('div', { class: 'tbl-wrap' }, h('table', {}, [h('thead', {}, h('tr', {}, ['Domain', 'Asked', 'Correct', '', 'Accuracy'].map(x => h('th', { text: x })))), tb])));
  target.appendChild(domCard);

  if (s.shortfalls && s.shortfalls.length) {
    target.appendChild(h('div', { class: 'notice warn', style: 'margin-bottom:16px' },
      'Weighted selection could not be met in full: ' + s.shortfalls.map(x => State.domainName(x.id) + ' wanted ' + x.want + ', supplied ' + x.got).join('; ') + '. The balance was drawn from other domains.'));
  }

  // review list
  const wrong = s.questionUuids.filter(u => s.responses[u] && !s.responses[u].correct);
  const guessed = s.questionUuids.filter(u => s.responses[u] && s.responses[u].correct && s.responses[u].confidence === 'guessed');
  const flagged = s.questionUuids.filter(u => s.flags[u]);
  const groups = [['Incorrect', wrong], ['Correct but guessed', guessed], ['Flagged', flagged]];
  groups.forEach(([label, list]) => {
    if (!list.length) return;
    const card = h('div', { class: 'card', style: 'margin-bottom:16px' }, [h('div', { class: 'card-h' }, [h('h3', { text: label }), h('span', { class: 'badge b-draft', text: String(list.length) })])]);
    const b = h('div', { class: 'card-b stack' });
    list.forEach(u => {
      const q = byId.get(u); if (!q) return;
      const rec = s.responses[u];
      const order = s.optionOrders[u] || q.options.map(o => o.id);
      b.appendChild(h('div', { style: 'border-left:3px solid var(--rule);padding-left:12px' }, [
        h('div', { class: 'row', style: 'gap:8px' }, [h('span', { class: 'docnum dim', text: q.qid }), h('span', { class: 'tiny dim', text: State.domainShort(q.domainId) })]),
        h('div', { class: 'small', style: 'margin:4px 0 6px', text: q.stem.slice(0, 220) + (q.stem.length > 220 ? '…' : '') }),
        rec ? h('div', { class: 'tiny' }, [
          h('span', { style: 'color:var(--pencil)', text: rec.correct ? '' : 'You chose ' + letterOf(order.indexOf(rec.selectedOptionId)) + '. ' }),
          h('span', { style: 'color:var(--green)', text: 'Correct: ' + letterOf(order.indexOf(q.correctOptionId)) })
        ]) : null,
        h('button', { class: 'btn sm', style: 'margin-top:6px', onclick: () => openQuestion(q.uuid), text: 'Open question' })
      ]));
    });
    card.appendChild(b);
    target.appendChild(card);
  });
  target.appendChild(h('div', { class: 'row' }, [
    h('button', { class: 'btn primary', onclick: () => go('practice'), text: 'Practise again' }),
    h('button', { class: 'btn', onclick: () => go('analytics'), text: 'Open analytics' })
  ]));
}


/* ============================================================================
   10 · Question Bank — search, filter, bulk control, detail and editing
   ========================================================================== */

const BankState = { q: '', status: '', domain: '', source: '', batch: '', verif: '', learn: '', diff: '', sort: 'qid', dir: 1, page: 0, size: 50, view: 'table', sel: new Set() };

ROUTES.bank = async (root) => {
  const all = await State.questions();
  const sources = await DB.byIndex('sources', 'courseId', State.course.id);
  const batches = await DB.byIndex('batches', 'courseId', State.course.id);
  await band('Question Bank', 'Controlled register', [
    { k: 'Records', v: String(all.length) },
    { k: 'Practice-ready', v: String(all.filter(isPracticeEligible).length), color: 'var(--green)' }
  ], [
    h('button', { class: 'btn', onclick: () => go('import'), text: 'Import' }),
    h('button', { class: 'btn primary', onclick: () => newQuestion(), text: 'New question' })
  ]);

  const filters = h('div', { class: 'card', style: 'margin-bottom:14px' });
  const fb = h('div', { class: 'card-b' });
  const line1 = h('div', { class: 'grid g4' });
  // Changing a filter or the search box leaves an earlier tick-box
  // selection intact but off-screen — a bulk action taken afterward would
  // silently still include it, with nothing in the confirmation naming
  // which records are affected. Clearing on every filter change (like the
  // clear that already happens once a bulk action completes) keeps "what's
  // ticked" always matching "what's currently visible".
  const search = h('input', { type: 'search', placeholder: 'Question ID or text…', value: BankState.q, oninput: debounce(e => { BankState.q = e.target.value; BankState.page = 0; BankState.sel.clear(); draw(); }, 260) });
  line1.appendChild(h('div', { class: 'field' }, [h('label', { text: 'Search' }), search]));
  const mkSel = (label, key, opts) => {
    const s = h('select', { onchange: e => { BankState[key] = e.target.value; BankState.page = 0; BankState.sel.clear(); draw(); } },
      opts.map(o => h('option', { value: o.v, selected: BankState[key] === o.v }, o.label)));
    return h('div', { class: 'field' }, [h('label', { text: label }), s]);
  };
  line1.appendChild(mkSel('Status', 'status', [{ v: '', label: 'Any status' }].concat(Object.keys(STATUS).map(k => ({ v: k, label: STATUS[k].label })))));
  line1.appendChild(mkSel('Domain', 'domain', [{ v: '', label: 'Any domain' }].concat(State.course.blueprint.map(d => ({ v: d.id, label: d.id + ' · ' + d.name.split(' ').slice(0, 3).join(' ') }))).concat([{ v: 'none', label: 'Unmapped' }])));
  line1.appendChild(mkSel('Learning state', 'learn', [
    { v: '', label: 'Any' }, { v: 'never', label: 'Never attempted' }, { v: 'attempted', label: 'Attempted' },
    { v: 'incorrect', label: 'Answered incorrectly' }, { v: 'guessed', label: 'Guessed correct' },
    { v: 'mastered', label: 'Mastered' }, { v: 'due', label: 'Due for review' }, { v: 'flagged', label: 'Flagged' }
  ]));
  fb.appendChild(line1);
  const line2 = h('div', { class: 'grid g4', style: 'margin-top:10px' });
  line2.appendChild(mkSel('Source', 'source', [{ v: '', label: 'Any source' }].concat(sources.map(s => ({ v: s.id, label: s.title })))));
  line2.appendChild(mkSel('Import batch', 'batch', [{ v: '', label: 'Any batch' }].concat(batches.slice().reverse().map(b => ({ v: b.id, label: b.label || fmtDate(b.startedAt, true) })))));
  line2.appendChild(mkSel('Verification', 'verif', [{ v: '', label: 'Any' }, { v: 'verified', label: 'Answer verified' }, { v: 'unverified', label: 'Answer unverified' }, { v: 'doubtful', label: 'Answer doubtful' }]));
  line2.appendChild(mkSel('Difficulty', 'diff', [{ v: '', label: 'Any' }].concat(DIFFICULTY.map(d => ({ v: d, label: d })))));
  fb.appendChild(line2);
  filters.appendChild(fb);
  root.appendChild(filters);

  const toolbar = h('div', { class: 'row wrap', style: 'margin-bottom:10px' });
  root.appendChild(toolbar);
  const listWrap = h('div');
  root.appendChild(listWrap);
  const pager = h('div', { class: 'row', style: 'margin-top:12px;justify-content:center;gap:10px' });
  root.appendChild(pager);

  function filtered() {
    const now = new Date();
    const term = BankState.q.trim().toLowerCase();
    let list = all.filter(q => {
      if (BankState.status && q.status !== BankState.status) return false;
      if (BankState.domain) { if (BankState.domain === 'none') { if (q.domainId) return false; } else if (q.domainId !== BankState.domain) return false; }
      if (BankState.source && q.sourceId !== BankState.source) return false;
      if (BankState.batch && q.batchId !== BankState.batch) return false;
      if (BankState.verif && q.answerVerified !== BankState.verif) return false;
      if (BankState.diff && q.difficulty !== BankState.diff) return false;
      const L = BankState.learn;
      if (L === 'never' && q.stats.attempts) return false;
      if (L === 'attempted' && !q.stats.attempts) return false;
      if (L === 'incorrect' && !q.stats.incorrect) return false;
      if (L === 'guessed' && !q.stats.guessedCorrect) return false;
      if (L === 'mastered' && (q.stats.mastery || 0) < Settings.get('masteryTarget')) return false;
      if (L === 'due' && !(q.nextReviewAt && new Date(q.nextReviewAt) <= now)) return false;
      if (L === 'flagged' && !q.flagged) return false;
      if (term) {
        const hay = (q.qid || '') + ' ' + q.stem + ' ' + q.options.map(o => o.text).join(' ') + ' ' + (q.topic || '') + ' ' + (q.aliasQids || []).join(' ');
        if (hay.toLowerCase().indexOf(term) < 0) return false;
      }
      return true;
    });
    const dir = BankState.dir;
    const key = BankState.sort;
    list.sort((a, b) => {
      let x, y;
      if (key === 'qid') { x = IdRegister.seqOf(a.qid); y = IdRegister.seqOf(b.qid); }
      else if (key === 'imported') { x = a.importedAt || a.createdAt; y = b.importedAt || b.createdAt; }
      else if (key === 'last') { x = a.stats.lastAttemptAt || ''; y = b.stats.lastAttemptAt || ''; }
      else if (key === 'acc') { x = a.stats.attempts ? a.stats.correct / a.stats.attempts : -1; y = b.stats.attempts ? b.stats.correct / b.stats.attempts : -1; }
      else if (key === 'mastery') { x = a.stats.mastery || 0; y = b.stats.mastery || 0; }
      else if (key === 'due') { x = a.nextReviewAt || '9999'; y = b.nextReviewAt || '9999'; }
      else { x = a.qid; y = b.qid; }
      return x < y ? -dir : x > y ? dir : 0;
    });
    return list;
  }

  function draw() {
    const list = filtered();
    const pages = Math.max(1, Math.ceil(list.length / BankState.size));
    BankState.page = clamp(BankState.page, 0, pages - 1);
    const slice = list.slice(BankState.page * BankState.size, (BankState.page + 1) * BankState.size);

    toolbar.textContent = '';
    toolbar.appendChild(h('span', { class: 'eyebrow', text: list.length + ' matching · ' + BankState.sel.size + ' selected' }));
    toolbar.appendChild(h('div', { class: 'spacer' }));
    toolbar.appendChild(h('div', { class: 'btn-group' }, [
      h('button', { 'aria-pressed': String(BankState.view === 'table'), onclick: () => { BankState.view = 'table'; draw(); }, text: 'Table' }),
      h('button', { 'aria-pressed': String(BankState.view === 'card'), onclick: () => { BankState.view = 'card'; draw(); }, text: 'Cards' })
    ]));
    if (BankState.sel.size) {
      toolbar.appendChild(h('button', { class: 'btn sm', onclick: () => bulkClassify(), text: 'Classify' }));
      toolbar.appendChild(h('button', { class: 'btn sm', onclick: () => bulkVerify(), text: 'Verify answers' }));
      toolbar.appendChild(h('button', { class: 'btn sm', onclick: () => bulkStatus('active'), text: 'Activate' }));
      toolbar.appendChild(h('button', { class: 'btn sm', onclick: () => bulkStatus('archived'), text: 'Archive' }));
      toolbar.appendChild(h('button', { class: 'btn sm ghost', onclick: () => { BankState.sel.clear(); draw(); }, text: 'Clear' }));
    }
    toolbar.appendChild(h('button', { class: 'btn sm', onclick: () => exportBank(list), text: 'Export view' }));
    toolbar.appendChild(h('button', { class: 'btn sm ghost', title: 'Check the whole bank for conflicts and duplicates, including records edited or imported before this ran automatically', onclick: () => runBankRescan(), text: 'Rescan for conflicts' }));

    listWrap.textContent = '';
    if (!list.length) {
      listWrap.appendChild(h('div', { class: 'card' }, h('div', { class: 'empty' }, [
        h('h3', { text: 'Nothing matches those filters' }),
        h('p', { class: 'muted', text: all.length ? 'Widen the filters, or clear the search box.' : 'The bank is empty — import a file to begin.' })
      ])));
    } else if (BankState.view === 'table') {
      listWrap.appendChild(bankTable(slice));
    } else {
      const g = h('div', { class: 'grid g2' });
      slice.forEach(q => g.appendChild(bankCard(q)));
      listWrap.appendChild(g);
    }

    pager.textContent = '';
    if (pages > 1) {
      pager.appendChild(h('button', { class: 'btn sm', disabled: BankState.page === 0, onclick: () => { BankState.page--; draw(); }, text: '← Previous' }));
      pager.appendChild(h('span', { class: 'docnum', text: 'Page ' + (BankState.page + 1) + ' of ' + pages }));
      pager.appendChild(h('button', { class: 'btn sm', disabled: BankState.page >= pages - 1, onclick: () => { BankState.page++; draw(); }, text: 'Next →' }));
    }
  }

  function bankTable(slice) {
    const card = h('div', { class: 'card' });
    const th = (label, key) => h('th', {
      class: key ? 'sortable' : '', onclick: key ? () => { if (BankState.sort === key) BankState.dir *= -1; else { BankState.sort = key; BankState.dir = 1; } draw(); } : null,
      text: label + (BankState.sort === key ? (BankState.dir > 0 ? ' ▲' : ' ▼') : '')
    });
    const tb = h('tbody');
    slice.forEach(q => {
      const acc = q.stats.attempts ? q.stats.correct / q.stats.attempts : null;
      const dueSoon = q.nextReviewAt && new Date(q.nextReviewAt) <= new Date();
      tb.appendChild(h('tr', { class: BankState.sel.has(q.uuid) ? 'sel' : '' }, [
        h('td', { class: 'gut' }, [h('input', { type: 'checkbox', checked: BankState.sel.has(q.uuid), onchange: e => { e.target.checked ? BankState.sel.add(q.uuid) : BankState.sel.delete(q.uuid); draw(); } })]),
        h('td', { class: 'tick', dataset: { mark: markFor(q) }, style: 'display:table-cell;text-align:center;width:22px', text: (STATUS[q.status] || {}).mark || '·' }),
        h('td', { class: 'docnum nowrap' }, [h('a', { href: '#', onclick: (e) => { e.preventDefault(); openQuestion(q.uuid); }, text: q.qid || '(no id)' })]),
        h('td', {}, [h('div', { class: 'q-prev', text: q.stem }), q.topic ? h('div', { class: 'tiny dim', text: q.topic }) : null]),
        h('td', { class: 'tiny nowrap', text: q.domainId || '—' }),
        h('td', {}, statusBadge(q)),
        h('td', { class: 'num', text: String(q.stats.attempts) }),
        h('td', { class: 'num', text: acc == null ? '—' : Math.round(acc * 100) + '%' }),
        h('td', {}, h('div', { class: 'bar' }, h('i', { class: (q.stats.mastery || 0) >= 75 ? 'g' : (q.stats.mastery || 0) >= 50 ? 'a' : 'r', style: 'width:' + (q.stats.mastery || 0) + '%' }))),
        h('td', { class: 'tiny nowrap', style: dueSoon ? 'color:var(--pencil)' : '', text: q.nextReviewAt ? fmtDate(q.nextReviewAt) : '—' })
      ]));
    });
    card.appendChild(h('div', { class: 'tbl-wrap' }, h('table', {}, [
      h('thead', {}, h('tr', {}, [
        h('th', { class: 'gut' }, h('input', { type: 'checkbox', onchange: e => { slice.forEach(q => e.target.checked ? BankState.sel.add(q.uuid) : BankState.sel.delete(q.uuid)); draw(); } })),
        h('th', { text: '' }), th('Question ID', 'qid'), h('th', { text: 'Question' }), h('th', { text: 'Dom' }),
        h('th', { text: 'Status' }), h('th', { text: 'Att' }), th('Acc', 'acc'), th('Mastery', 'mastery'), th('Due', 'due')
      ])), tb
    ])));
    return card;
  }
  function bankCard(q) {
    const acc = q.stats.attempts ? q.stats.correct / q.stats.attempts : null;
    return h('div', { class: 'card clickable', onclick: () => openQuestion(q.uuid) }, [
      h('div', { class: 'card-b' }, [
        h('div', { class: 'row', style: 'gap:8px;margin-bottom:6px' }, [
          h('span', { class: 'tick', dataset: { mark: markFor(q) }, style: 'border:0;width:auto', text: (STATUS[q.status] || {}).mark }),
          h('span', { class: 'docnum', text: q.qid || '(no id)' }), h('div', { class: 'spacer' }), statusBadge(q)
        ]),
        h('div', { class: 'small', style: 'margin-bottom:8px', text: q.stem.slice(0, 200) + (q.stem.length > 200 ? '…' : '') }),
        h('div', { class: 'row tiny dim wrap', style: 'gap:10px' }, [
          h('span', { text: State.domainShort(q.domainId) }),
          h('span', { text: q.stats.attempts + ' attempt(s)' }),
          h('span', { text: acc == null ? 'no accuracy yet' : Math.round(acc * 100) + '% accurate' }),
          h('span', { text: 'mastery ' + (q.stats.mastery || 0) })
        ])
      ])
    ]);
  }

  async function bulkStatus(status) {
    const sel = Array.from(BankState.sel);
    if (status === 'active') {
      const bad = [];
      for (const u of sel) { const q = await Questions.get(u); if (q.answerVerified !== 'verified' || !q.correctOptionId || q.options.length < 2) bad.push(q.qid); }
      if (bad.length) { const ok = await confirmBox('Some questions cannot be activated', bad.length + ' of ' + sel.length + ' have no verified correct answer, so they will stay in the review queue. Activate the rest?'); if (!ok) return; }
    } else if (status === 'archived') {
      const ok = await confirmBox('Archive ' + sel.length + ' question(s)?', 'They leave the practice pool but keep their Question ID, sources and attempt history. Archiving is reversible.');
      if (!ok) return;
    }
    let applied = 0;
    for (const u of sel) {
      const q = await Questions.get(u);
      if (status === 'active' && (q.answerVerified !== 'verified' || !q.correctOptionId || q.options.length < 2)) continue;
      const prev = q.status; q.status = status; q.updatedAt = nowISO();
      await DB.put('questions', q);
      await audit(status === 'archived' ? 'archive' : 'activate', 'question', q.qid, { status: prev }, { status }, 'bulk');
      applied++;
    }
    BankState.sel.clear(); State.invalidate();
    toast(applied === sel.length ? 'Updated ' + applied + ' record(s)' : 'Updated ' + applied + ' of ' + sel.length + ' record(s)', 'ok');
    go('bank');
  }
  async function bulkVerify() {
    const sel = Array.from(BankState.sel);
    const ok = await confirmBox('Confirm the source answers?', 'This marks the correct answer as verified for ' + sel.length + ' question(s). Only do this where you have actually checked the answer against the source.');
    if (!ok) return;
    let applied = 0;
    for (const u of sel) {
      const q = await Questions.get(u);
      if (!q.correctOptionId) continue;
      q.answerVerified = 'verified'; q.verifiedAt = nowISO(); q.verifyNote = 'Bulk verification';
      if (q.status === 'needs_answer' || q.status === 'draft') q.status = q.domainId ? 'active' : 'needs_class';
      await DB.put('questions', q);
      await audit('verify', 'question', q.qid, null, { answerVerified: 'verified' }, 'bulk');
      applied++;
    }
    BankState.sel.clear(); State.invalidate();
    toast(applied === sel.length ? 'Verified ' + applied + ' record(s)' : 'Verified ' + applied + ' of ' + sel.length + ' record(s) — the rest have no answer chosen yet', 'ok');
    go('bank');
  }
  async function bulkClassify() {
    const sel = Array.from(BankState.sel);
    const dom = h('select', {}, [h('option', { value: '' }, '— leave unchanged —')].concat(State.course.blueprint.map(d => h('option', { value: d.id }, d.id + ' · ' + d.name))));
    const topic = h('input', { type: 'text', placeholder: 'Leave blank to keep existing' });
    const mod = h('input', { type: 'text', placeholder: 'Leave blank to keep existing' });
    const diff = h('select', {}, [h('option', { value: '' }, '— leave unchanged —')].concat(DIFFICULTY.map(d => h('option', { value: d }, d))));
    const r = await modal({
      title: 'Classify ' + sel.length + ' question(s)',
      body: h('div', { class: 'grid g2' }, [
        h('div', { class: 'field' }, [h('label', { text: 'Official domain' }), dom]),
        h('div', { class: 'field' }, [h('label', { text: 'Topic' }), topic]),
        h('div', { class: 'field' }, [h('label', { text: 'Source module' }), mod]),
        h('div', { class: 'field' }, [h('label', { text: 'Difficulty' }), diff])
      ]),
      actions: [{ label: 'Cancel', value: false }, { label: 'Apply', value: true, kind: 'primary' }]
    });
    if (!r) return;
    for (const u of sel) {
      const q = await Questions.get(u);
      const prev = { domainId: q.domainId, topic: q.topic };
      if (dom.value) { q.domainId = dom.value; q.classVerified = 'verified'; }
      if (topic.value.trim()) q.topic = topic.value.trim();
      if (mod.value.trim()) q.srcModule = mod.value.trim();
      if (diff.value) q.difficulty = diff.value;
      if (q.status === 'needs_class' && q.domainId) q.status = q.answerVerified === 'verified' ? 'active' : 'needs_answer';
      q.updatedAt = nowISO();
      await DB.put('questions', q);
      await audit('classify', 'question', q.qid, prev, { domainId: q.domainId, topic: q.topic }, 'bulk');
    }
    BankState.sel.clear(); State.invalidate(); toast('Classification applied', 'ok'); go('bank');
  }
  draw();
};

/* ---------- question detail ---------- */
async function openQuestion(uuidStr) {
  const q = await Questions.get(uuidStr);
  if (!q) { toast('That question no longer exists', 'bad'); return; }
  const attempts = (await DB.byIndex('attempts', 'questionUuid', uuidStr)).sort((a, b) => new Date(b.ts) - new Date(a.ts));
  const versions = (await DB.byIndex('questionVersions', 'questionUuid', uuidStr)).sort((a, b) => b.version - a.version);
  const source = q.sourceId ? await DB.get('sources', q.sourceId) : null;
  const m = masteryOf(q, attempts);

  const body = h('div', { class: 'stack' });
  const tabs = h('div', { class: 'btn-group', style: 'margin-bottom:12px' });
  const pane = h('div', { class: 'stack' });
  const TABS = [['content', 'Content'], ['class', 'Classification'], ['source', 'Provenance'], ['history', 'Attempts'], ['mastery', 'Mastery'], ['versions', 'Versions']];

async function newQuestion() {
  const q = blankQuestion(State.course.id);
  q.options = [makeOption(''), makeOption(''), makeOption(''), makeOption('')];
  q.status = 'draft';
  const ids = await IdRegister.next(State.course.id, 1, { note: 'manual entry' });
  q.qid = ids[0];
  q.sourceRefs = [{ sourceTitle: 'Entered by hand', locator: '', importedAt: nowISO() }];
  await recomputeFingerprint(q);
  await DB.put('questions', q);
  await audit('create', 'question', q.qid, null, { manual: true }, '');
  State.invalidate();
  openQuestion(q.uuid);
}

async function exportBank(list) {
  const rows = [['Question ID', 'Status', 'Stem', 'A', 'B', 'C', 'D', 'E', 'Correct answer', 'Explanation', 'Domain', 'Topic', 'Subtopic', 'Source module', 'Source', 'Source locator', 'Answer verification', 'Attempts', 'Accuracy', 'Mastery']];
  const sources = await DB.byIndex('sources', 'courseId', State.course.id);
  const srcName = (id) => { const s = sources.find(x => x.id === id); return s ? s.title : ''; };
  list.forEach(q => {
    const o = q.options.map(x => x.text);
    const ci = q.options.findIndex(x => x.id === q.correctOptionId);
    rows.push([q.qid, (STATUS[q.status] || {}).label, q.stem, o[0] || '', o[1] || '', o[2] || '', o[3] || '', o[4] || '',
      ci >= 0 ? letterOf(ci) : '', q.explanation, q.domainId ? State.domainName(q.domainId) : 'Unmapped', q.topic, q.subtopic,
      q.srcModule, srcName(q.sourceId), q.locator, q.answerVerified, q.stats.attempts,
      q.stats.attempts ? Math.round(q.stats.correct / q.stats.attempts * 100) + '%' : '', q.stats.mastery || 0]);
  });
  download(State.course.code + '-question-bank-' + todayKey() + '.csv', new Blob(['\uFEFF' + toCSV(rows)], { type: 'text/csv;charset=utf-8' }));
  toast('Exported ' + list.length + ' question(s) to CSV', 'ok');
}

/** A full sweep of the course's live bank for conflicts/duplicates that were
    never caught \u2014 data imported before this feature existed, or edits made
    outside the normal save path (a restore). Everything imported or edited
    through the app is already kept current automatically; this is the
    catch-up tool for what predates that. */
async function runBankRescan() {
  const total = (await State.questions()).filter(q => q.status !== 'merged' && q.status !== 'rejected').length;
  const status = h('div', { class: 'notice' }, 'Checking 0 of ' + total + '\u2026');
  modal({ title: 'Rescan for duplicates & conflicts', body: h('div', { class: 'stack' }, [status]), sticky: true, actions: [{ label: 'Close', value: null }] });
  const r = await rescanCourseForPairs(State.course.id, (checked, n) => { status.textContent = 'Checking ' + checked + ' of ' + n + '\u2026'; });
  State.invalidate();
  status.className = 'notice ' + ((r.newConflicts || r.newDups) ? 'warn' : 'ok');
  status.textContent = 'Checked ' + r.checked + ' question(s). ' +
    (r.newConflicts ? r.newConflicts + ' new answer conflict(s) found. ' : '') +
    (r.newDups ? r.newDups + ' new possible duplicate(s) found. ' : '') +
    (r.cleared ? r.cleared + ' pairing(s) cleared that no longer held. ' : '') +
    (!r.newConflicts && !r.newDups && !r.cleared ? 'Nothing changed \u2014 every pairing already matched the current bank.' : '');
  if (r.newConflicts || r.newDups) status.appendChild(h('div', { style: 'margin-top:8px' },
    h('button', { class: 'btn sm', onclick: () => { State.importStep = 'check'; go('import'); }, text: 'Go to the review queue \u2192' })));
}

async function loadImageInto(sel, imageId) {
  const rec = await DB.get('images', imageId);

  box.textContent = '';
  if (!rec) { box.appendChild(h('div', { class: 'small dim', text: 'Image reference is broken — the stored image is missing.' })); return; }

}

    root.appendChild(h('div', { class: 'card' }, h('div', { class: 'empty' }, [
      h('h3', { text: 'No notes yet' }),
      h('p', { class: 'muted', text: 'Add your revision material above — it will be here, organised by domain, whenever you need a quick look before practising.' })
    ])));
    return;
  }

  const isHtmlNote = (rec) => rec.mimeType.indexOf('html') >= 0 || /\.html?$/i.test(rec.filename || '');
  const openNote = async (rec) => {
    try {
      const blob = await NotesStore.readBlob(rec);
      if (isHtmlNote(rec)) {
        // An HTML note is rendered, not just opened — and rendering someone
        // else's (or your own, months-old, who-knows-where-it-came-from)
        // HTML in the SAME origin as the app would hand any script inside it
        // full run of your question bank, your connected folder, and your
        // Drive access — the same trust boundary as running it as the app
        // itself. A sandboxed iframe with no allow-scripts and no
        // allow-same-origin renders the formatting with none of that: the
        // content sits in a null, fully isolated origin that cannot execute
        // script, read cookies/storage, or reach this page in any way.
        const text = await blob.text();
        const frame = h('iframe', { sandbox: '', srcdoc: text, style: 'width:100%;height:70vh;border:1px solid var(--rule);border-radius:var(--r)' });
        modal({
          title: rec.title, wide: true, sticky: true,
          body: h('div', { class: 'stack' }, [
            h('div', { class: 'small muted' }, 'Rendered in an isolated sandbox — no scripts run, and nothing inside can reach the app or your data.'),
            frame
          ]),
          actions: [{ label: 'Close', value: null }]
        });
        return;
      }
      const url = URL.createObjectURL(blob);
      window.open(url, '_blank');
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    } catch (e) { toast('Could not open that note: ' + e.message, 'bad', 8000); }
  };

  const byDomain = new Map();
  notes.forEach(n => { const k = n.domainId || ''; if (!byDomain.has(k)) byDomain.set(k, []); byDomain.get(k).push(n); });
  const order = [''].concat(State.course.blueprint.map(d => d.id)).filter(k => byDomain.has(k));

  order.forEach(domainId => {
    const list = byDomain.get(domainId);
    const card = h('div', { class: 'card', style: 'margin-bottom:16px' }, [
      h('div', { class: 'card-h' }, [h('h3', { text: domainId ? State.domainShort(domainId) : 'General' }), h('span', { class: 'badge b-review', text: String(list.length) })])
    ]);
    const b = h('div', { class: 'card-b stack' });
    list.forEach(rec => {
      b.appendChild(h('div', { class: 'row wrap', style: 'gap:10px' }, [
        h('span', { class: 'method-ico', text: isHtmlNote(rec) ? '▥' : rec.mimeType.indexOf('pdf') >= 0 ? '▤' : rec.mimeType.indexOf('image') >= 0 ? '▣' : '¶' }),
        h('div', { style: 'flex:1;min-width:180px' }, [
          h('div', { style: 'font-weight:600', text: rec.title }),
          h('div', { class: 'tiny dim', text: (rec.topic ? rec.topic + ' · ' : '') + bytes(rec.sizeKB * 1024) + ' · added ' + fmtDate(rec.createdAt) + ' · ' + (rec.storage === 'folder' ? 'in your folder' : rec.storage === 'drive' ? 'in Google Drive' : 'in this browser') })
        ]),
        h('button', { class: 'btn sm', onclick: () => openNote(rec), text: 'View' }),
        h('button', {
          class: 'btn sm ghost', onclick: async () => {
            const ok = await confirmBox('Remove this note?', 'A copy is downloaded first, automatically. This then removes it from the list and, where possible, deletes the underlying file too — that part cannot be undone from inside the app.', true);
            if (!ok) return;
            if (!(await requireNoteBackup(rec))) return;
            const fileDeleted = await NotesStore.remove(rec);
            toast(fileDeleted === false ? 'Removed — its file could not be deleted; it may still exist there' : 'Removed. A backup copy is in your downloads.');
            go('notes');
          }, text: 'Remove'
        })
      ]));
    });
    card.appendChild(b);
    root.appendChild(card);
  });
};

/* ---------- bundled starter question sets ----------
   Ships alongside index.html so a brand-new course isn't an empty bank.
   Routed through the SAME readFile -> runParse -> staging pipeline as any
   drag-and-dropped file, so duplicate detection and the reconciliation
   screen still apply — this is a shortcut to the form, not around the review. */

/* ---- question files shipped alongside the app ----
   Described by data/starter-index.json rather than hard-coded here, so the
   wording, counts and courses always come from the files actually present.
   Drop a new file into data/, add a line to the index, and it appears. No
   index, or no matching file, means no card — the app never advertises
   questions it has not confirmed are there. */
const STARTER_INDEX = 'data/starter-index.json';
let _catalogue = null;

async function starterCatalogue() {
  if (_catalogue) return _catalogue;
  try {
    const res = await fetch(STARTER_INDEX, { cache: 'no-store' });
    if (!res.ok) { _catalogue = []; return _catalogue; }
    const j = await res.json();
    _catalogue = Array.isArray(j && j.files) ? j.files : [];
  } catch (e) { _catalogue = []; }
  return _catalogue;
}

/** Confirm a listed file is really there, and report its size. */
async function probeStarterFile(entry) {
  try {
    let res = await fetch(entry.file, { method: 'HEAD', cache: 'no-store' });
    if (!res.ok) return { ok: false };
    const len = parseInt(res.headers.get('content-length') || '0', 10);
    return { ok: true, size: isNaN(len) ? 0 : len };
  } catch (e) { return { ok: false }; }
}

async function loadSuppliedBank(entry) {
  let res = null;
  try { res = await fetch(entry.file, { cache: 'no-store' }); } catch (e) { res = null; }
  if (!res || !res.ok) {
    await modal({
      title: 'Could not load those questions',
      body: h('div', { class: 'stack' }, [
        h('div', { class: 'notice bad', text: 'Could not fetch ' + entry.file + '.' }),
        h('p', { class: 'small', text: 'This only works when the app is served over a local web server with the data folder kept alongside index.html — the same setup IndexedDB itself needs. See the README for the one-line command. It will not work if index.html was opened directly by double-clicking it, or if the data folder was separated from it.' })
      ])
    });
    return;
  }
  const blob = await res.blob();
  const file = new File([blob], entry.file.split('/').pop(), { type: 'application/json' });
  let parsed;
  try { parsed = await readFile(file); }
  catch (e) { await modal({ title: 'Could not read that file', body: h('div', { class: 'notice bad', text: e.message }) }); return; }
  await runParse([parsed], {
    title: entry.label || entry.file, author: '', type: 'Question bank', srcModule: '', srcChapter: '',
    defaultDomainId: entry.defaultDomainId || null, template: 'auto', trustSourceAnswers: true,
    notes: 'Supplied with the app, from your own source documents. Answers are marked verified because your source stated them, not because they were independently fact-checked \u2014 spot-check anything that looks off.'
  });
}

/* ---------- intake ---------- */
async function intake(files) {
  files = files.filter(Boolean);
  if (!files.length) return;
  const parsedFiles = [];
  const failures = [];
  for (const f of files) {
    try { parsedFiles.push(await readFile(f)); }
    catch (e) { failures.push({ name: f.name, error: e.message }); }
  }
  if (failures.length) {
    await modal({
      title: 'Some files could not be read',
      body: h('div', { class: 'stack' }, failures.map(f => h('div', { class: 'notice bad' }, [h('b', { text: f.name }), h('div', { class: 'small', text: f.error })])))
    });
  }
  const images = parsedFiles.filter(f => f.kind === 'image');
  const docs = parsedFiles.filter(f => f.kind !== 'image');
  if (images.length && !docs.length) { imageWorkflow(images[0].blob); return; }
  if (!docs.length) return;
  await sourceDialog(docs);
}
