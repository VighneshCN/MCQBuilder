async function doBackup(scope) {
  toast('Packaging backup…');
  try {
    const { blob, manifest } = await buildBackup(scope);
    const name = APP.name.toLowerCase().replace(/\s+/g, '-') + '-backup-' + (scope === 'course' ? State.course.code.toLowerCase() + '-' : '') + todayKey() + '.zip';

    // Prefer the connected folder, same as the automatic safety backup —
    // a browser download can land somewhere the person will not find again.
    let where = 'download';
    if (FileStore.connected && FileStore.dirHandle) {
      try {
        const fh = await FileStore.dirHandle.getFileHandle(name, { create: true });
        const w = await fh.createWritable();
        await w.write(blob);
        await w.close();
        where = 'folder';
      } catch (e) {
        download(name, blob);
      }
    } else {
      download(name, blob);
    }

    await Settings.set('lastBackupAt', nowISO());
    await audit('backup', 'system', '', null, { scope, counts: manifest.counts }, '');
    toast(where === 'folder' ? 'Backup saved to your data folder · ' + bytes(blob.size) : 'Backup saved · ' + bytes(blob.size), 'ok');
    if (State.view === 'backup') go('backup');
  } catch (e) {
    modal({ title: 'Backup failed', body: h('p', { text: e.message }) });
  }
}

async function pickRestore() {
  if ('showOpenFilePicker' in window) {
    try {
      const opts = {
        types: [{ description: 'Backup or import file', accept: { 'application/zip': ['.zip'], 'application/json': ['.json'] } }],
        excludeAcceptAllOption: false, multiple: false
      };
      if (FileStore.connected && FileStore.dirHandle) opts.startIn = FileStore.dirHandle;
      const [handle] = await window.showOpenFilePicker(opts);
      const file = await handle.getFile();
      await restoreFlow(file);
    } catch (e) {
      if (e && e.name === 'AbortError') return;   // person cancelled the picker
      pickRestoreLegacy();
    }
    return;
  }
  pickRestoreLegacy();
}

function pickRestoreLegacy() {
  const input = h('input', { type: 'file', accept: '.zip,.json', class: 'hidden', onchange: async e => { const f = e.target.files[0]; input.remove(); if (f) await restoreFlow(f); } });
  document.body.appendChild(input);
  input.click();
}

async function restoreFlow(file) {
  let payload = null, manifest = null;
  try {
    if (/\.json$/i.test(file.name)) {
      const j = JSON.parse(await file.text());
      if (j.questions && Array.isArray(j.questions)) {
        await modal({ title: 'That looks like an import file', body: h('p', {}, 'This JSON is a question list rather than a backup package. Use Add Questions for it — that way it goes through duplicate detection and reconciliation.') });
        return;
      }
      payload = j.data || j; manifest = j.manifest || { schemaVersion: j.schemaVersion || 0 };
    } else {
      const zip = await unzip(await file.arrayBuffer());
      manifest = JSON.parse(await zip.text('manifest.json') || '{}');
      payload = {};
      for (const s of BACKUP_STORES) {
        const t = await zip.text('data/' + s + '.json');
        payload[s] = t ? JSON.parse(t) : [];
      }
      // verify checksums
      const bad = [];
      if (manifest.checksums) {
        for (const s of BACKUP_STORES) {
          if (!manifest.checksums[s]) continue;
          const hashNow = await sha256(JSON.stringify(payload[s]));
          if (hashNow !== manifest.checksums[s]) bad.push(s);
        }
      }
      manifest._badChecksums = bad;
    }
  } catch (e) {
    await modal({ title: 'Could not read that backup', body: h('p', { text: e.message }) });
    return;
  }
  if ((manifest.schemaVersion || 0) > APP.schema) {
    await modal({ title: 'Made by a newer version of the app', body: h('p', {}, 'This backup was made by a newer version of MCQ Mastery than the one you have open. Update the app first, or restoring now may not bring everything back correctly.') });
    return;
  }

  // ---- preview
  const existing = {};
  for (const s of BACKUP_STORES) existing[s] = await DB.count(s);
  const incomingQ = payload.questions || [];
  const currentQ = await DB.all('questions');
  const byUuid = new Map(currentQ.map(q => [q.uuid, q]));
  const byQid = new Map(currentQ.filter(q => q.qid).map(q => [q.qid, q]));
  const uuidClash = incomingQ.filter(q => byUuid.has(q.uuid)).length;
  const qidClash = incomingQ.filter(q => q.qid && byQid.has(q.qid) && byUuid.get(q.uuid) === undefined).length;

  const tb = h('tbody');
  BACKUP_STORES.forEach(s => tb.appendChild(h('tr', {}, [
    h('td', { class: 'small', text: s }),
    h('td', { class: 'num right', text: String(existing[s]) }),
    h('td', { class: 'num right', text: String((payload[s] || []).length) })
  ])));

  const mode = await modal({
    title: 'Restore preview', wide: true, sticky: true,
    body: h('div', { class: 'stack' }, [
      h('div', { class: 'notice' }, 'Backup made ' + fmtDate(manifest.createdAt, true) + ' · covers ' + (manifest.scope === 'course' ? 'this course only' : 'everything')),
      manifest._badChecksums && manifest._badChecksums.length ? h('div', { class: 'notice bad' }, 'Part of this backup looks damaged or edited (' + manifest._badChecksums.join(', ') + '). Restoring it is not recommended.') : h('div', { class: 'notice ok' }, 'This backup checks out — nothing looks damaged or edited.'),
      uuidClash || qidClash ? h('div', { class: 'notice warn' }, [
        h('b', { text: 'Some records already exist here' }),
        h('div', { class: 'small' }, uuidClash + ' question(s) in the backup are the same question as one already here — on merge, the backup’s version replaces what’s here for those. ' +
          qidClash + ' question(s) reuse a Question ID that already belongs to a different question here — on merge, those get a new Question ID and the old one is kept as an alias, so no ID is ever reassigned.')
      ]) : null,
      h('div', { class: 'tbl-wrap' }, h('table', {}, [h('thead', {}, h('tr', {}, [h('th', { text: 'Store' }), h('th', { class: 'right', text: 'Here now' }), h('th', { class: 'right', text: 'In backup' })])), tb]))
    ]),
    actions: [
      { label: 'Cancel', value: null },
      { label: 'Merge into existing', value: 'merge' },
      { label: 'Replace everything', value: 'replace', kind: 'danger' }
    ]
  });
  if (!mode) return;

  if (mode === 'replace') {
    const ok = await confirmBox('Replace all local data?',
      'Every question, attempt and session in this browser will be deleted and replaced by the backup. A verified safety backup of the current state is taken first, and the restore is abandoned if that backup cannot be made.', true, 'Replace');
    if (!ok) return;
    if (!await requireSafetyBackup('restore (replace) from ' + file.name)) { toast('Restore cancelled — nothing was changed', 'ok'); return; }
    // Replacing the bank is a deliberate shrink; whichever backend is
    // actually connected must allow it, or the very next write gets
    // silently refused forever — a smaller, legitimate, just-confirmed
    // restore would otherwise permanently stall syncing to Drive.
    FileStore.allowShrink('restore (replace)');
    if (typeof DriveSync !== 'undefined') DriveSync.allowDriveShrink('restore (replace) from ' + file.name);
  } else if (mode === 'merge') {
    // Merge still overwrites any record that shares a UUID with the backup,
    // so it needs the same safety net replace gets — just no shrink-guard,
    // since a merge only ever adds or updates rows, never clears a store.
    if (!await requireSafetyBackup('restore (merge) from ' + file.name)) { toast('Restore cancelled — nothing was changed', 'ok'); return; }
  }

  const report = { added: 0, updated: 0, reIded: 0, skipped: 0, stores: {} };
  const APPEND_ONLY_STORES = ['attempts', 'questionVersions', 'audit'];
  try {
    if (mode === 'replace') for (const s of BACKUP_STORES) await DB.clear(s);
    for (const s of BACKUP_STORES) {
      const rows = payload[s] || [];
      if (s === 'questions') continue;
      if (mode === 'merge' && s === 'settings') { report.stores[s] = 0; continue; }
      if (mode === 'merge' && APPEND_ONLY_STORES.indexOf(s) >= 0) {
        // A raw DB.putMany() here would write every incoming row back under
        // its original auto-increment key — on merge, that key comes from
        // a different IndexedDB entirely and can collide with an unrelated
        // local row that happens to share the same number. Same class of
        // bug the connect/switch merge engine was built to avoid; reuse it.
        const r = mergeAppendOnlyRows(s, await DB.all(s), rows);
        await DB.putMany(s, r.rows);
        report.stores[s] = r.added;
        continue;
      }
      if (mode === 'merge' && s === 'idRegister') {
        // Never "whichever side's backup happened to have" for this one —
        // overwriting it could roll the Question ID watermark backwards
        // and let an id already used since the backup be issued again.
        const r = mergeIdRegisterRows(await DB.all(s), rows);
        await DB.putMany(s, r.rows);
        report.stores[s] = r.rows.length;
        continue;
      }
      await DB.putMany(s, rows);
      report.stores[s] = rows.length;
    }
    // questions last, with identifier protection
    const freshCurrent = mode === 'replace' ? [] : await DB.all('questions');
    const curUuid = new Map(freshCurrent.map(q => [q.uuid, q]));
    const curQid = new Map(freshCurrent.filter(q => q.qid).map(q => [q.qid, q]));
    const maxSeqByCourse = new Map();
    const out = [];
    for (const q of incomingQ) {
      const clashUuid = curUuid.get(q.uuid);
      if (clashUuid) { out.push(Object.assign({}, clashUuid, q)); report.updated++; }
      else if (q.qid && curQid.has(q.qid)) {
        const ids = await IdRegister.next(q.courseId, 1, { note: 'restore collision for ' + q.qid });
        const old = q.qid;
        q.aliasQids = Array.from(new Set((q.aliasQids || []).concat([old])));
        q.qid = ids[0];
        out.push(q); report.reIded++;
        await audit('restore', 'question', q.qid, { qid: old }, { qid: q.qid }, 'Question ID collision on restore — new ID issued, old ID kept as alias');
      } else { out.push(q); report.added++; }
      const seq = IdRegister.seqOf(q.qid);
      if (seq > (maxSeqByCourse.get(q.courseId) || 0)) maxSeqByCourse.set(q.courseId, seq);
    }
    await DB.putMany('questions', out);
    for (const [cid, seq] of maxSeqByCourse) await IdRegister.reserveUpTo(cid, seq);
    report.stores.questions = out.length;
    await audit('restore', 'system', '', null, report, mode);
  } catch (e) {
    await modal({ title: 'Restore failed part way', body: h('p', {}, e.message + ' — reload the app and check the Question Bank before continuing. If a safety backup was taken, it is in your downloads folder.') });
    return;
  }

  State.courses = await DB.all('courses');
  if (!State.courses.length) State.courses = await ensureSeedCourse();
  await Settings.load();
  const wanted = Settings.get('activeCourseId');
  State.course = State.courses.find(c => c.id === wanted) || State.courses[0];
  State.invalidate();

  const issues = await integrityChecks();
  await modal({
    title: 'Restore complete', wide: true,
    body: h('div', { class: 'stack' }, [
      h('div', { class: 'notice ok' }, report.added + ' added · ' + report.updated + ' updated in place · ' + report.reIded + ' given a new Question ID after a collision'),
      h('div', { class: 'small muted' }, 'Records written: ' + Object.keys(report.stores).map(k => k + ' ' + report.stores[k]).join(' · ')),
      h('div', { class: 'notice ' + (issues.length ? 'warn' : 'ok') }, issues.length ? 'Integrity check found ' + issues.length + ' issue type(s) — open the report from Backup & Restore.' : 'Integrity check passed.')
    ])
  });
  renderShell();
  go('dashboard');
}

/* ---------- integrity ---------- */
async function integrityChecks() {
  const all = await DB.all('questions');
  const sources = await DB.all('sources');
  const images = await DB.all('images');
  const attempts = await DB.all('attempts');
  const srcIds = new Set(sources.map(s => s.id));
  const imgIds = new Set(images.map(i => i.id));
  const qUuids = new Set(all.map(q => q.uuid));
  const issues = [];
  const push = (key, label, items, fix) => { if (items.length) issues.push({ key, label, items, fix }); };

  const seenQid = new Map(), dupQid = [];
  all.forEach(q => { if (!q.qid) return; if (seenQid.has(q.qid)) dupQid.push(q); else seenQid.set(q.qid, q); });
  push('dupQid', 'Two questions share the same Question ID', dupQid.map(q => q.qid + ' (' + q.uuid.slice(0, 8) + ')'), 'Open one of them from Question detail and give it a new ID.');
  push('noAnswer', 'Missing correct answer', all.filter(q => !q.correctOptionId && q.status !== 'rejected' && q.status !== 'merged').map(q => q.qid || q.uuid.slice(0, 8)), 'Set the answer on the Needs Checking screen.');
  push('badAnswer', 'The marked correct answer no longer matches any option', all.filter(q => q.correctOptionId && !q.options.some(o => o.id === q.correctOptionId)).map(q => q.qid), 'Reopen the question and pick the correct option again.');
  push('fewOptions', 'Fewer than two options', all.filter(q => (q.options || []).length < 2 && q.status !== 'rejected').map(q => q.qid || q.uuid.slice(0, 8)), 'Complete the options or reject the record.');
  push('activeUnverified', 'Marked Active but the answer isn’t verified', all.filter(q => q.status === 'active' && q.answerVerified !== 'verified').map(q => q.qid), 'These are already blocked from practice; verify the answer or move them to review.');
  push('orphanSource', 'Linked to a source that no longer exists', all.filter(q => q.sourceId && !srcIds.has(q.sourceId)).map(q => q.qid), 'Re-link it to a source, or clear the link.');
  push('orphanAttempt', 'Practice history for a question that no longer exists', attempts.filter(a => !qUuids.has(a.questionUuid)).map(a => a.qid || a.questionUuid.slice(0, 8)), 'Harmless but untidy — usually left by a partial restore.');
  push('brokenImage', 'Linked to a photo that’s gone', all.filter(q => q.imageId && !imgIds.has(q.imageId)).map(q => q.qid), 'The photo is gone — clear the link, or add it again.');
  const uuidSeen = new Set(), dupUuid = [];
  all.forEach(q => { if (uuidSeen.has(q.uuid)) dupUuid.push(q.uuid); uuidSeen.add(q.uuid); });
  push('dupUuid', 'Two records share the same internal identity', dupUuid, 'This should not normally happen. The safest next step is restoring from a recent backup (Backup & Restore).');
  const validDomains = new Set();
  (await DB.all('courses')).forEach(c => (c.blueprint || []).forEach(d => validDomains.add(c.id + '|' + d.id)));
  push('badDomain', 'Filed under a domain that no longer exists in this course', all.filter(q => q.domainId && !validDomains.has(q.courseId + '|' + q.domainId)).map(q => q.qid + ' → ' + q.domainId), 'Reopen it and pick a domain that still exists in the blueprint.');
  push('mergedNoCanon', 'Marked merged, but the record it merged into is gone', all.filter(q => q.status === 'merged' && !q.canonicalUuid).map(q => q.qid), 'Open it from Question detail and use Unmerge.');
  return issues;
}

async function runIntegrity() {
  toast('Running integrity check…');
  const issues = await integrityChecks();
  const body = h('div', { class: 'stack' });
  if (!issues.length) body.appendChild(h('div', { class: 'notice ok' }, 'All checks passed. No duplicate IDs, missing answers, orphaned references or invalid classifications.'));
  issues.forEach(i => {
    body.appendChild(h('div', { class: 'notice warn' }, [
      h('div', { class: 'row' }, [h('b', { text: i.label }), h('span', { class: 'badge b-review', text: String(i.items.length) })]),
      h('div', { class: 'small', style: 'margin-top:4px', text: i.fix }),
      h('div', { class: 'srcline', style: 'margin-top:4px', text: i.items.slice(0, 25).join(', ') + (i.items.length > 25 ? ' …' : '') })
    ]));
  });
  await audit('integrity', 'system', '', null, { issueTypes: issues.length }, '');
  await modal({
    title: 'Integrity check', wide: true, body,
    actions: [{ label: 'Close', value: null }, {
      label: 'Export report', value: 'x', before: () => {
        const rows = [['Check', 'Count', 'Recommended action', 'Records']];
        issues.forEach(i => rows.push([i.label, i.items.length, i.fix, i.items.join(' ')]));
        if (!issues.length) rows.push(['All checks passed', 0, '', '']);
        download('integrity-check-' + todayKey() + '.csv', new Blob([toCSV(rows)], { type: 'text/csv' }));
        return false;
      }
    }]
  });
}

async function courseDialog(course) {
  const isNew = !course;
  const code = h('input', { type: 'text', value: course ? course.code : '', placeholder: 'DISA' });
  const name = h('input', { type: 'text', value: course ? course.name : '', placeholder: 'Diploma in Information Systems Audit' });
  const prefix = h('input', { type: 'text', value: course ? course.qidPrefix : '', placeholder: 'DISA' });
  const rows = h('div', { class: 'stack' });
  let bp = course ? course.blueprint.map(d => Object.assign({}, d)) : [{ id: 'D1', name: '', weight: 100 }];
  const totalEl = h('span', { class: 'docnum' });
  const drawRows = () => {
    rows.textContent = '';
    bp.forEach((d, i) => {
      rows.appendChild(h('div', { class: 'row', style: 'gap:6px' }, [
        h('input', { type: 'text', style: 'width:70px', value: d.id, oninput: e => d.id = e.target.value.trim().toUpperCase() }),
        h('input', { type: 'text', value: d.name, placeholder: 'Domain name', oninput: e => d.name = e.target.value }),
        h('input', { type: 'number', style: 'width:80px', min: '0', max: '100', value: String(d.weight), oninput: e => { d.weight = +e.target.value || 0; total(); } }),
        h('button', { class: 'btn sm ghost', onclick: () => { bp.splice(i, 1); drawRows(); total(); }, text: '✕' })
      ]));
    });
    rows.appendChild(h('button', { class: 'btn sm', onclick: () => { bp.push({ id: 'D' + (bp.length + 1), name: '', weight: 0 }); drawRows(); }, text: '+ Add domain' }));
  };
  const total = () => { const t = bp.reduce((s, d) => s + (+d.weight || 0), 0); totalEl.textContent = t + '%'; totalEl.style.color = t === 100 ? 'var(--green)' : 'var(--amber)'; };
  drawRows(); total();

  const res = await modal({
    title: isNew ? 'Add a course' : 'Edit ' + course.code, wide: true, sticky: true,
    body: h('div', { class: 'stack' }, [
      h('div', { class: 'grid g3' }, [
        h('div', { class: 'field' }, [h('label', { text: 'Short code' }), code]),
        h('div', { class: 'field' }, [h('label', { text: 'Full name' }), name]),
        h('div', { class: 'field' }, [h('label', { text: 'Question ID prefix' }), prefix, h('div', { class: 'tiny dim', text: isNew ? 'Becomes e.g. DISA-Q-000001' : 'Changing this does not alter IDs already issued.' })])
      ]),
      h('div', { class: 'field' }, [h('label', {}, ['Blueprint — domain code, name, exam weight  ', totalEl]), rows]),
      h('div', { class: 'notice small' }, 'Weights drive mock and mixed-revision selection. They need not total 100 — the selection is proportional either way — but a 100% total is easier to reason about.')
    ]),
    actions: [
      { label: 'Cancel', value: null },
      !isNew && !course.isSeed ? { label: course.archived ? 'Unarchive' : 'Archive', value: 'arch' } : null,
      { label: isNew ? 'Create course' : 'Save', value: 'save', kind: 'primary' }
    ].filter(Boolean)
  });
  if (!res) return;
  if (res === 'arch') {
    course.archived = !course.archived;
    await DB.put('courses', course);
    State.courses = await DB.all('courses');
    if (State.course.id === course.id && course.archived) await State.setCourse((State.courses.find(c => !c.archived) || State.courses[0]).id);
    renderShell(); go('settings'); return;
  }
  if (!code.value.trim() || !name.value.trim()) { toast('A course needs a code and a name', 'bad'); return; }
  bp = bp.filter(d => d.id && d.name.trim());
  if (!bp.length) { toast('Add at least one domain', 'bad'); return; }
  if (isNew) {
    const c = makeCourse(code.value.trim(), name.value.trim(), bp, { qidPrefix: (prefix.value.trim() || code.value.trim()).toUpperCase().replace(/[^A-Z0-9]/g, '') });
    await DB.put('courses', c);
    await DB.put('idRegister', { courseId: c.id, lastSeq: 0, allocations: [] });
    await audit('create', 'course', c.id, null, { code: c.code, domains: bp.length }, '');
    State.courses = await DB.all('courses');
    await State.setCourse(c.id);
    toast(c.code + ' created — its bank starts empty', 'ok');
  } else {
    const prev = { code: course.code, blueprint: course.blueprint };
    course.code = code.value.trim(); course.name = name.value.trim();
    course.qidPrefix = (prefix.value.trim() || course.code).toUpperCase().replace(/[^A-Z0-9]/g, '');
    course.blueprint = bp;
    await DB.put('courses', course);
    await audit('edit', 'course', course.id, prev, { code: course.code, blueprint: bp }, '');
    State.courses = await DB.all('courses');
    State.course = State.courses.find(c => c.id === course.id);
    toast('Course updated', 'ok');
  }
  renderShell(); go('settings');
}

async function recomputeAll() {
  const all = await State.questions();
  let n = 0;
  for (const q of all) {
    const hist = await DB.byIndex('attempts', 'questionUuid', q.uuid);
    q.stats.mastery = masteryOf(q, hist).score;
    await recomputeFingerprint(q);
    await DB.put('questions', q);
    n++;
  }
  State.invalidate();
  toast('Recomputed ' + n + ' record(s)', 'ok');
}

async function wipeCourse() {
  const all = await State.questions();
  const ok = await confirmBox('Delete every question in ' + State.course.code + '?',
    all.length + ' question(s), together with their attempts and sessions, will be permanently deleted. A safety backup of everything is taken first, automatically, before anything is removed. Retired Question IDs are recorded as tombstones and will never be reissued.', true);
  if (!ok) return;
  const again = await modal({
    title: 'Type the course code to confirm',
    body: h('div', { class: 'field' }, [h('label', { text: 'Course code' }), h('input', { type: 'text', id: 'wipeCode', placeholder: State.course.code })]),
    actions: [{ label: 'Cancel', value: false }, { label: 'Delete permanently', value: true, kind: 'danger' }]
  });
  if (!again) return;
  const typed = ($('#wipeCode') || {}).value;
  if (typed !== State.course.code) { toast('Code did not match — nothing was deleted', 'warn'); return; }

  // Nothing is removed until a backup exists.
  if (!await requireSafetyBackup('wipe course ' + State.course.code)) { toast('Nothing was deleted', 'ok'); return; }

  // The bank is about to shrink on purpose, so the file layer must not
  // mistake it for the catastrophic-loss case it normally refuses to write.
  FileStore.allowShrink('course wipe: ' + State.course.code);

  for (const q of all) {
    if (q.qid) await DB.put('tombstones', { qid: q.qid, uuid: q.uuid, retiredAt: nowISO(), reason: 'course wipe' });
    await DB.del('questions', q.uuid);
  }
  for (const a of await DB.byIndex('attempts', 'courseId', State.course.id)) await DB.del('attempts', a.id);
  for (const s of await DB.byIndex('sessions', 'courseId', State.course.id)) await DB.del('sessions', s.id);
  await audit('delete', 'course-data', State.course.id, { questions: all.length }, null, 'Course questions deleted after a safety backup; IDs tombstoned');
  State.invalidate();
  if (FileStore.connected) await FileStore.flushNow('snapshot');
  toast('Deleted ' + all.length + ' question(s). Your safety backup is saved.', 'ok');
  go('dashboard');
}


/* ============================================================================
   17 · File-backed store — your question bank as a real file on your disk.

   The design, borrowed from a pattern that works well in practice:

     • The JSON file in the folder YOU pick is the source of truth.
     • IndexedDB is the working copy — it is what makes filtering and
       practice fast, and it is rebuilt from the file on every launch.
     • IndexedDB additionally holds the folder handle, so you pick the
       folder once rather than every session.

   The point is that your bank stops being trapped in one browser profile.
   It becomes a file you can back up, sync, copy to another machine, or
   open on a different browser.

   States:
     manual      This browser has no File System Access API (Firefox,
                 Safari). Works exactly as before, entirely in IndexedDB.
     local-only  The API exists but no folder has ever been connected.
                 Fully editable, with a standing offer to connect one.
     connected   Every change is mirrored to your file.
     read-only   A folder WAS connected and is now unreachable — moved,
                 renamed, or permission withdrawn. Writing is blocked.

   That last state is the one that matters. Carrying on writing into
   IndexedDB while you believe you are writing to your file is precisely
   how an evening's work disappears.
   ========================================================================== */

const DATA_FILE = 'mcq-mastery-data.json';
const JOURNAL_FILE = 'mcq-mastery-journal.jsonl';
/** One generation of rollback, written before each snapshot replaces the main file. */
const BACKUP_FILE = 'mcq-mastery-data.previous.json';
/** Compact into a fresh snapshot once the journal passes this size. */
const JOURNAL_MAX_BYTES = 400 * 1024;
/** Take a snapshot at least this often while you are working. */
const SNAPSHOT_MAX_AGE_MS = 10 * 60 * 1000;
/** More records than this in one go, and a snapshot is cheaper than journalling. */
const BULK_JOURNAL_LIMIT = 40;

/** Everything except fsmeta, which holds the handle and must never be exported. */
function syncStores() { return Object.keys(STORES).filter(n => n !== 'fsmeta'); }

const FileStore = {
  tier: 'manual',
  dirHandle: null,
  fileHandle: null,
  connected: false,
  needsReconnect: false,
  everConnected: false,
  locationName: '',
  lastSavedAt: null,
  lastSnapshotAt: null,
  needSnapshot: false,
  dirty: false,
  _timer: null,
  _writing: false,
  _again: false,
  _dirtyStores: new Set(),
  _cache: null,
  _journal: [],
  _journalBytes: 0,
  _lastQuestionCount: 0,
  _diskQuestionCount: 0,   // what the file on disk actually holds
  _lastGoodText: null,     // previous verified snapshot, kept for rollback
  _lastSize: 0,            // bytes of the last snapshot, drives the cadence
  _shrinkOk: null,         // one-shot consent for a deliberate reduction
  _stamp: null,          // size + lastModified of the file as we last wrote it
  _journalStamp: null,   // size of the journal file as we last wrote it — detects another tab appending to it
  _watching: false,
  _watchTimer: null,
  _recovering: false,
  problem: null,         // null | 'missing' | 'changed' | 'noaccess'

  capability() {
    if (typeof window === 'undefined') return 'manual';
    if ('showDirectoryPicker' in window) return 'folder';
    if ('showSaveFilePicker' in window) return 'file';
    return 'manual';
  },

  /** True when the app may write. False only in the dangerous case. */
  canEdit() {
    if (this.tier === 'manual') return true;
    if (!this.everConnected) return true;   // local-only, never connected
    return this.connected;
  },
  isReadOnly() { return !this.canEdit(); },

  handle() { return this.dirHandle || this.fileHandle; },

  async perm(handle, request) {
    if (!handle) return 'denied';
    const opts = { mode: 'readwrite' };
    try {
      let p = await handle.queryPermission(opts);
      if (p === 'granted') return p;
      if (request) p = await handle.requestPermission(opts);
      return p;
    } catch (e) { return 'denied'; }
  },

  async meta(k) { try { const r = await DB.get('fsmeta', k); return r ? r.v : undefined; } catch (e) { return undefined; } },
  async setMeta(k, v) { try { await DB.putRaw('fsmeta', { k, v }); } catch (e) { /* handle storage is best-effort */ } },
  async delMeta(k) { try { await DB.delRaw('fsmeta', k); } catch (e) { } },

  /** Restore a remembered handle, without prompting. */
  async init() {
    this.tier = this.capability();
    if (this.tier === 'manual') return;
    this.everConnected = !!(await this.meta('everConnected'));
    const dir = await this.meta('dirHandle');
    const file = await this.meta('fileHandle');
    const h = dir || file;
    if (!h) return;
    if (dir) this.dirHandle = dir; else this.fileHandle = file;
    this.locationName = h.name || '';
    const p = await this.perm(h, false);
    if (p === 'granted') this.connected = true;
    else if (p === 'prompt') this.needsReconnect = true;
    else await this.forget();
  },

  /* ---------- connecting (all require a user gesture) ---------- */

  async connectFolder() {
    const dir = await window.showDirectoryPicker({ mode: 'readwrite', id: 'mcqMastery', startIn: 'documents' });
    if (await this.perm(dir, true) !== 'granted') throw new Error('Permission was not granted for that folder.');
    this.dirHandle = dir; this.fileHandle = null;
    this.locationName = dir.name;
    this.connected = true; this.needsReconnect = false; this.everConnected = true;
    await this.setMeta('dirHandle', dir); await this.delMeta('fileHandle');
    await this.setMeta('everConnected', true);
    return dir;
  },

  async connectFile() {
    const fh = await window.showSaveFilePicker({
      suggestedName: DATA_FILE,
      types: [{ description: 'MCQ Mastery data', accept: { 'application/json': ['.json'] } }]
    });
    if (await this.perm(fh, true) !== 'granted') throw new Error('Permission was not granted for that file.');
    this.fileHandle = fh; this.dirHandle = null;
    this.locationName = fh.name;
    this.connected = true; this.needsReconnect = false; this.everConnected = true;
    await this.setMeta('fileHandle', fh); await this.delMeta('dirHandle');
    await this.setMeta('everConnected', true);
    return fh;
  },

  async reconnect() {
    const h = this.handle();
    if (!h) return false;
    const p = await this.perm(h, true);
    if (p !== 'granted') return false;
    this.connected = true; this.needsReconnect = false;
    return true;
  },

  async forget() {
    if (this._timer) { clearTimeout(this._timer); this._timer = null; }
    this.dirHandle = null; this.fileHandle = null;
    this.connected = false; this.needsReconnect = false; this.locationName = '';
    this._journalStamp = null;
    await this.delMeta('dirHandle'); await this.delMeta('fileHandle');
    await this.delMeta('everConnected');
    this.everConnected = false;
  },

  /* ---------- reading ---------- */

  async fileHandleFor(create) {
    if (this.dirHandle) return await this.dirHandle.getFileHandle(DATA_FILE, { create: !!create });
    if (this.fileHandle) return this.fileHandle;
    return null;
  },

  /**
   * Read the file and rebuild IndexedDB from it.
   * Returns 'loaded' | 'empty' | 'missing'.
   */
  async loadFromDisk() {
    let fh;
    try { fh = await this.fileHandleFor(false); }
    catch (e) { if (e && e.name === 'NotFoundError') return 'missing'; throw e; }
    if (!fh) return 'missing';
    const file = await fh.getFile();
    if (!file.size) return 'empty';
    const text = await file.text();
    this._lastGoodText = text;
    this._lastSize = text.length;
    let payload;
    try { payload = JSON.parse(text); }
    catch (e) { throw new Error('Your data file is not valid JSON. It may have been edited or truncated. Restore a backup, or move the file aside and reconnect to start a fresh one.'); }
    if (!payload || !payload.stores) throw new Error('That file is not an MCQ Mastery data file.');
    if ((payload.schema || 1) > APP.schema) throw new Error('That file was written by a newer version of the app. Update the app before opening it.');

    const names = syncStores();
    for (const s of names) {
      const rows = Array.isArray(payload.stores[s]) ? payload.stores[s] : [];
      await DB.clearRaw(s);
      if (rows.length) await DB.putManyRaw(s, rows);
    }
    this.lastSavedAt = payload.savedAt || null;
    this.lastSnapshotAt = payload.savedAt || null;
    this._lastQuestionCount = (payload.stores.questions || []).length;
    this._diskQuestionCount = this._lastQuestionCount;
    this._shrinkOk = null;
    await this.stampFile();
    this.problem = null;
    this._cache = null;
    this.dirty = false;
    this.needSnapshot = false;
    this._journal = [];
    this._journalBytes = 0;

    // Everything answered since that snapshot lives in the journal.
    const replayed = await this.replayJournal();
    if (replayed > 0) {
      // Fold the journal into a clean snapshot so it never grows forever.
      this.needSnapshot = true;
      this.dirty = true;
      await this.flushNow('snapshot');
    }
    return 'loaded';
  },

  /**
   * Apply journalled changes recorded after the last snapshot.
   * A truncated final line is expected — the tab may have been closed
   * mid-write — so a line that will not parse ends the replay rather than
   * failing it.
   */
  async replayJournal() {
    if (!this.dirHandle) return 0;
    let jh;
    try { jh = await this.dirHandle.getFileHandle(JOURNAL_FILE, { create: false }); }
    catch (e) { return 0; }
    const file = await jh.getFile();
    if (!file.size) return 0;
    const text = await file.text();
    const lines = text.split('\n');
    let applied = 0;
    for (const line of lines) {
      const t = line.trim();
      if (!t) continue;
      let e;
      try { e = JSON.parse(t); } catch (err) { break; }
      if (!e || !e.s || !STORES[e.s] || e.s === 'fsmeta') continue;
      try {
        if (e.o === 'p' && e.v) { await DB.putRaw(e.s, e.v); applied++; }
        else if (e.o === 'd') { await DB.delRaw(e.s, e.k); applied++; }
      } catch (err) { /* one bad entry must not lose the rest */ }
    }
    return applied;
  },

  /* ---------- writing ---------- */

  /** Called by the DAL after any successful write. */
  touch(store, op, payload, key) {
    if (!this.connected) return;
    if (store === 'fsmeta') return;
    this._dirtyStores.add(store);
    this.dirty = true;

    // Decide whether this change can be journalled cheaply, or whether it
    // is broad enough that a fresh snapshot is simpler and safer.
    if (!this.canJournal()) {
      this.needSnapshot = true;
    } else if (op === 'c') {
      this.needSnapshot = true;                       // a cleared store
    } else if (op === 'm') {
      const n = (payload && payload.length) || 0;
      // A bulk import rewrites so much that journalling it is pointless, and
      // an auto-increment store hands out its keys inside IndexedDB, which a
      // bulk journal entry cannot capture reliably.
      if (n > BULK_JOURNAL_LIMIT || STORES[store].auto) this.needSnapshot = true;
      else payload.forEach(v => this._journal.push({ o: 'p', s: store, v: v }));
    } else if (op === 'd') {
      this._journal.push({ o: 'd', s: store, k: payload });
    } else if (op === 'p') {
      let v = payload;
      const kp = STORES[store].keyPath;
      // Carry the key IndexedDB generated, or replay would insert a copy.
      if (STORES[store].auto && kp && v && v[kp] == null && key != null) {
        v = Object.assign({}, v); v[kp] = key;
      }
      this._journal.push({ o: 'p', s: store, v: v });
    }

    if (this._timer) clearTimeout(this._timer);
    this._timer = setTimeout(() => { this._timer = null; this.flush(); }, this.needSnapshot ? 1200 : 700);
    updateStorageBar();
  },

  /** Journalling needs a folder; a single chosen file has nowhere to put it. */
  canJournal() { return !!this.dirHandle; },

  /** Record what the file looked like immediately after we wrote it. */
  async stampFile() {
    try {
      const fh = await this.fileHandleFor(false);
      if (!fh) { this._stamp = null; return; }
      const f = await fh.getFile();
      this._stamp = { size: f.size, lastModified: f.lastModified };
    } catch (e) { this._stamp = null; }
  },

  /**
   * Is the file still the one we think we are writing to?
   *
   * Without this, deleting the file in Explorer goes unnoticed: the next
   * write just creates it again, so the app keeps reporting that it is
   * saving while the folder sits empty. Worse, if the file were replaced
   * from elsewhere — a backup, a sync client, another machine — the app
   * would overwrite it without ever mentioning it.
   *
   * Returns 'ok' | 'missing' | 'changed' | 'noaccess'.
   */
  async verifyFile() {
    if (!this.connected) return 'noaccess';
    // Nothing written yet, so there is nothing to compare against and
    // creating the file is exactly what should happen.
    if (!this._stamp) return 'ok';
    let fh;
    try { fh = await this.fileHandleFor(false); }
    catch (e) {
      if (e && e.name === 'NotFoundError') return 'missing';
      if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) return 'noaccess';
      return 'noaccess';
    }
    if (!fh) return 'missing';
    let f;
    try { f = await fh.getFile(); }
    catch (e) { return e && e.name === 'NotFoundError' ? 'missing' : 'noaccess'; }

    if (f.size === this._stamp.size && f.lastModified === this._stamp.lastModified) return 'ok';

    // The metadata moved. That alone is not proof of an edit — a sync client
    // can rewrite identical bytes — so check what the file actually says
    // before crying conflict.
    try {
      const payload = JSON.parse(await f.text());
      if (payload && payload.savedAt && this.lastSnapshotAt && payload.savedAt === this.lastSnapshotAt) {
        this._stamp = { size: f.size, lastModified: f.lastModified };   // same content, new metadata
        return 'ok';
      }
    } catch (e) { /* unreadable counts as changed */ }
    return 'changed';
  },

  /** Cheap poll plus the moments a person is most likely to have meddled. */
  startWatch() {
    if (this._watching) return;
    this._watching = true;
    this._watchTimer = setInterval(() => this.checkNow(), 30000);
    window.addEventListener('focus', () => this.checkNow());
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') this.checkNow();
    });
  },

  async checkNow() {
    if (!this.connected || this._writing || this._recovering) return;
    const v = await this.verifyFile();
    if (v !== 'ok') await this.onProblem(v);
  },

  /** Stop writing, say so plainly, and offer a way out. */
  async onProblem(kind) {
    if (this._recovering) return;
    this.connected = false;
    this.needsReconnect = true;
    this.problem = kind;
    if (kind === 'missing') toast('Your data file is no longer in that folder. The app is now read-only.', 'bad', 10000);
    else if (kind === 'changed') toast('Your data file was changed outside the app. The app is now read-only so it cannot overwrite it.', 'bad', 10000);
    else toast('Lost access to your data file. The app is now read-only.', 'bad', 10000);
    updateStorageBar();
    setTimeout(() => recoveryFlow(kind), 0);
  },

  async buildPayload() {
    if (!this._cache) { this._cache = {}; this._dirtyStores = new Set(syncStores()); }
    for (const s of this._dirtyStores) this._cache[s] = await DB.all(s);
    this._dirtyStores.clear();
    return { app: 'mcq-mastery', schema: APP.schema, savedAt: nowISO(), stores: this._cache };
  },

  /**
   * Write policy. A snapshot rewrites the whole bank; a journal append is a
   * few kilobytes. During practice we append, and take a snapshot only when
   * there is a real reason to.
   *
   * The time-based interval scales with the file, because a snapshot costs
   * roughly in proportion to its size. A small bank can afford one every ten
   * minutes; a thirty-megabyte one should not be rewritten that often when
   * the journal already holds everything since the last write.
   */
  snapshotInterval() {
    const mb = (this._lastSize || 0) / 1048576;
    if (mb < 4) return SNAPSHOT_MAX_AGE_MS;            // 10 minutes
    if (mb < 15) return SNAPSHOT_MAX_AGE_MS * 3;       // 30 minutes
    return SNAPSHOT_MAX_AGE_MS * 6;                    // 1 hour
  },

  snapshotDue() {
    if (this.needSnapshot) return true;
    if (!this.canJournal()) return true;
    if (this._journalBytes > JOURNAL_MAX_BYTES) return true;
    if (!this.lastSnapshotAt) return true;
    if (Date.now() - new Date(this.lastSnapshotAt).getTime() > this.snapshotInterval()) return true;
    return false;
  },

  async flush(force) {
    if (!this.connected) return false;
    if (!this.dirty && !force) return false;
    if (this._writing) { this._again = true; return false; }
    this._writing = true;
    try {
      // Never write blind. If the file has gone or been changed underneath
      // us, writing would either silently recreate it or destroy someone
      // else's version.
      const v = await this.verifyFile();
      if (v !== 'ok') { await this.onProblem(v); return false; }
      if (this.snapshotDue() || force === 'snapshot') return await this._writeSnapshot();
      return await this._appendJournal();
    } catch (e) {
      this._cache = null;
      this._onWriteError(e);
      return false;
    } finally {
      this._writing = false;
      if (this._again) { this._again = false; this.flush(); }
    }
  },

  /** Append pending changes. Cheap: proportional to what actually changed. */
  async _appendJournal() {
    if (!this._journal.length) { this.dirty = false; updateStorageBar(); return true; }
    let jh, existing;
    try {
      jh = await this.dirHandle.getFileHandle(JOURNAL_FILE, { create: false });
      existing = await jh.getFile();
    } catch (e) {
      // The journal was deleted, so entries we already wrote there are gone.
      // IndexedDB still holds everything, so a snapshot restores the lot.
      this.needSnapshot = true;
      return await this._writeSnapshot();
    }
    // The journal has no stamp of its own the way the data file does — this
    // tab's own last-known size is the only signal that another tab (or
    // process) hasn't appended here since. Skipping straight to a position
    // read fresh from disk, with no check, is exactly how two tabs writing
    // around the same moment could silently overwrite each other's just-
    // appended answers: both would read the same size before either lands.
    if (this._journalStamp != null && existing.size !== this._journalStamp) {
      this.needSnapshot = true;
      await this.onProblem('changed');
      return false;
    }
    const lines = this._journal.map(e => JSON.stringify(e)).join('\n') + '\n';
    const w = await jh.createWritable({ keepExistingData: true });
    await w.write({ type: 'write', position: existing.size, data: lines });
    await w.close();
    this._journalBytes = existing.size + lines.length;
    this._journalStamp = this._journalBytes;
    this._journal = [];
    this.dirty = false;
    this.lastSavedAt = nowISO();
    updateStorageBar();
    return true;
  },

  /**
   * Mark the next snapshot as an intentional reduction, so the loss guard
   * below does not block a deletion the person explicitly asked for.
   * One-shot: it is consumed by the next snapshot and never lingers.
   */
  allowShrink(reason) {
    this._shrinkOk = reason || true;
  },

  /**
   * The last line of defence. Whatever went wrong upstream — a failed load,
   * a bug, a half-initialised state — the file on disk must never be
   * replaced by dramatically less than it already holds without a deliberate
   * instruction. Returns null to proceed, or a reason to refuse.
   */
  lossCheck(newCount) {
    const onDisk = this._diskQuestionCount || 0;
    if (onDisk === 0) return null;                 // nothing to lose yet
    if (this._shrinkOk) return null;               // a deletion you asked for
    if (newCount === 0) {
      return 'The bank in this browser is empty while your file holds ' + onDisk + ' question(s).';
    }
    if (newCount < onDisk * 0.5) {
      return 'The bank in this browser has ' + newCount + ' question(s) while your file holds ' + onDisk + '.';
    }
    return null;
  },

  /** Rewrite the whole bank, then retire the journal it supersedes. */
  async _writeSnapshot() {
    const payload = await this.buildPayload();
    const qCount = (payload.stores.questions || []).length;

    const refuse = this.lossCheck(qCount);
    if (refuse) {
      this.needSnapshot = true;                    // keep trying once resolved
      await this.onLossRisk(refuse, qCount);
      return false;
    }
    this._shrinkOk = null;                         // consumed

    const text = JSON.stringify(payload);
    if (this.dirHandle) {
      // Resolve the real file FIRST. Only create it when we do not already
      // believe one exists — a file that has been deleted must fail here,
      // loudly, rather than quietly reappear as though nothing happened.
      // Doing this before writing anything else also means a failure leaves
      // no debris in your folder.
      const real = await this.dirHandle.getFileHandle(DATA_FILE, { create: !this._stamp });

      // Keep the previous good version alongside, so there is always one
      // generation to fall back on even if this write turns out wrong.
      if (this._lastGoodText) {
        try {
          const bh = await this.dirHandle.getFileHandle(BACKUP_FILE, { create: true });
          const wb = await bh.createWritable();
          await wb.write(this._lastGoodText); await wb.close();
        } catch (e) { /* a missing rollback copy must not stop the real save */ }
      }

      const w2 = await real.createWritable();
      await w2.write(text); await w2.close();

      // Read it back. A save that cannot be parsed again is not a save.
      const check = await this.verifyWritten(real, qCount);
      if (!check.ok) {
        toast('Your data file did not verify after saving: ' + check.why + ' The previous version is kept as ' + BACKUP_FILE + '.', 'bad', 14000);
        this._stamp = null;
        return false;
      }
      // The snapshot now contains everything the journal described.
      try {
        const jh = await this.dirHandle.getFileHandle(JOURNAL_FILE, { create: true });
        const w3 = await jh.createWritable();
        await w3.write(''); await w3.close();
        this._journalStamp = 0;
      } catch (e) { this._journalStamp = null; }
    } else if (this.fileHandle) {
      const w = await this.fileHandle.createWritable();
      await w.write(text); await w.close();
      const check = await this.verifyWritten(this.fileHandle, qCount);
      if (!check.ok) {
        toast('Your data file did not verify after saving: ' + check.why, 'bad', 14000);
        this._stamp = null;
        return false;
      }
    }

    this._lastGoodText = text;
    this._lastSize = text.length;
    this._diskQuestionCount = qCount;
    this._lastQuestionCount = qCount;

    this._journal = [];
    this._journalBytes = 0;
    this.needSnapshot = false;
    this.dirty = false;
    this.problem = null;
    this.lastSavedAt = payload.savedAt;
    this.lastSnapshotAt = payload.savedAt;
    await this.stampFile();
    updateStorageBar();
    return true;
  },

  _onWriteError(e) {
    if (e && e.name === 'NotFoundError') {
      // The file went while we were mid-write. Same situation as a deletion
      // spotted by the watcher, so use the same recovery.
      this.onProblem('missing');
    } else if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) {
      this.onProblem('noaccess');
    } else {
      toast('Could not save to your file: ' + (e.message || e.name), 'bad', 8000);
      updateStorageBar();
    }
  },

  /** Write immediately, e.g. before the tab closes or a session ends. */
  async flushNow(asSnapshot) {
    if (this._timer) { clearTimeout(this._timer); this._timer = null; }
    return await this.flush(asSnapshot ? 'snapshot' : true);
  },

  /** Read a freshly written file back and confirm it is what we meant. */
  async verifyWritten(handle, expectedCount) {
    try {
      const f = await handle.getFile();
      if (!f.size) return { ok: false, why: 'the file came back empty.' };
      const parsed = JSON.parse(await f.text());
      if (!parsed || !parsed.stores) return { ok: false, why: 'it is missing its contents.' };
      const got = (parsed.stores.questions || []).length;
      if (got !== expectedCount) return { ok: false, why: 'it holds ' + got + ' question(s) instead of ' + expectedCount + '.' };
      this._stamp = { size: f.size, lastModified: f.lastModified };
      return { ok: true };
    } catch (e) {
      return { ok: false, why: 'it could not be read back (' + (e.message || e.name) + ').' };
    }
  },

  /**
   * Refuse the write and explain. The bank is safe in this browser either
   * way; what must not happen is the file quietly losing questions.
   */
  async onLossRisk(reason, newCount) {
    this.connected = false;
    this.needsReconnect = true;
    this.problem = 'loss';
    updateStorageBar();
    toast('Save blocked to protect your data file.', 'bad', 9000);
    setTimeout(async () => {
      if (FileStore._recovering) return;
      FileStore._recovering = true;
      try {
        const choice = await modal({
          title: 'Save blocked to protect your questions',
          body: h('div', { class: 'stack' }, [
            h('div', { class: 'notice bad' }, reason),
            h('p', {}, 'Writing now would remove questions from your file that nothing asked to remove, so the save was refused. Your file is untouched.'),
            h('p', { class: 'small muted' }, 'This usually means something went wrong loading the file at startup. Reloading the page is the safe first move — your file still holds everything.'),
            h('p', { class: 'small muted' }, 'Only continue if you genuinely intended to reduce the bank to ' + newCount + ' question(s).')
          ]),
          actions: [
            { label: 'Leave the file alone', value: '' },
            { label: 'Reload the file from disk', value: 'reload', kind: 'primary' },
            { label: 'I meant this — save anyway', value: 'force', kind: 'danger' }
          ]
        });
        if (choice === 'reload') {
          FileStore.connected = true; FileStore.needsReconnect = false; FileStore.problem = null;
          try { await FileStore.loadFromDisk(); toast('Reloaded from your file. Nothing was lost.', 'ok'); }
          catch (e) { toast('Could not reload: ' + e.message, 'bad', 9000); }
        } else if (choice === 'force') {
          FileStore.connected = true; FileStore.needsReconnect = false; FileStore.problem = null;
          FileStore.allowShrink('confirmed by the user');
          FileStore.needSnapshot = true; FileStore.dirty = true;
          await FileStore.flushNow('snapshot');
        }
      } finally {
        FileStore._recovering = false;
        updateStorageBar();
        if (typeof State !== 'undefined' && State.view) await go(State.view);
      }
    }, 0);
  },

  status() {
    if (this.tier === 'manual') return { key: 'manual', label: 'Local only', tone: 'warn' };
    if (this.connected) return { key: 'connected', label: 'Saving to ' + (this.locationName || 'your file'), tone: 'ok' };
    if (this.problem === 'missing') return { key: 'missing', label: 'Read-only — your data file is gone', tone: 'bad' };
    if (this.problem === 'changed') return { key: 'changed', label: 'Read-only — file changed outside the app', tone: 'bad' };
    if (this.needsReconnect) return { key: 'reconnect', label: 'Read-only — reconnect your file', tone: 'bad' };
    return { key: 'local', label: 'Local only — not saving to a file', tone: 'warn' };
  }
};

const READONLY_MSG = 'The app is read-only because it cannot reach your data file. Reconnect it from the top bar, and nothing will be lost.';

/* Hand the DAL its hooks. fsmeta is exempt from the veto: storing the handle
   is exactly what makes reconnecting possible, so it must work while
   read-only. */
_writeHook = (store, op, payload, key) => {
  // Any question write invalidates cached comparison data.
  if (store === 'questions') bumpSimGen();
  FileStore.touch(store, op, payload, key);
  // Only one backend is ever the active connection, so at most one of these
  // two touch() calls does anything — each bails out immediately when it is
  // not the one currently connected.
  if (typeof DriveSync !== 'undefined') DriveSync.touch(store);
};
_writeVeto = (store) => store !== 'fsmeta' && FileStore.isReadOnly();

/* ============================================================================
   Google Drive sync — a second possible home for your data, alongside the
   local folder above but never AT THE SAME TIME as it: exactly one backend
   is ever the active connection, and connecting one disconnects the other
   (its file is left exactly as it is — only the app's connection to it
   changes). This is what lets the same bank follow you to a phone or a
   different computer, without two backends racing to write over each other.

   Drive's API has no cheap append the way local disk does — every sync is a
   whole-file upload — so writes are debounced (a few seconds after the last
   change, sooner if changes keep coming) rather than journalled instantly
   like the local folder's per-answer journal. It is not truly instant, but
   it is close, and it is a world away from the old "every five minutes"
   timer. A coarse safety-net timer covers the rare case where a debounced
   push gets lost (a backgrounded tab throttling timers).

   Treated as closely as possible like the local file: connecting reads what
   is already there (same "keep this / keep that" choice the local folder
   uses), and every later boot checks whether Drive changed since this
   browser last touched it — via its modifiedTime, a cheap metadata-only
   call — loading the newer copy in automatically, the same way opening the
   app just reads the local file. It only asks when this browser ALSO has
   changes of its own that never made it to Drive (a crash before a
   debounced push fired), because that is a genuine conflict rather than
   routine catching-up.

   OAuth is Google Identity Services' token client: no backend server, no
   client secret (a static page cannot keep one confidential — this is the
   standard, supported way to do OAuth from a browser-only app), no
   long-lived refresh token stored anywhere. It asks the browser for a
   short-lived access token — silently, where the browser still has an
   active Google session and prior consent, otherwise via a one-click popup.
   The drive.file scope this requests is Google's narrowest Drive grant: the
   app can only ever see files it created itself, never anything else in your
   Drive. Setting this up needs a one-time, free, ten-minute step only you can
   do — creating an OAuth client ID in Google Cloud Console — because it
   requires a Google account of your own; see Settings → "Where your data lives" for the
   walkthrough. */

const DRIVE_FILE_NAME = 'mcq-mastery-data.json';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const DRIVE_PUSH_DEBOUNCE_MS = 6 * 1000;      // push shortly after the last change settles
const DRIVE_PUSH_MAX_GAP_MS = 20 * 1000;      // never let a burst of activity go unpushed longer than this
const DRIVE_SAFETY_TIMER_MS = 60 * 1000;      // coarse fallback if a debounced push is ever lost

/**
 * An OAuth client ID identifies this APP to Google, not any one person — it
 * is not a secret (unlike an API key), and it only works from the exact
 * origin(s) it was registered against. That means it needs setting up once,
 * by whoever deploys this copy of the app, not by every person who opens it.
 * Fill this in after doing the one-time Google Cloud Console steps
 * (Settings → "Where your data lives" has the walkthrough) and every visitor
 * to this deployment gets Drive sync with zero setup of their own. Leave it
 * blank — the default — and each visitor is asked to supply their own, which
 * is the right behaviour for anyone who forks this app to a different URL,
 * where a new origin needs its own registered client ID.
 */
const DEFAULT_DRIVE_CLIENT_ID = '677745775689-2b5r4ppr1eqshc8aek7gr3df90q061nc.apps.googleusercontent.com';

/** Settings can still override this per-browser (a fork running from a
    different origin, or someone testing their own project) — the baked-in
    default only wins when nothing has been explicitly set. */
function effectiveDriveClientId() {
  return Settings.get('driveClientId') || DEFAULT_DRIVE_CLIENT_ID;
}

const DriveSync = {
  connected: false, fileId: null, accessToken: null, tokenExpiresAt: 0,
  lastPushedAt: null, lastSyncedModifiedTime: null, problem: null, setupError: null,
  _tokenClient: null, _tokenClientId: null, _pushTimer: null, _debounceTimer: null,
  _pushing: false, _pendingChange: false, _firstUnpushedChangeAt: null,
  _remoteQuestionCount: 0, _driveShrinkOk: null,

  /** Mirrors FileStore.lossCheck() — the last line of defence before a push,
      because nothing upstream of this (a stale local bank, a wrong click, a
      fresh device that has not caught up yet) should be able to silently
      collapse what is already on Drive. Returns null to proceed, or a
      reason to refuse. */
  driveLossCheck(newCount) {
    const known = this._remoteQuestionCount || 0;
    if (known === 0) return null;                 // nothing on Drive to lose yet
    if (this._driveShrinkOk) return null;          // a deletion you asked for
    if (newCount === 0) return 'This browser’s bank is empty while Drive holds ' + known + ' question(s).';
    if (newCount < known * 0.5) return 'This browser’s bank has ' + newCount + ' question(s) while Drive holds ' + known + '.';
    return null;
  },
  allowDriveShrink(reason) { this._driveShrinkOk = reason || true; },

  /** A token already in hand, not yet expired — connect() uses this to skip
      a redundant sign-in popup when only the file-setup half failed last
      time, not the Google sign-in itself. */
  hasLiveToken() { return !!(this.accessToken && Date.now() < this.tokenExpiresAt); },

  /** Boot-time: resume a previous connection silently, never with a popup.
      If Drive changed since this browser last touched it, load that in —
      the same way a connected local file is just read on startup — unless
      this browser also has changes of its own that never reached Drive,
      which is a real conflict rather than routine catching-up. */
  async init() {
    const clientId = effectiveDriveClientId();
    const fileId = await FileStore.meta('driveFileId');
    const wasConnected = await FileStore.meta('driveConnected');
    if (!clientId || !fileId || !wasConnected) return;
    if (FileStore.connected) {
      // Only one backend is ever active. Both being recorded as connected
      // means a local folder was connected before this version started
      // enforcing that — the folder wins, and Drive is left disconnected
      // (its file is untouched; only this app's link to it is dropped).
      await FileStore.delMeta('driveConnected');
      setTimeout(() => toast('A local folder and Google Drive were both connected — only one is used at a time, so Drive was disconnected here. Reconnect it from Settings if you meant to switch.', 'info', 10000), 1500);
      return;
    }
    this.fileId = fileId;
    this.lastSyncedModifiedTime = await FileStore.meta('driveModifiedTime');
    this._remoteQuestionCount = (await FileStore.meta('driveQuestionCount')) || 0;
    const dirtySince = await FileStore.meta('driveDirtySince');
    try {
      await this._loadGis();
      await this._requestToken(true);
      this.connected = !!this.accessToken;
    } catch (e) { this.connected = false; }
    if (!this.connected) { updateStorageBar(); return; }
    this._startTimer();
    updateStorageBar();

    try {
      const remoteModified = await this._fetchModifiedTime();
      if (!remoteModified || remoteModified === this.lastSyncedModifiedTime) {
        // Drive itself hasn't moved, so the routine "something changed
        // elsewhere" path below doesn't apply — but if a previous session
        // left an edit that never actually reached Drive (offline, or the
        // tab closed mid-push), it needs retrying now rather than sitting
        // unsynced indefinitely while the status bar still claims "synced".
        if (dirtySince) { this._pendingChange = true; await this.maybePush(true); }
        return;
      }
      if (dirtySince) {
        const remote = await this.pull();
        const remoteCount = (remote.stores.questions || []).length;
        const localCount = (await DB.all('questions')).length;
        const dramaticLoss = localCount === 0 || localCount < remoteCount * 0.5;
        for (; ;) {
          let choice = await modal({
            title: 'Google Drive changed elsewhere',
            body: h('div', { class: 'stack' }, [
              h('p', {}, 'This Drive file was updated from another device, and this browser also has changes of its own that never made it to Drive — probably closed before they could sync.'),
              h('p', { class: 'small' }, 'Drive holds ' + remoteCount + ' question(s), saved ' + fmtDate(remote.savedAt, true) + '. This browser holds ' + localCount + '.'),
              h('div', { class: 'notice small' }, 'Merging keeps everything from both — nothing is discarded, and this browser is backed up first, automatically.')
            ]),
            actions: [
              { label: 'Choose one side instead', value: 'choose' },
              { label: 'Merge both', value: 'merge', kind: 'primary' }
            ]
          });
          if (choice === 'choose') {
            choice = await chooseOneSideDialog('Google Drive', 'drive', remoteCount, localCount, dramaticLoss);
            if (!choice) continue; // "Back" really goes back now
          }
          if (choice === 'drive') {
            if (await requireSafetyBackup('discarding this browser’s unsynced changes for the Drive copy')) await this._applyRemote(remote);
          } else if (choice === 'browser') {
            if (await requireExternalBackup(remote, 'mcq-mastery-drive', 'the Drive copy', 'overwriting the Drive copy with this browser’s bank')) {
              this.allowDriveShrink('confirmed by the user, after a backup, in the Drive boot-conflict dialog');
              await this.push();
            }
          } else if (choice === 'merge') {
            if (await requireSafetyBackup('merging this browser’s unsynced changes with what is in Google Drive')) {
              const localPayload = await FileStore.buildPayload();
              const { merged, report } = await mergeBankPayloads(localPayload, remote);
              await applyMergedBank(merged);
              await this.push();
              await showMergeReport(report, 'Merged with Google Drive', 'Both copies were combined and pushed back to Drive — this browser and Drive now match.');
            }
          }
          // Escape/✕ (no Cancel button here) leaves the boot conflict
          // unresolved for now — safe, since nothing was touched, and the
          // same check runs again on the next boot.
          break;
        }
      } else {
        // The routine case: nothing unsynced here, so the newer Drive copy
        // is simply loaded in, same as opening a local file that changed.
        const remote = await this.pull();
        await this._applyRemote(remote);
      }
      await this._recordSyncedStamp();
    } catch (e) { /* best-effort — this browser just stays on what it has until the next successful check */ }
  },

  _loadGis() {
    if (window.google && window.google.accounts && window.google.accounts.oauth2) return Promise.resolve();
    return new Promise((res, rej) => {
      const s = h('script', { src: 'https://accounts.google.com/gsi/client', onload: res, onerror: () => rej(new Error('Could not load Google Identity Services — check your connection.')) });
      document.head.appendChild(s);
    });
  },

  /** silent=true never shows UI and rejects quietly if a token cannot be had
      without one; silent=false may show Google's account/consent popup. */
  _requestToken(silent) {
    return new Promise((resolve, reject) => {
      const clientId = effectiveDriveClientId();
      if (!clientId) { reject(new Error('No Google OAuth client ID set — see Settings → "Where your data lives".')); return; }
      // Rebuild if this is the first request, or if the effective client ID
      // has changed since the cached one was built (Settings edited, or the
      // deployer's default filled in, without a full page reload in
      // between) — otherwise a corrected ID would silently keep sending the
      // stale one Google already rejected.
      if (!this._tokenClient || this._tokenClientId !== clientId) {
        this._tokenClient = google.accounts.oauth2.initTokenClient({ client_id: clientId, scope: DRIVE_SCOPE, callback: () => { } });
        this._tokenClientId = clientId;
      }
      this._tokenClient.callback = (resp) => {
        if (resp.error) { reject(new Error(resp.error)); return; }
        this.accessToken = resp.access_token;
        this.tokenExpiresAt = Date.now() + ((resp.expires_in || 3600) * 1000) - 60000;
        resolve(resp);
      };
      this._tokenClient.error_callback = (err) => reject(new Error((err && err.type) || 'could not get permission'));
      this._tokenClient.requestAccessToken(silent ? { prompt: '' } : {});
    });
  },

  async _ensureToken() {
    if (this.accessToken && Date.now() < this.tokenExpiresAt) return true;
    try { await this._requestToken(true); return true; }
    catch (e) { this.connected = false; this.problem = 'Sign-in expired — reconnect in Settings.'; updateStorageBar(); return false; }
  },

  /** connect() only handles Google auth and the Drive file itself — whether
      to disconnect a local folder first is a UX decision made one level up,
      in driveConnectFlow(), the same split FileStore.connectFolder() and
      connectFlow() already use. */
  async connect() {
    const clientId = effectiveDriveClientId();
    if (!clientId) {
      await modal({ title: 'Add a Google OAuth client ID first', body: h('p', {}, 'Settings → "Where your data lives" has the one-time setup steps — about ten minutes, free, and only you can do it (it needs your own Google account).') });
      return;
    }
    // A previous attempt may have already signed in successfully and failed
    // only on the Drive-file half — skip a redundant Google popup in that
    // case rather than making the user sign in twice for one failure.
    if (!this.hasLiveToken()) {
      try {
        await this._loadGis();
        await this._requestToken(false);
      } catch (e) { this.setupError = 'Could not sign in to Google: ' + e.message; updateStorageBar(); toast(this.setupError, 'bad', 8000); return; }
    }
    try {
      let fileId = await FileStore.meta('driveFileId');
      if (!fileId) fileId = (await this._findExisting()) || (await this._createFile());
      this.fileId = fileId;
      this.connected = true; this.problem = null; this.setupError = null;

      const proceed = await this._reconcileOnConnect();
      if (!proceed) {
        this.connected = false; this.fileId = null;
        updateStorageBar();
        return;
      }

      await FileStore.setMeta('driveFileId', fileId);
      await FileStore.setMeta('driveConnected', true);
      this._startTimer();
      await this._recordSyncedStamp();
      updateStorageBar();
      toast('Google Drive connected.', 'ok');
    } catch (e) {
      this.connected = false;
      this.setupError = 'Signed in to Google, but could not set up the Drive file: ' + e.message;
      updateStorageBar();
      toast(this.setupError, 'bad', 8000);
    }
  },

  /** After the file is reachable: reconcile what is already there against
      this browser, the same "keep this / keep that" choice the local
      folder's connectFlow() uses. Returns false only if the person cancelled
      outright — connect() then rolls the whole attempt back rather than
      leaving a half-decided connection. */
  async _reconcileOnConnect() {
    // By this point fileId always names a real Drive file — either found by
    // search or just created empty — so a pull() failure here is never "no
    // file yet"; it's a real problem (network error, or a newer app version
    // wrote a schema this build can't read) and must stop, not overwrite
    // whatever is actually there.
    let remote;
    try { remote = await this.pull(); } catch (e) {
      await modal({ title: 'Could not check Google Drive', body: h('p', {}, e.message + ' Try connecting again once that is resolved — nothing here has been changed.') });
      return false;
    }
    const remoteCount = (remote.stores.questions || []).length;
    if (!remoteCount) { await this.push(); return true; }
    const localCount = (await DB.all('questions')).length;
    const dramaticLoss = localCount === 0 || localCount < remoteCount * 0.5;
    for (; ;) {
      let choice = await modal({
        title: 'There is already a bank in Google Drive',
        body: h('div', { class: 'stack' }, [
          h('p', {}, 'That Drive file already holds ' + remoteCount + ' question(s), saved ' + fmtDate(remote.savedAt, true) + '.'),
          h('p', { class: 'small' }, 'This browser currently holds ' + localCount + ' question(s).'),
          h('div', { class: 'notice small' }, 'Merging keeps everything both copies hold — nothing is discarded, and this browser is backed up first, automatically.')
        ]),
        actions: [
          { label: 'Cancel', value: '' },
          { label: 'Choose one side instead', value: 'choose' },
          { label: 'Merge both', value: 'merge', kind: 'primary' }
        ]
      });
      if (choice === 'choose') {
        choice = await chooseOneSideDialog('Google Drive', 'drive', remoteCount, localCount, dramaticLoss);
        if (!choice) continue; // "Back" really goes back now, not all the way out
      }
      if (choice === 'drive') {
        if (!(await requireSafetyBackup('discarding this browser’s bank for the Drive copy'))) return false;
        await this._applyRemote(remote);
        return true;
      }
      if (choice === 'browser') {
        if (!(await requireExternalBackup(remote, 'mcq-mastery-drive', 'the Drive copy', 'overwriting the Drive copy with this browser’s bank'))) return false;
        this.allowDriveShrink('confirmed by the user, after a backup, in the Drive reconciliation dialog');
        await this.push();
        return true;
      }
      if (choice === 'merge') {
        if (!(await requireSafetyBackup('merging this browser’s bank with what is in Google Drive'))) return false;
        const localPayload = await FileStore.buildPayload();
        const { merged, report } = await mergeBankPayloads(localPayload, remote);
        await applyMergedBank(merged);
        await this.push();
        await showMergeReport(report, 'Merged with Google Drive', 'Both copies were combined and pushed back to Drive — this browser and Drive now match.');
        return true;
      }
      return false;
    }
  },

  async disconnect() {
    // A push is debounced up to DRIVE_PUSH_MAX_GAP_MS after an edit — flush
    // any pending one now, or an edit made just before disconnecting is
    // silently lost instead of "kept synced up to now" as every caller's
    // confirmation dialog promises.
    if (this._pendingChange) await this.maybePush(true);
    if (this.accessToken && window.google && google.accounts && google.accounts.oauth2) {
      try { google.accounts.oauth2.revoke(this.accessToken, () => { }); } catch (e) { }
    }
    clearTimeout(this._debounceTimer);
    if (this._pushTimer) { clearInterval(this._pushTimer); this._pushTimer = null; }
    this.connected = false; this.accessToken = null; this.fileId = null; this.problem = null; this.setupError = null;
    this._pendingChange = false; this._firstUnpushedChangeAt = null; this.lastSyncedModifiedTime = null;
    this._remoteQuestionCount = 0; this._driveShrinkOk = null;
    await FileStore.delMeta('driveFileId');
    await FileStore.delMeta('driveConnected');
    await FileStore.delMeta('driveModifiedTime');
    await FileStore.delMeta('driveDirtySince');
    await FileStore.delMeta('driveQuestionCount');
    updateStorageBar();
    toast('Google Drive disconnected — the file stays in your Drive, this only forgets it here.', 'ok');
  },

  /** Called by the DAL after any successful write, mirroring
      FileStore.touch() — Drive has no cheap incremental append, so this just
      schedules a debounced whole-file push rather than journalling. */
  touch(store) {
    if (!this.connected || store === 'fsmeta') return;
    if (!this._firstUnpushedChangeAt) {
      this._firstUnpushedChangeAt = Date.now();
      FileStore.setMeta('driveDirtySince', nowISO());
    }
    this._pendingChange = true;
    clearTimeout(this._debounceTimer);
    const overdue = Date.now() - this._firstUnpushedChangeAt >= DRIVE_PUSH_MAX_GAP_MS;
    this._debounceTimer = setTimeout(() => this.push(), overdue ? 0 : DRIVE_PUSH_DEBOUNCE_MS);
  },

  /** Coarse safety net in case a debounced push is ever lost — a
      backgrounded tab can throttle setTimeout well past its delay. */
  _startTimer() {
    if (this._pushTimer) return;
    this._pushTimer = setInterval(() => this.maybePush(), DRIVE_SAFETY_TIMER_MS);
  },

  /** Push if there is something unpushed, or always on force (session end,
      tab hiding, the manual button). */
  async maybePush(force) {
    if (!this.connected || this._pushing) return false;
    if (!force && !this._pendingChange) return false;
    clearTimeout(this._debounceTimer);
    return await this.push();
  },

  async push() {
    if (!this.connected || this._pushing) return false;
    this._pushing = true;
    try {
      if (!(await this._ensureToken())) return false;
      const payload = await FileStore.buildPayload();
      const newCount = (payload.stores.questions || []).length;
      const refuse = this.driveLossCheck(newCount);
      if (refuse) {
        this.problem = 'Sync blocked to protect Drive — ' + refuse + ' Reconnect or resolve this from Settings before syncing.';
        updateStorageBar();
        toast(this.problem, 'bad', 10000);
        return false;
      }
      const res = await fetch('https://www.googleapis.com/upload/drive/v3/files/' + this.fileId + '?uploadType=media&fields=modifiedTime', {
        method: 'PATCH',
        headers: { 'Authorization': 'Bearer ' + this.accessToken, 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error('Drive returned ' + res.status);
      const meta = await res.json().catch(() => null);
      this.lastPushedAt = nowISO();
      this.problem = null;
      this._pendingChange = false; this._firstUnpushedChangeAt = null;
      this._remoteQuestionCount = newCount; this._driveShrinkOk = null;
      await FileStore.setMeta('driveQuestionCount', newCount);
      await this._recordSyncedStamp(meta && meta.modifiedTime);
      await FileStore.delMeta('driveDirtySince');
      updateStorageBar();
      return true;
    } catch (e) {
      this.problem = 'Last sync failed: ' + e.message;
      updateStorageBar();
      return false;
    } finally {
      this._pushing = false;
    }
  },

  async pull() {
    if (!(await this._ensureToken())) throw new Error('Could not reach Google Drive.');
    const res = await fetch('https://www.googleapis.com/drive/v3/files/' + this.fileId + '?alt=media', {
      headers: { 'Authorization': 'Bearer ' + this.accessToken }
    });
    if (!res.ok) throw new Error('Drive returned ' + res.status);
    const payload = await res.json();
    if (!payload || !payload.stores) throw new Error('That file did not look like an MCQ Mastery snapshot.');
    if ((payload.schema || 1) > APP.schema) throw new Error('That snapshot was written by a newer version of the app.');
    return payload;
  },

  /** Metadata-only — a few bytes, not the whole file — used to notice a
      change on Drive without downloading it every time. */
  async _fetchModifiedTime() {
    if (!(await this._ensureToken())) return null;
    try {
      const res = await fetch('https://www.googleapis.com/drive/v3/files/' + this.fileId + '?fields=modifiedTime', {
        headers: { 'Authorization': 'Bearer ' + this.accessToken }
      });
      if (!res.ok) return null;
      const j = await res.json();
      return j.modifiedTime || null;
    } catch (e) { return null; }
  },

  async _recordSyncedStamp(mt) {
    const stamp = mt || await this._fetchModifiedTime();
    if (stamp) { this.lastSyncedModifiedTime = stamp; await FileStore.setMeta('driveModifiedTime', stamp); }
  },

  async _findExisting() {
    const q = encodeURIComponent("name='" + DRIVE_FILE_NAME + "' and trashed=false");
    const res = await fetch('https://www.googleapis.com/drive/v3/files?q=' + q + '&spaces=drive&fields=files(id)', {
      headers: { 'Authorization': 'Bearer ' + this.accessToken }
    });
    if (!res.ok) return null;
    const j = await res.json();
    return (j.files && j.files[0] && j.files[0].id) || null;
  },

  async _createFile() {
    const boundary = 'mcqmastery' + uuid();
    const metadata = { name: DRIVE_FILE_NAME, mimeType: 'application/json' };
    const empty = JSON.stringify({ app: 'mcq-mastery', schema: APP.schema, savedAt: nowISO(), stores: {} });
    const body =
      '--' + boundary + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(metadata) + '\r\n' +
      '--' + boundary + '\r\nContent-Type: application/json\r\n\r\n' + empty + '\r\n' +
      '--' + boundary + '--';
    const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + this.accessToken, 'Content-Type': 'multipart/related; boundary=' + boundary },
      body
    });
    if (!res.ok) throw new Error('Could not create the Drive file (status ' + res.status + ').');
    return (await res.json()).id;
  },

  /** Upload an arbitrary file (a note — a PDF, a photo of a page, anything)
      as its own Drive file, distinct from the one data snapshot above. Binary
      content, so the multipart body is built as a Blob mixing text and raw
      file bytes, not a string — a naive string join would corrupt anything
      that is not valid UTF-8 text. */
  async uploadNoteFile(file, name) {
    if (!(await this._ensureToken())) throw new Error('Reconnect Google Drive to upload this.');
    const boundary = 'mcqnote' + uuid();
    const metadata = { name: name || file.name, mimeType: file.type || 'application/octet-stream' };
    const head = '--' + boundary + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(metadata) + '\r\n' +
      '--' + boundary + '\r\nContent-Type: ' + (file.type || 'application/octet-stream') + '\r\n\r\n';
    const tail = '\r\n--' + boundary + '--';
    const body = new Blob([head, file, tail]);
    const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + this.accessToken, 'Content-Type': 'multipart/related; boundary=' + boundary },
      body
    });
    if (!res.ok) throw new Error('Could not upload to Drive (status ' + res.status + ').');
    return (await res.json()).id;
  },

  async deleteDriveFile(fileId) {
    if (!(await this._ensureToken())) return false;
    try {
      const res = await fetch('https://www.googleapis.com/drive/v3/files/' + fileId, {
