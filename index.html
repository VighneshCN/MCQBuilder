      out.push('');
    }
  }
  return out.join('\n').replace(/\n{3,}/g, '\n\n');
}
function wpText(p) {
  let s = p.replace(/<w:tab\b[^>]*\/>/g, '\t').replace(/<w:br\b[^>]*\/>/g, '\n');
  const parts = s.match(/<w:t[^>]*>[\s\S]*?<\/w:t>/g) || [];
  let text = parts.map(x => x.replace(/<[^>]+>/g, '')).join('');
  text = decodeXmlEnt(text);
  // numbered/bulleted list markers are lost in OOXML text; add a hint marker
  if (/<w:numPr>/.test(p) && text.trim()) text = '• ' + text;
  return text.replace(/\u00a0/g, ' ').trimEnd();
}

/* ---------- XLSX → rows ---------- */
async function xlsxToRows(arrayBuffer) {
  const zip = await unzip(arrayBuffer);
  const shared = [];
  const ssXml = await zip.text('xl/sharedStrings.xml');
  if (ssXml) {
    (ssXml.match(/<si>[\s\S]*?<\/si>/g) || []).forEach(si => {
      const t = (si.match(/<t[^>]*>([\s\S]*?)<\/t>/g) || []).map(x => x.replace(/<[^>]+>/g, '')).join('');
      shared.push(decodeXmlEnt(t));
    });
  }
  const sheetName = zip.names().filter(n => /^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort()[0];
  if (!sheetName) throw new Error('No worksheet found in the workbook.');
  const sx = await zip.text(sheetName);
  const rows = [];
  (sx.match(/<row[^>]*>[\s\S]*?<\/row>/g) || []).forEach(r => {
    const cells = [];
    (r.match(/<c[^>]*(?:\/>|>[\s\S]*?<\/c>)/g) || []).forEach(c => {
      const ref = (/r="([A-Z]+)\d+"/.exec(c) || [])[1] || '';
      const col = colIndex(ref);
      const isStr = /t="s"/.test(c), isInline = /t="(inlineStr|str)"/.test(c);
      let v = '';
      const vm = /<v>([\s\S]*?)<\/v>/.exec(c);
      if (isInline) { const im = /<t[^>]*>([\s\S]*?)<\/t>/.exec(c); v = im ? decodeXmlEnt(im[1]) : ''; }
      else if (vm) v = isStr ? (shared[parseInt(vm[1], 10)] || '') : vm[1];
      while (cells.length < col) cells.push('');
      cells[col] = v;
    });
    rows.push(cells);
  });
  return rows;
}
function colIndex(ref) { let n = 0; for (let i = 0; i < ref.length; i++) n = n * 26 + (ref.charCodeAt(i) - 64); return Math.max(0, n - 1); }
function decodeXmlEnt(s) { return String(s).replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&#(\d+);/g, (_, d) => String.fromCharCode(+d)); }

/* ---------- PDF → text (best effort, uncompressed + FlateDecode) ---------- */
async function pdfToText(arrayBuffer) {
  const u8 = new Uint8Array(arrayBuffer);
  let latin = '';
  const CH = 32768;
  for (let i = 0; i < u8.length; i += CH) latin += String.fromCharCode.apply(null, u8.subarray(i, i + CH));
  if (latin.slice(0, 5) !== '%PDF-') throw new Error('That file is not a PDF.');
  if (/\/Encrypt\b/.test(latin)) throw new Error('This PDF is encrypted. Remove the protection, or export the text to .docx / .txt.');
  const out = [];
  const re = /stream\r?\n?/g;
  let m;
  while ((m = re.exec(latin))) {
    const start = m.index + m[0].length;
    const end = latin.indexOf('endstream', start);
    if (end < 0) break;
    const header = latin.slice(Math.max(0, m.index - 400), m.index);
    let data = u8.subarray(start, end);
    if (/\/FlateDecode/.test(header)) {
      try { data = await inflateZlib(data); }
      catch (e) { try { data = await inflateRaw(data); } catch (e2) { re.lastIndex = end; continue; } }
    } else if (/\/(DCTDecode|JPXDecode|CCITTFaxDecode|RunLengthDecode|LZWDecode|ASCII85Decode)/.test(header)) {
      re.lastIndex = end; continue;
    }
    let txt = '';
    const CH2 = 32768;
    for (let i = 0; i < data.length; i += CH2) txt += String.fromCharCode.apply(null, data.subarray(i, i + CH2));
    if (/BT[\s\S]{0,4000}?ET/.test(txt) || /\bTj\b|\bTJ\b/.test(txt)) out.push(extractPdfOps(txt));
    re.lastIndex = end;
  }
  const text = out.join('\n').replace(/\n{3,}/g, '\n\n').trim();
  if (!text) throw new Error('No extractable text layer. This is probably a scanned PDF — use Add from Image instead.');
  // A from-scratch decoder cannot resolve every PDF structure (linearized
  // files, compressed object streams, predictor-filtered or hint streams
  // sitting alongside real content streams, non-WinAnsi subset fonts). When
  // it has clearly failed, garbled bytes must never be presented as a
  // successful import — fail with a concrete next step instead.
  const printable = (text.match(/[ -~\n\t]/g) || []).length;
  if (printable / text.length < 0.85 || text.replace(/\s/g, '').length < 30) {
    throw new Error('This PDF\'s text layer could not be read reliably (its internal structure — a compressed or linearized layout — defeats this app\'s built-in decoder). Open it in Word or Google Docs and save/export as .docx, or export the page(s) as text, then import that instead. Add from Image also works page by page.');
  }
  return text;
}
function extractPdfOps(s) {
  const lines = [];
  let buf = '';
  const re = /(\((?:\\.|[^\\()])*\)|<[0-9A-Fa-f\s]*>)\s*(Tj|TJ|'|")|\[((?:[^\][]|\\.)*)\]\s*TJ|(T\*|Td|TD|ET|BT)/g;
  let m;
  while ((m = re.exec(s))) {
    if (m[3] != null) {
      const parts = m[3].match(/\((?:\\.|[^\\()])*\)|<[0-9A-Fa-f\s]*>|-?\d+(?:\.\d+)?/g) || [];
      parts.forEach(p => {
        if (p[0] === '(' || p[0] === '<') buf += pdfStr(p);
        else if (parseFloat(p) < -120) buf += ' ';
      });
    } else if (m[1] != null) {
      buf += pdfStr(m[1]);
      if (m[2] === "'" || m[2] === '"') { lines.push(buf); buf = ''; }
    } else if (m[4] === 'T*' || m[4] === 'Td' || m[4] === 'TD' || m[4] === 'ET') {
      if (buf.trim()) lines.push(buf);
      buf = '';
    }
  }
  if (buf.trim()) lines.push(buf);
  return lines.map(l => l.replace(/\s+/g, ' ').trim()).filter(Boolean).join('\n');
}
function pdfStr(tok) {
  if (tok[0] === '<') {
    const hex = tok.slice(1, -1).replace(/\s+/g, '');
    let s = '';
    for (let i = 0; i + 1 < hex.length; i += 2) {
      const code = parseInt(hex.substr(i, 2), 16);
      if (code) s += String.fromCharCode(code);
    }
    return s;
  }
  return tok.slice(1, -1)
    .replace(/\\n/g, '\n').replace(/\\r/g, '\n').replace(/\\t/g, '\t')
    .replace(/\\b/g, '').replace(/\\f/g, '')
    .replace(/\\([0-7]{1,3})/g, (_, o) => String.fromCharCode(parseInt(o, 8)))
    .replace(/\\(.)/g, '$1');
}

/* ---------- CSV (RFC 4180, quote-safe) ---------- */
function parseCSV(text) {
  const rows = [];
  let row = [], field = '', q = false, i = 0;
  const s = String(text).replace(/^\uFEFF/, '');
  while (i < s.length) {
    const c = s[i];
    if (q) {
      if (c === '"') { if (s[i + 1] === '"') { field += '"'; i += 2; continue; } q = false; i++; continue; }
      field += c; i++; continue;
    }
    if (c === '"') { q = true; i++; continue; }
    if (c === ',') { row.push(field); field = ''; i++; continue; }
    if (c === '\r') { i++; continue; }
    if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; i++; continue; }
    field += c; i++;
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(v => String(v).trim() !== ''));
}
function toCSV(rows) {
  return rows.map(r => r.map(v => {
    const s = v == null ? '' : String(v);
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(',')).join('\r\n');
}

/* ---------- file router ---------- */
const ACCEPTED = ['.txt', '.md', '.csv', '.json', '.docx', '.xlsx', '.pdf', '.png', '.jpg', '.jpeg', '.webp', '.gif'];
const MAX_FILE_MB = 40;
function extOf(name) { const m = /\.[a-z0-9]+$/i.exec(name || ''); return m ? m[0].toLowerCase() : ''; }

async function readFile(file) {
  const ext = extOf(file.name);
  if (ext === '.doc') throw new Error('Legacy .doc is not supported. Open it in Word and save as .docx, then import again.');
  if (ACCEPTED.indexOf(ext) < 0) throw new Error('Unsupported file type "' + (ext || '?') + '". Accepted: ' + ACCEPTED.join(', '));
  if (file.size > MAX_FILE_MB * 1048576) throw new Error('File is larger than ' + MAX_FILE_MB + ' MB. Split it and import in parts.');
  const buf = await file.arrayBuffer();
  const fileHash = await sha256(buf);
  const base = { filename: file.name, size: file.size, fileHash, ext };
  if (ext === '.png' || ext === '.jpg' || ext === '.jpeg' || ext === '.webp' || ext === '.gif') {
    return Object.assign(base, { kind: 'image', blob: file });
  }
  if (ext === '.docx') return Object.assign(base, { kind: 'text', sourceType: 'docx', text: await docxToText(buf) });
  if (ext === '.xlsx') return Object.assign(base, { kind: 'rows', sourceType: 'xlsx', rows: await xlsxToRows(buf) });
  if (ext === '.pdf') return Object.assign(base, { kind: 'text', sourceType: 'pdf', text: await pdfToText(buf) });
  const text = new TextDecoder().decode(buf);
  if (ext === '.csv') return Object.assign(base, { kind: 'rows', sourceType: 'csv', rows: parseCSV(text) });
  if (ext === '.json') return Object.assign(base, { kind: 'json', sourceType: 'json', json: JSON.parse(text) });
  return Object.assign(base, { kind: 'text', sourceType: 'txt', text });
}


/* ============================================================================
   05 · Parsing — turn extracted text or rows into question candidates.
   Every field carries a confidence so nothing uncertain slips in silently.
   ========================================================================== */

const RX = {
  qStart: /^\s*(?:q(?:uestion)?\s*[.\-:]?\s*)?(\d{1,4})\s*[.)\]:\-]\s+(.*)$/i,
  qWord: /^\s*q(?:uestion)?\s*[.\-:#]?\s*(\d{1,4})\b[.):\-]?\s*(.*)$/i,
  option: /^\s*[\(\[]?\s*([a-hA-H])\s*[\)\].:\-]\s*(.+)$/,
  optionOnly: /^\s*[\(\[]?\s*([a-hA-H])\s*[\)\].:]?\s*$/,
  optionBullet: /^\s*[•\-\*\u25cf\u25aa\u00b7]\s+(.+)$/,
  optionNum: /^\s*[\(\[]?\s*([1-8])\s*[\)\].:]\s+(.+)$/,
  // Matches "Answer: B", "Ans - c", "Correct answer: D", and prose forms like
  // "The correct answer is: C." or "The correct answer is B." (with or
  // without a separating colon/dash — real documents mix both).
  answer: /^\s*(?:the\s+)?(?:correct\s+)?(?:answer|ans\.?|key|correct\s+option|correct\s+choice)s?\s*(?:is|was)?\s*[:\-–.=]?\s*(.*)$/i,
  explanation: /^\s*(?:explanation|rationale|reason|justification|why|note|solution)\s*[:\-–.=]?\s*(.*)$/i,
  // A leading letter with a word-boundary right after it, so "Available…"
  // (A + boundary-less "vailable") never misreads as option A. Whatever
  // follows — nothing, ") text", ". text", or "text" with no punctuation
  // at all — is accepted, which real answer lines do inconsistently.
  answerLetter: /^\s*[\(\[]?\s*([a-hA-H])\b[\)\].:]?\s*[-–:]?\s*(.*)$/,
  keyPair: /(?:^|[\s,;|])(?:q\.?\s*)?(\d{1,4})\s*[.):\-=]?\s*([a-hA-H])(?=$|[\s,;|.])/g,
  header: /^\s*(page\s+\d+|chapter\s+\d+|module\s+\d+|\d+\s*\|\s*page|copyright|all rights reserved)\b/i
};
const PARSE_TEMPLATES = [
  { id: 'auto',      name: 'Auto-detect (recommended)', desc: 'Tries numbered stems with lettered options, then bullets, then tables.' },
  { id: 'lettered',  name: 'Numbered stem + A/B/C/D options', desc: 'Q1. … then A) … B) … C) … D)' },
  { id: 'bullets',   name: 'Stem + bulleted options', desc: 'Stem line followed by bullet or dash options.' },
  { id: 'inline',    name: 'One question per line block, answer inline', desc: 'Stem, options, then Answer: C on its own line.' },
  { id: 'table',     name: 'Tabular (tab-separated)', desc: 'Stem, A, B, C, D, Answer, Explanation across a row.' }
];

/** True for a line that is itself meaningful MCQ structure (answer/option/
 * question marker), so its natural repetition across many questions must
 * never be mistaken for a repeated page header or footer. */
function looksStructuralLine(t) {
  return RX.answer.test(t) || RX.explanation.test(t) || RX.qStart.test(t) || RX.qWord.test(t) ||
    RX.optionOnly.test(t) || /^\s*[\(\[]?[a-hA-H]\s*[\)\].:\-]/.test(t);
}
function cleanLines(text) {
  const raw = String(text).replace(/\r\n?/g, '\n').split('\n');
  // Drop repeated headers/footers that appear on many pages. A running
  // title like "Mock Assessment Test Paper 1" repeats verbatim on every
  // page and is decoration. "Answer: c" also repeats hundreds of times —
  // but it collapses to one of only four possible strings, is genuine
  // per-question content, and must never be stripped just for recurring.
  const freq = new Map();
  raw.forEach(l => {
    const k = normText(l);
    if (k.length > 3 && k.length < 90 && !looksStructuralLine(l)) freq.set(k, (freq.get(k) || 0) + 1);
  });
  const pages = Math.max(1, Math.round(raw.length / 45));
  const repeat = new Set();
  freq.forEach((v, k) => { if (v >= Math.max(4, pages * 0.6)) repeat.add(k); });
  return raw.map((l, i) => ({ n: i + 1, t: l.replace(/\u00a0/g, ' ').replace(/[ \t]+$/, '') }))
    .filter(l => !(repeat.has(normText(l.t)) || RX.header.test(l.t) && l.t.length < 60));
}

/**
 * A line belonging to a separate answer key rather than to a question.
 * Without this, "1. B  2. C" at the end of a chapter parses as question 1.
 */
const KEY_HEADER_RX = /^(answer\s*key|answers|solutions|key|correct\s*answers)\s*[:\-–]?$/i;
function isKeyLine(t) {
  const s = String(t || '').trim();
  if (!s) return false;
  if (KEY_HEADER_RX.test(s)) return true;
  RX.keyPair.lastIndex = 0;
  let m, n = 0, covered = 0;
  while ((m = RX.keyPair.exec(s))) { n++; covered += m[0].length; }
  return n >= 2 && covered / s.length > 0.6;
}

/** Guard against treating a stray capital letter as an option. */
function looksLikeOption(line, prevWasOption, idxExpected) {
  const m = RX.option.exec(line);
  if (!m) return null;
  const letter = m[1].toUpperCase(), body = m[2].trim();
  if (body.length < 2) return null;
  // "I. Introduction" style roman/heading or a sentence continuing mid-thought
  if (/^[A-Z]\.\s+[A-Z][a-z]+\s+\d{4}/.test(line)) return null;
  const expected = LETTERS[idxExpected];
  if (!prevWasOption && letter !== 'A' && letter !== 'a' && letter !== expected) {
    // an isolated "B) something" with no preceding A) is suspicious
    return { letter, body, weak: true };
  }
  return { letter, body, weak: letter !== expected };
}

/**
 * Parse free text into candidates.
 * Returns { candidates, unresolved, keyMap }
 */
function parseText(text, opts) {
  opts = opts || {};
  const template = opts.template || 'auto';
  const lines = cleanLines(text);
  const candidates = [];
  const unresolved = [];
  let cur = null, mode = 'idle', expl = [], stemBuf = [];

  const flush = () => {
    if (!cur) return;
    cur.stem = stemBuf.join('\n').trim();
    cur.explanation = expl.join('\n').trim();
    if (cur.stem) candidates.push(cur); else unresolved.push({ line: cur.line, text: '(question with no stem)' });
    cur = null; stemBuf = []; expl = []; mode = 'idle';
  };
  const startQ = (n, rest, lineNo) => {
    flush();
    cur = {
      line: lineNo, originalNumber: n ? String(n) : '', options: [], answerRaw: '', answerLetter: '',
      conf: { stem: 0.9, options: 0, answer: 0, explanation: 0 }, weakOptions: false
    };
    stemBuf = rest ? [rest] : []; mode = 'stem';
  };

  for (let i = 0; i < lines.length; i++) {
    const L = lines[i], t = L.t.trim();
    if (!t) { if (mode === 'stem' && stemBuf.length) mode = 'stem'; continue; }
    // A separate answer key is harvested below, never parsed as questions.
    if (isKeyLine(t)) { flush(); continue; }

    if (template === 'table' || (template === 'auto' && t.indexOf('\t') >= 0 && t.split('\t').length >= 4)) {
      const cells = t.split('\t').map(s => s.trim());
      const tq = tableRowToCandidate(cells, L.n);
      if (tq) { flush(); candidates.push(tq); continue; }
    }

    const qw = RX.qWord.exec(t);
    const qs = RX.qStart.exec(t);
    const stillCollectingOptions = mode === 'stem' || mode === 'options';
    const optHit = stillCollectingOptions ? looksLikeOption(t, mode === 'options', cur ? cur.options.length : 0) : null;
    const optOnly = stillCollectingOptions ? RX.optionOnly.exec(t) : null;
    const isAnswerLine = RX.answer.test(t);
    const isExplLine = RX.explanation.test(t);

    // A numbered line while collecting options is the next question, not an option.
    if ((qw || qs) && !optHit && !isAnswerLine && !isExplLine) {
      const m = qw || qs;
      startQ(m[1], m[2], L.n);
      continue;
    }
    // The FIRST line that states an answer is authoritative. A source often
    // restates it inside the explanation paragraph that follows ("Correct
    // answer: C. …" or just "C. …" leading straight into prose) — once we
    // already have a letter, that restatement is explanation text, not a
    // second answer event, and must not be thrown away.
    if (isAnswerLine && cur && !cur.answerLetter) {
      const rest = RX.answer.exec(t)[1].trim();
      cur.answerRaw = rest || (lines[i + 1] ? lines[i + 1].t.trim() : '');
      if (!rest && lines[i + 1]) i++;
      const al = RX.answerLetter.exec(cur.answerRaw);
      if (al) { cur.answerLetter = al[1].toUpperCase(); cur.conf.answer = 0.95; }
      else cur.conf.answer = 0.55;
      mode = 'answer';
      continue;
    }
    if (isExplLine && cur) {
      const rest = RX.explanation.exec(t)[1].trim();
      if (rest) expl.push(rest);
      cur.conf.explanation = 0.9;
      mode = 'expl';
      continue;
    }
    // Anything unlabeled once the answer is already known is explanation —
    // whether or not it starts by restating "Answer: B" or just "B.". Some
    // sources keep the restatement and the real explanation in one paragraph
    // ("Correct Answer: C. Explanation: …"), so the label is hunted for
    // anywhere in the line, not just at its start.
    if (cur && (mode === 'answer' || mode === 'expl') && t) {
      let line = t;
      const labelMidLine = /\b(?:explanation|rationale|reason|justification)s?\s*[:\-–.]?\s*/i.exec(line);
      if (labelMidLine) {
        line = line.slice(labelMidLine.index + labelMidLine[0].length);
      } else {
        const restated = /^(?:the\s+)?(?:correct\s+)?answers?\s*(?:is|was)?\s*[:.\-–]?\s*/i.exec(line);
        if (restated) line = line.slice(restated[0].length);
        if (cur.answerLetter) {
          const letterPrefix = new RegExp('^' + cur.answerLetter + '\\b[\\)\\].:]?\\s*[-–:]?\\s*', 'i').exec(line);
          if (letterPrefix) line = line.slice(letterPrefix[0].length);
        }
      }
      if (line.trim()) expl.push(line.trim());
      cur.conf.explanation = Math.max(cur.conf.explanation, 0.75);
      mode = 'expl';
      continue;
    }

    if (optHit && template !== 'bullets') {
      const already = cur.options.some(o => o.letter === optHit.letter.toUpperCase());
      if (already && cur.options.length >= 2) {
        // The letters are cycling again with no answer line in between — this
        // is a per-option rationale block ("A. … B. … C. … D. …" explaining
        // each choice), not five-through-eight-more options. Fold it into
        // the explanation instead of corrupting the option list.
        expl.push(optHit.letter.toUpperCase() + '. ' + optHit.body);
        cur.conf.explanation = Math.max(cur.conf.explanation, 0.7);
        mode = 'expl';
        continue;
      }
      cur.options.push({ letter: optHit.letter.toUpperCase(), text: optHit.body });
      if (optHit.weak) cur.weakOptions = true;
      mode = 'options';
      continue;
    }
    // Word-to-PDF tab layouts often land the letter and its text on separate
    // lines ("A." then, on the next line, the option text). Start the option
    // here with empty text; the continuation branch below fills it in.
    if (optOnly && template !== 'bullets') {
      cur.options.push({ letter: optOnly[1].toUpperCase(), text: '' });
      mode = 'options';
      continue;
    }
    const bul = RX.optionBullet.exec(t);
    if (bul && cur && (template === 'bullets' || template === 'auto') && mode !== 'stem') {
      cur.options.push({ letter: letterOf(cur.options.length), text: bul[1].trim() });
      mode = 'options'; continue;
    }
    if (bul && cur && template === 'bullets' && mode === 'stem' && stemBuf.length) {
      cur.options.push({ letter: letterOf(cur.options.length), text: bul[1].trim() });
      mode = 'options'; continue;
    }
    const on = RX.optionNum.exec(t);
    if (on && cur && mode === 'options') { cur.options.push({ letter: letterOf(cur.options.length), text: on[2].trim() }); continue; }

    if (cur && mode === 'stem') { stemBuf.push(t); continue; }
    if (cur && mode === 'options' && cur.options.length) {
      // continuation of the last option (wrapped text, or text that landed
      // on the line after a lone option letter)
      const last = cur.options[cur.options.length - 1];
      last.text = last.text ? last.text + ' ' + t : t;
      continue;
    }
    if (!cur && t.length > 25 && /\?$|:$/.test(t) && template !== 'table') {
      startQ('', t, L.n); continue;
    }
    if (!cur) unresolved.push({ line: L.n, text: t.slice(0, 160) });
  }
  flush();

  // Separate answer key ("1. A  2. C 3. B") anywhere in the document.
  const keyMap = harvestAnswerKey(text);
  candidates.forEach(c => {
    c.conf.options = c.options.length >= 2 ? (c.weakOptions ? 0.6 : 0.92) : 0.2;
    if (!c.answerLetter && c.originalNumber && keyMap[c.originalNumber]) {
      c.answerLetter = keyMap[c.originalNumber];
      c.answerFromKey = true;
      c.conf.answer = 0.8;
    }
  });
  return { candidates, unresolved, keyMap };
}

function harvestAnswerKey(text) {
  const map = {};
  // A header on its own line ("Answer key") followed by the pairs…
  const block = /(?:^|\n)[ \t]*(?:answer\s*key|answers|solutions|key|correct\s*answers)[ \t]*[:\-–]?[ \t]*\n([\s\S]{0,8000})/i.exec(text);
  // …or the pairs stated inline after the label ("Answers: 1-B, 2-C, 3-A").
  const inline = /answers?\s*[:\-–]\s*((?:\s*(?:q\.?\s*)?\d{1,4}\s*[.):\-=]?\s*[a-hA-H]\b[,;\s]*){2,})/i.exec(text);
  const hunt = (block ? block[1] : '') + '\n' + (inline ? inline[1] : '');
  if (!hunt.trim()) return map;
  let m; RX.keyPair.lastIndex = 0;
  while ((m = RX.keyPair.exec(hunt))) map[m[1]] = m[2].toUpperCase();
  return map;
}

function tableRowToCandidate(cells, lineNo) {
  const nonEmpty = cells.filter(Boolean);
  if (nonEmpty.length < 4) return null;
  if (/^(question|stem|q\b)/i.test(cells[0]) && /^(a|option\s*a)$/i.test((cells[1] || '').trim())) return null; // header row
  let stem = cells[0], rest = cells.slice(1);
  let ans = '', expl = '';
  // Trailing answer/explanation columns
  for (let i = rest.length - 1; i >= 0; i--) {
    const v = (rest[i] || '').trim();
    if (!v) continue;
    if (!ans && /^[a-hA-H]$/.test(v)) { ans = v.toUpperCase(); rest = rest.slice(0, i).concat(rest.slice(i + 1)); break; }
  }
  if (rest.length > 4) { expl = rest.slice(4).filter(Boolean).join(' '); rest = rest.slice(0, 4); }
  const options = rest.map((t, i) => ({ letter: letterOf(i), text: String(t || '').replace(/^\s*[\(\[]?[a-hA-H][\)\].:]\s*/, '').trim() })).filter(o => o.text);
  if (options.length < 2 || !stem) return null;
  return {
    line: lineNo, originalNumber: '', options, answerRaw: ans, answerLetter: ans, explanation: expl,
    stem: String(stem).replace(/^\s*\d{1,4}\s*[.)\]:]\s*/, '').trim(),
    conf: { stem: 0.85, options: 0.85, answer: ans ? 0.85 : 0, explanation: expl ? 0.8 : 0 }
  };
}

/* ---------- structured rows (CSV / XLSX) ---------- */
const COLUMN_ALIASES = {
  stem: ['question', 'stem', 'question text', 'questiontext', 'q', 'prompt'],
  a: ['a', 'option a', 'optiona', 'opt a', 'choice a'],
  b: ['b', 'option b', 'optionb', 'opt b', 'choice b'],
  c: ['c', 'option c', 'optionc', 'opt c', 'choice c'],
  d: ['d', 'option d', 'optiond', 'opt d', 'choice d'],
  e: ['e', 'option e', 'optione', 'choice e'],
  answer: ['answer', 'correct', 'correct answer', 'correctanswer', 'key', 'ans', 'correct option'],
  explanation: ['explanation', 'rationale', 'reason', 'solution', 'justification'],
  domain: ['domain', 'official domain', 'cisa domain', 'area'],
  topic: ['topic', 'subject'],
  subtopic: ['subtopic', 'sub topic', 'sub-topic'],
  module: ['module', 'source module'],
  chapter: ['chapter', 'source chapter'],
  section: ['section', 'source section'],
  difficulty: ['difficulty', 'level'],
  tags: ['tags', 'keywords'],
  originalNumber: ['no', 'no.', 'q no', 'qno', 'sr no', 'sl no', 'number', 'question number', 'srno'],
  externalId: ['id', 'external id', 'source id', 'ref', 'reference'],
  learningPoint: ['learning point', 'my learning point', 'note', 'personal note'],
  lockOptionOrder: ['lock option order', 'lock', 'fixed order']
};
function mapHeader(headerRow) {
  const map = {};
  headerRow.forEach((raw, i) => {
    const key = String(raw || '').trim().toLowerCase().replace(/[_\-]+/g, ' ').replace(/\s+/g, ' ');
    for (const field in COLUMN_ALIASES) {
      if (COLUMN_ALIASES[field].indexOf(key) >= 0 && map[field] === undefined) { map[field] = i; return; }
    }
  });
  return map;
}
function rowsToCandidates(rows) {
  if (!rows.length) return { candidates: [], unresolved: [], keyMap: {} };
  const map = mapHeader(rows[0]);
  const candidates = [], unresolved = [];
  if (map.stem === undefined) {
    // headerless: treat as tab-style table
    rows.forEach((r, i) => { const c = tableRowToCandidate(r.map(String), i + 1); if (c) candidates.push(c); else unresolved.push({ line: i + 1, text: r.join(' | ').slice(0, 160) }); });
    return { candidates, unresolved, keyMap: {} };
  }
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i], get = (f) => map[f] === undefined ? '' : String(r[map[f]] == null ? '' : r[map[f]]).trim();
    const stem = get('stem');
    if (!stem) { if (r.some(v => String(v).trim())) unresolved.push({ line: i + 1, text: r.join(' | ').slice(0, 160) }); continue; }
    const opts = [];
    ['a', 'b', 'c', 'd', 'e'].forEach((k, ix) => { const v = get(k); if (v) opts.push({ letter: letterOf(ix), text: v }); });
    const ansRaw = get('answer');
    let letter = '';
    const lm = /^[\(\[]?\s*([a-hA-H])\s*[\)\].:]?\s*$/.exec(ansRaw);
    if (lm) letter = lm[1].toUpperCase();
    else if (ansRaw) {
      const hit = opts.findIndex(o => normText(o.text) === normText(ansRaw));
      if (hit >= 0) letter = opts[hit].letter;
    }
    candidates.push({
      line: i + 1, originalNumber: get('originalNumber'), externalId: get('externalId'),
      stem, options: opts, answerRaw: ansRaw, answerLetter: letter,
      explanation: get('explanation'), learningPoint: get('learningPoint'),
      domainRaw: get('domain'), topic: get('topic'), subtopic: get('subtopic'),
      srcModule: get('module'), srcChapter: get('chapter'), srcSection: get('section'),
      difficulty: (get('difficulty') || '').toLowerCase(), tags: get('tags'),
      lockOptionOrder: /^(1|y|yes|true)$/i.test(get('lockOptionOrder')),
      conf: { stem: 1, options: opts.length >= 2 ? 1 : 0.2, answer: letter ? 1 : (ansRaw ? 0.5 : 0), explanation: get('explanation') ? 1 : 0 }
    });
  }
  return { candidates, unresolved, keyMap: {} };
}

function jsonToCandidates(json) {
  const arr = Array.isArray(json) ? json : (json && Array.isArray(json.questions) ? json.questions : null);
  if (!arr) throw new Error('JSON must be an array of questions, or an object with a "questions" array.');
  const candidates = [], unresolved = [];
  arr.forEach((o, i) => {
    const stem = o.stem || o.question || o.text || '';
    let opts = o.options || o.choices || [];
    if (!Array.isArray(opts)) opts = Object.keys(opts).map((k, ix) => ({ letter: k.toUpperCase() || letterOf(ix), text: opts[k] }));
    opts = opts.map((x, ix) => typeof x === 'string' ? { letter: letterOf(ix), text: x } : { letter: (x.letter || letterOf(ix)).toString().toUpperCase(), text: x.text || x.value || '', id: x.id });
    if (!stem || opts.length < 2) { unresolved.push({ line: i + 1, text: JSON.stringify(o).slice(0, 160) }); return; }
    let letter = '';
    const ansRaw = o.answer != null ? String(o.answer) : (o.correct != null ? String(o.correct) : '');
    if (/^[a-hA-H]$/.test(ansRaw)) letter = ansRaw.toUpperCase();
    else if (o.correctIndex != null) letter = letterOf(+o.correctIndex);
    else if (ansRaw) { const hit = opts.findIndex(x => normText(x.text) === normText(ansRaw)); if (hit >= 0) letter = opts[hit].letter; }
    candidates.push({
      line: i + 1, originalNumber: o.originalNumber || o.number || '', externalId: o.externalId || o.id || '',
      stem, options: opts, answerRaw: ansRaw, answerLetter: letter,
      explanation: o.explanation || o.rationale || '', learningPoint: o.learningPoint || '',
      domainRaw: o.domain || o.domainId || '', topic: o.topic || '', subtopic: o.subtopic || '',
      srcModule: o.module || o.srcModule || '', srcChapter: o.chapter || o.srcChapter || '', srcSection: o.section || '',
      difficulty: (o.difficulty || '').toLowerCase(), tags: Array.isArray(o.tags) ? o.tags.join(',') : (o.tags || ''),
      lockOptionOrder: !!o.lockOptionOrder,
      conf: { stem: 1, options: 1, answer: letter ? 1 : (ansRaw ? 0.5 : 0), explanation: o.explanation ? 1 : 0 }
    });
  });
  return { candidates, unresolved, keyMap: {} };
}

/* ---------- candidate → question record ---------- */
const FIXED_ORDER_RX = /\b(all of the above|none of the above|both a and b|a and b only|option [a-h]\b|options? [a-h] and|first option|last option|above options)\b/i;

function autoLockOrder(stem, options) {
  if (FIXED_ORDER_RX.test(stem)) return true;
  return options.some(o => FIXED_ORDER_RX.test(o.text));
}
function suggestDomain(course, text) {
  const hints = course.hints || {};
  const t = ' ' + normText(text) + ' ';
  let best = null, bestScore = 0;
  for (const dom in hints) {
    let s = 0;
    hints[dom].forEach(k => { if (t.indexOf(k) >= 0) s += 1 + k.length / 40; });
    if (s > bestScore) { bestScore = s; best = dom; }
  }
  return bestScore >= 1.5 ? { domainId: best, score: bestScore } : { domainId: null, score: 0 };
}
function resolveDomain(course, raw) {
  if (!raw) return null;
  const s = String(raw).trim();
  const bp = course.blueprint || [];
  let d = bp.find(x => x.id.toLowerCase() === s.toLowerCase());
  if (d) return d.id;
  const m = /^(?:domain\s*)?(\d)\b/i.exec(s);
  if (m && bp[+m[1] - 1]) return bp[+m[1] - 1].id;
  d = bp.find(x => normText(x.name) === normText(s));
  if (d) return d.id;
  d = bp.find(x => normText(x.name).indexOf(normText(s)) >= 0 || normText(s).indexOf(normText(x.name)) >= 0);
  return d ? d.id : null;
}

function candidateToQuestion(c, ctx) {
  const q = blankQuestion(ctx.courseId);
  q.stem = String(c.stem || '').trim();
  q.options = (c.options || []).map(o => makeOption(o.text));
  q.explanation = (c.explanation || '').trim();
  q.learningPoint = (c.learningPoint || '').trim();
  q.originalNumber = c.originalNumber || '';
  q.externalId = c.externalId || '';
  q.difficulty = DIFFICULTY.indexOf(c.difficulty) >= 0 ? c.difficulty : 'medium';
  q.topic = c.topic || ctx.topic || '';
  q.subtopic = c.subtopic || '';
  q.srcModule = c.srcModule || ctx.srcModule || '';
  q.srcChapter = c.srcChapter || ctx.srcChapter || '';
  q.srcSection = c.srcSection || '';
  q.tags = (c.tags ? String(c.tags).split(/[,;]/).map(s => s.trim()).filter(Boolean) : []);
  q.sourceId = ctx.sourceId;
  q.batchId = ctx.batchId;
  q.importedAt = nowISO();
  q.locator = c.line ? ('line ' + c.line) : '';
  q.sourceRefs = [{ sourceId: ctx.sourceId, sourceTitle: ctx.sourceTitle, filename: ctx.filename, locator: q.locator, originalNumber: q.originalNumber, importedAt: q.importedAt }];
  q.lockOptionOrder = !!c.lockOptionOrder || autoLockOrder(q.stem, q.options);

  // correct answer, resolved against stable option IDs
  if (c.answerLetter) {
    const ix = LETTERS.indexOf(c.answerLetter.toUpperCase());
    const byLetter = (c.options || []).findIndex(o => (o.letter || '').toUpperCase() === c.answerLetter.toUpperCase());
    const target = byLetter >= 0 ? byLetter : ix;
    if (target >= 0 && q.options[target]) q.correctOptionId = q.options[target].id;
  }
  if (!q.correctOptionId && c.answerRaw) {
    const hit = q.options.findIndex(o => normText(o.text) === normText(c.answerRaw));
    if (hit >= 0) q.correctOptionId = q.options[hit].id;
  }
  // classification
  const rd = resolveDomain(ctx.course, c.domainRaw);
  if (rd) { q.domainId = rd; q.classVerified = 'unverified'; }
  else if (ctx.defaultDomainId) { q.domainId = ctx.defaultDomainId; }
  else {
    const sug = suggestDomain(ctx.course, q.stem + ' ' + q.options.map(o => o.text).join(' '));
    q.domainId = sug.domainId; q.domainSuggested = !!sug.domainId;
  }
  // status
  q.parseConf = c.conf || {};
  if (q.options.length < 2) q.status = 'parsing';
  else if (!q.correctOptionId) q.status = 'needs_answer';
  else if (!q.domainId) q.status = 'needs_class';
  else if ((c.conf && c.conf.options < 0.7) || (c.conf && c.conf.stem < 0.7)) q.status = 'needs_content';
  else q.status = 'draft';
  if (q.correctOptionId && c.conf && c.conf.answer >= 0.8 && ctx.trustSourceAnswers) {
    q.answerVerified = 'verified'; q.verifiedAt = nowISO(); q.verifyNote = 'Answer stated by source';
  }
  return q;
}


/* ============================================================================
   06 · Learning logic — mastery, spaced repetition, weakness, selection.
   Every score is decomposed so the reason for it is always inspectable.
   ========================================================================== */

const confWeight = (k) => { const c = CONFIDENCE.find(x => x.k === k); return c ? c.weight : 0.5; };

/**
 * Mastery 0–100 from named components. Repeating the same question quickly
 * cannot inflate it: recency and spacing are separate, capped components.
 */
function masteryOf(q, attempts) {
  const a = (attempts || []).slice().sort((x, y) => new Date(x.ts) - new Date(y.ts));
  const parts = [];
  const add = (key, label, value, max, note) => parts.push({ key, label, value: Math.round(value * 10) / 10, max, note });
  if (!a.length) return { score: 0, parts: [{ key: 'none', label: 'Never attempted', value: 0, max: 100, note: 'No evidence yet' }] };

  const first = a[0];
  add('first', 'First-attempt result', first.correct ? 22 : 0, 22, first.correct ? 'Answered correctly first time' : 'Missed on first sight');

  const recent = a.slice(-5);
  const recAcc = recent.filter(x => x.correct).length / recent.length;
  add('recent', 'Recent accuracy (last ' + recent.length + ')', recAcc * 24, 24, Math.round(recAcc * 100) + '% of recent attempts correct');

  let streak = 0;
  for (let i = a.length - 1; i >= 0; i--) { if (a[i].correct) streak++; else break; }
  add('streak', 'Consecutive correct', Math.min(streak, 3) / 3 * 14, 14, streak + ' in a row');

  const cw = recent.reduce((s, x) => s + (x.correct ? confWeight(x.confidence) : 0), 0) / recent.length;
  add('confidence', 'Answer quality', cw * 20, 20, cw >= 0.8 ? 'Answered from knowledge' : cw >= 0.45 ? 'Reasoned or unsure' : 'Mostly guessing');

  const guessed = a.filter(x => x.correct && x.confidence === 'guessed').length;
  const gPen = -Math.min(12, guessed * 6);
  if (guessed) add('guessed', 'Guessed-correct penalty', gPen, 0, guessed + ' correct answer(s) marked as a guess');

  // Retention: spacing between the last two correct answers, capped.
  let space = 0;
  const corr = a.filter(x => x.correct);
  if (corr.length >= 2) {
    const gap = (new Date(corr[corr.length - 1].ts) - new Date(corr[corr.length - 2].ts)) / 86400000;
    space = clamp(gap / 14, 0, 1) * 20;
  }
  add('retention', 'Retention over time', space, 20, corr.length >= 2 ? 'Held across a ' + Math.round((new Date(corr[corr.length - 1].ts) - new Date(corr[corr.length - 2].ts)) / 86400000) + '-day gap' : 'Needs a second correct answer after a gap');

  const score = clamp(parts.reduce((s, p) => s + p.value, 0), 0, 100);
  return { score: Math.round(score), parts };
}

/** Transparent interval ladder; every branch is named in the UI. */
function scheduleNext(correct, confidence, srStage, cfg) {
  const I = cfg || Settings.get('srIntervals');
  let days, reason, stage = srStage || 0;
  if (!correct) { days = I.wrong; stage = 0; reason = 'Incorrect → back to ' + days + ' day'; }
  else if (confidence === 'guessed') { days = I.guessed; stage = 0; reason = 'Correct but guessed → treated as not known'; }
  else if (confidence === 'unsure') { days = I.lowConf; stage = Math.max(1, stage); reason = 'Correct but unsure → short interval'; }
  else if (confidence === 'reasoned') { days = I.medConf; stage = Math.max(2, stage); reason = 'Reasoned out → medium interval'; }
  else if (confidence == null) {
    // A timed mock asks for no confidence, so there is no evidence you knew
    // it rather than guessed well. Advancing the ladder here would push a
    // lucky answer out for a fortnight. Hold the stage and review sooner.
    days = I.unknown != null ? I.unknown : I.lowConf;
    reason = 'Correct in a mock, where no confidence was recorded → held for a short interval';
  }
  else {
    stage = stage + 1;
    const ladder = I.ladder || [14, 30, 60, 90];
    days = stage <= 1 ? I.highConf : (ladder[Math.min(stage - 1, ladder.length - 1)]);
    reason = 'Confident and correct → extended to ' + days + ' days';
  }
  return { days, stage, at: addDays(days), reason };
}

/** Apply an attempt to the question's rolling statistics. */
function applyAttempt(q, att) {
  const s = q.stats;
  s.attempts++;
  if (att.correct) { s.correct++; s.streak++; s.wrongStreak = 0; if (att.confidence === 'guessed') s.guessedCorrect++; }
  else { s.incorrect++; s.wrongStreak++; s.streak = 0; s.lastMistake = att.mistake || null; }
  if (s.firstResult == null) s.firstResult = att.correct ? 'correct' : 'incorrect';
  s.lastResult = att.correct ? 'correct' : 'incorrect';
  s.lastAttemptAt = att.ts;
  s.avgMs = s.attempts === 1 ? att.ms : Math.round((s.avgMs * (s.attempts - 1) + att.ms) / s.attempts);
  s.confidence = confWeight(att.confidence);
  if (att.scheduleSR !== false) {
    const sch = scheduleNext(att.correct, att.confidence, q.srStage);
    q.srStage = sch.stage; q.nextReviewAt = sch.at; q.srReason = sch.reason;
  }
  return q;
}

/* ---------- topic / domain weakness ---------- */
function groupStats(list, keyFn) {
  const map = new Map();
  list.forEach(q => {
    const k = keyFn(q) || '—';
    if (!map.has(k)) map.set(k, { key: k, total: 0, attempted: 0, firstCorrect: 0, firstSeen: 0, correct: 0, attempts: 0, guessedCorrect: 0, mastery: 0, lowConf: 0, due: 0 });
    const g = map.get(k);
    g.total++;
    if (q.stats.attempts) {
      g.attempted++; g.attempts += q.stats.attempts; g.correct += q.stats.correct;
      g.guessedCorrect += q.stats.guessedCorrect;
      g.firstSeen++; if (q.stats.firstResult === 'correct') g.firstCorrect++;
      g.mastery += q.stats.mastery || 0;
      if ((q.stats.confidence || 0) < 0.5) g.lowConf++;
    }
    if (q.nextReviewAt && new Date(q.nextReviewAt) <= new Date()) g.due++;
  });
  return Array.from(map.values()).map(g => {
    g.firstAcc = g.firstSeen ? g.firstCorrect / g.firstSeen : null;
    g.acc = g.attempts ? g.correct / g.attempts : null;
    g.guessRate = g.correct ? g.guessedCorrect / g.correct : 0;
    g.avgMastery = g.attempted ? g.mastery / g.attempted : 0;
    g.coverage = g.total ? g.attempted / g.total : 0;
    return g;
  });
}
function weaknessScore(g, minSample) {
  if (g.attempted < (minSample || 5)) return { score: null, why: ['Insufficient evidence — only ' + g.attempted + ' question(s) attempted'] };
  const why = [];
  let s = 0;
  if (g.firstAcc != null && g.firstAcc < 0.7) { s += (0.7 - g.firstAcc) * 120; why.push('First-attempt accuracy ' + Math.round(g.firstAcc * 100) + '%'); }
  if (g.acc != null && g.acc < 0.75) { s += (0.75 - g.acc) * 90; why.push('Overall accuracy ' + Math.round(g.acc * 100) + '%'); }
  if (g.guessRate > 0.2) { s += g.guessRate * 60; why.push(Math.round(g.guessRate * 100) + '% of correct answers were guesses'); }
  if (g.lowConf > 0) { s += Math.min(20, g.lowConf * 4); why.push(g.lowConf + ' question(s) answered with low confidence'); }
  if (g.due > 0) { s += Math.min(25, g.due * 3); why.push(g.due + ' item(s) overdue for review'); }
  if (g.avgMastery < 60) { s += (60 - g.avgMastery) * 0.5; why.push('Average mastery ' + Math.round(g.avgMastery)); }
  if (!why.length) why.push('No weakness signals');
  return { score: Math.round(s), why };
}

/* ---------- selection ---------- */
function eligiblePool(all) { return all.filter(isPracticeEligible); }

function applyFilters(pool, f) {
  const now = new Date();
  return pool.filter(q => {
    if (f.domains && f.domains.length && f.domains.indexOf(q.domainId) < 0) return false;
    if (f.topics && f.topics.length && f.topics.indexOf(q.topic || '—') < 0) return false;
    if (f.sources && f.sources.length && f.sources.indexOf(q.sourceId) < 0) return false;
    if (f.modules && f.modules.length && f.modules.indexOf(q.srcModule || '—') < 0) return false;
    if (f.batches && f.batches.length && f.batches.indexOf(q.batchId) < 0) return false;
    if (f.difficulty && f.difficulty.length && f.difficulty.indexOf(q.difficulty) < 0) return false;
    if (f.neverAttempted && q.stats.attempts > 0) return false;
    if (f.attemptedOnly && q.stats.attempts === 0) return false;
    if (f.incorrect && !(q.stats.incorrect > 0 || q.stats.lastResult === 'incorrect')) return false;
    if (f.guessed && !(q.stats.guessedCorrect > 0)) return false;
    if (f.lowConfidence && !(q.stats.attempts > 0 && (q.stats.confidence || 1) < 0.5)) return false;
    if (f.flagged && !q.flagged) return false;
    if (f.due && !(q.nextReviewAt && new Date(q.nextReviewAt) <= now)) return false;
    if (f.notMastered && (q.stats.mastery || 0) >= (f.masteryTarget || 75)) return false;
    if (f.minAttempts != null && q.stats.attempts < f.minAttempts) return false;
    if (f.maxAttempts != null && q.stats.attempts > f.maxAttempts) return false;
    if (f.sinceDays) { const cut = new Date(Date.now() - f.sinceDays * 86400000); if (!q.stats.lastAttemptAt || new Date(q.stats.lastAttemptAt) < cut) return false; }
    return true;
  });
}

/** Domain-weighted selection with transparent rounding (largest remainder). */
function weightedPick(pool, blueprint, count, rng) {
  const byDom = new Map();
  blueprint.forEach(d => byDom.set(d.id, []));
  byDom.set(null, []);
  pool.forEach(q => { const k = byDom.has(q.domainId) ? q.domainId : null; byDom.get(k).push(q); });
  const totalW = blueprint.reduce((s, d) => s + (d.weight || 0), 0) || 1;
  const raw = blueprint.map(d => ({ id: d.id, want: count * (d.weight || 0) / totalW }));
  const alloc = raw.map(r => ({ id: r.id, n: Math.floor(r.want), frac: r.want - Math.floor(r.want) }));
  let left = count - alloc.reduce((s, a) => s + a.n, 0);
  alloc.slice().sort((a, b) => b.frac - a.frac).forEach(a => { if (left > 0) { a.n++; left--; } });
  const notes = [];
  let picked = [];
  const shortfalls = [];
  alloc.forEach(a => {
    const bucket = shuffle(byDom.get(a.id) || [], rng);
    const take = bucket.slice(0, a.n);
    picked = picked.concat(take);
    if (take.length < a.n) shortfalls.push({ id: a.id, want: a.n, got: take.length });
    notes.push({ domainId: a.id, requested: a.n, supplied: take.length });
  });
  if (picked.length < count) {
    const used = new Set(picked.map(q => q.uuid));
    const rest = shuffle(pool.filter(q => !used.has(q.uuid)), rng);
    picked = picked.concat(rest.slice(0, count - picked.length));
  }
  return { questions: shuffle(picked, rng).slice(0, count), notes, shortfalls };
}

function weakFirstPick(pool, count, rng, minSample) {
  const byTopic = groupStats(pool, q => q.topic || State.domainName(q.domainId));
  const w = new Map();
  byTopic.forEach(g => { const ws = weaknessScore(g, minSample); w.set(g.key, ws.score == null ? -1 : ws.score); });
  const scored = pool.map(q => {
    const key = q.topic || State.domainName(q.domainId);
    let s = (w.get(key) || 0);
    if (q.stats.lastResult === 'incorrect') s += 60;
    if (q.stats.guessedCorrect > 0) s += 35;
    if (q.stats.wrongStreak > 1) s += 25;
    if (q.nextReviewAt && new Date(q.nextReviewAt) <= new Date()) s += 40;
    if (q.stats.attempts === 0) s += 12;
    if ((q.stats.mastery || 0) < 50) s += (50 - (q.stats.mastery || 0)) * 0.6;
    return { q, s: s + rng() * 8 };
  }).sort((a, b) => b.s - a.s);
  return scored.slice(0, count).map(x => x.q);
}


/* ============================================================================
   07 · Session engine — deterministic order, autosave, resume, scoring
   ========================================================================== */

const MODES = {
  learning: { label: 'Learning', reveal: true, confidence: true, desc: 'One at a time, answer revealed after each response.' },
  domain:   { label: 'Domain drill', reveal: true, confidence: true, desc: 'Focus on chosen domains of the blueprint.' },
  weak:     { label: 'Weak topics', reveal: true, confidence: true, desc: 'Prioritises where the evidence says you are weak.' },
  redo:     { label: 'Incorrect & guessed', reveal: true, confidence: true, desc: 'Everything you missed, guessed or flagged.' },
  mixed:    { label: 'Mixed revision', reveal: true, confidence: true, desc: 'Across the whole bank, optionally exam-weighted.' },
  mock:     { label: 'Timed mock exam', reveal: false, confidence: false, desc: 'Full length, timed, no confidence asked, nothing revealed until you submit.' },
  spaced:   { label: 'Spaced repetition', reveal: true, confidence: true, desc: 'Whatever has fallen due today, from every mode you have practised.' },
  custom:   { label: 'Custom practice', reveal: true, confidence: true, desc: 'Your own filter combination, savable as a preset.' }
};

const Session = {
  async create(mode, config) {
    const all = await State.questions();
    const pool0 = eligiblePool(all);
    const seed = config.seed || newSeed();
    const rng = mulberry32(seed);
    let filtered = applyFilters(pool0, config.filters || {});
    const wanted = Math.max(1, config.count || 20);
    let chosen, notes = [], shortfalls = [];

    if (mode === 'mock' || (config.weighted && filtered.length)) {
      const r = weightedPick(filtered, State.course.blueprint, wanted, rng);
      chosen = r.questions; notes = r.notes; shortfalls = r.shortfalls;
    } else if (mode === 'weak') {
      chosen = weakFirstPick(filtered, wanted, rng, Settings.get('weakMinSample'));
    } else {
      chosen = shuffle(filtered, rng).slice(0, wanted);
    }
    if (!chosen.length) {
      const reason = pool0.length === 0
        ? 'No question in this course is Active with a verified answer yet. Confirm them on the Needs Checking screen first.'
        : 'No question matches those filters. ' + pool0.length + ' question(s) are eligible in total.';
      throw new Error(reason);
    }
    const shuffleOpts = Settings.get('shuffleOptions');
    const optionOrders = {};
    chosen.forEach(q => {
      const ids = q.options.map(o => o.id);
      optionOrders[q.uuid] = (shuffleOpts && !q.lockOptionOrder) ? shuffle(ids, rng) : ids;
    });
    const s = {
      id: uuid(), courseId: State.course.id, mode, seed,
      config: JSON.parse(JSON.stringify(config)),
      questionUuids: chosen.map(q => q.uuid),
      optionOrders, responses: {}, flags: {}, cursor: 0,
      startedAt: nowISO(), endedAt: null, status: 'active',
      timeLimitMs: mode === 'mock' ? (config.minutes || Settings.get('mockMinutes')) * 60000 : null,
      elapsedMs: 0, lastTickAt: Date.now(),
      selectionNotes: notes, shortfalls,
      poolSize: filtered.length, eligibleTotal: pool0.length
    };
    await DB.put('sessions', s);
    await audit('create', 'session', s.id, null, { mode, count: chosen.length, seed }, '');
    return s;
  },
  async save(s) { s.updatedAt = nowISO(); await DB.put('sessions', s); },
  async resumeLatest(courseId) {
    const rows = await DB.byIndex('sessions', 'courseId', courseId);
    return rows.filter(s => s.status === 'active').sort((a, b) => new Date(b.startedAt) - new Date(a.startedAt))[0] || null;
  },
  /** Record one response. Scoring always compares stable option IDs. */
  async answer(s, q, selectedOptionId, meta) {
    const already = s.responses[q.uuid];
    const correct = selectedOptionId === q.correctOptionId;
    const rec = {
      selectedOptionId, correct, ms: meta.ms || 0,
      confidence: meta.confidence || null, mistake: meta.mistake || null,
      note: meta.note || '', at: nowISO(), qVersion: q.version
    };
    s.responses[q.uuid] = rec;
    await this.save(s);
    if (!already && MODES[s.mode].reveal) await this.commit(s, q, rec);
    return rec;
  },
  /** Persist the attempt and update rolling stats. Attempts are never overwritten. */
  async commit(s, q, rec) {
    const att = {
      questionUuid: q.uuid, qid: q.qid, sessionId: s.id, courseId: s.courseId, mode: s.mode,
      ts: rec.at, selectedOptionId: rec.selectedOptionId, correctOptionId: q.correctOptionId,
      correct: rec.correct, confidence: rec.confidence, ms: rec.ms,
      displayedOrder: (s.optionOrders[q.uuid] || []).slice(),
      mistake: rec.mistake || null, flagged: !!s.flags[q.uuid], note: rec.note || '',
      questionVersion: q.version
    };
    await DB.put('attempts', att);
    const fresh = await Questions.get(q.uuid);
    applyAttempt(fresh, att);
    const hist = await DB.byIndex('attempts', 'questionUuid', q.uuid);
    fresh.stats.mastery = masteryOf(fresh, hist).score;
    fresh.flagged = !!s.flags[q.uuid] || fresh.flagged;
    if (rec.note) fresh.learningPoint = rec.note;
    await DB.put('questions', fresh);
    State.invalidate();
    return att;
  },
  async finish(s) {
    const all = await State.questions();
    const byId = new Map(all.map(q => [q.uuid, q]));
    if (!MODES[s.mode].reveal) {
      for (const uid of s.questionUuids) {
        const rec = s.responses[uid];
        if (rec && !rec.committed) { await this.commit(s, byId.get(uid), rec); rec.committed = true; }
      }
    }
    s.status = 'complete'; s.endedAt = nowISO();
    await this.save(s);
    await audit('edit', 'session', s.id, null, { status: 'complete' }, '');
    // A finished session is a natural checkpoint: fold the journal into a
    // clean snapshot so the file on disk stands alone.
    if (typeof FileStore !== 'undefined' && FileStore.connected) FileStore.flushNow('snapshot');
    if (typeof DriveSync !== 'undefined' && DriveSync.connected) DriveSync.maybePush(true);
    return s;
  },
  async abandon(s) { s.status = 'abandoned'; s.endedAt = nowISO(); await this.save(s); }
};

function sessionScore(s, byId) {
  const answered = s.questionUuids.filter(u => s.responses[u]);
  const correct = answered.filter(u => s.responses[u].correct);
  const byDomain = new Map();
  s.questionUuids.forEach(u => {
    const q = byId.get(u); if (!q) return;
    const k = q.domainId || 'unmapped';
    if (!byDomain.has(k)) byDomain.set(k, { total: 0, answered: 0, correct: 0 });
    const g = byDomain.get(k); g.total++;
    if (s.responses[u]) { g.answered++; if (s.responses[u].correct) g.correct++; }
  });
  const times = answered.map(u => s.responses[u].ms).filter(Boolean);
  return {
    total: s.questionUuids.length, answered: answered.length, correct: correct.length,
    accuracy: answered.length ? correct.length / answered.length : 0,
    byDomain, avgMs: times.length ? times.reduce((a, b) => a + b, 0) / times.length : 0,
    guessedCorrect: answered.filter(u => s.responses[u].correct && s.responses[u].confidence === 'guessed').length,
    flagged: Object.keys(s.flags || {}).filter(k => s.flags[k]).length
  };
}

function systemPrefersDark() {
  return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
}
/** Resolve the stored preference — 'light', 'dark' or 'system' — to a theme. */
function resolveTheme(pref) {
  const p = pref || Settings.get('theme') || 'light';
  if (p === 'system') return systemPrefersDark() ? 'dark' : 'light';
  return p === 'dark' ? 'dark' : 'light';
}
function applyTheme(pref) {
  document.documentElement.dataset.theme = resolveTheme(pref);
  const b = $('#themeBtn');
  if (b) {
    const p = Settings.get('theme') || 'light';
    b.textContent = p === 'system' ? 'Auto' : (p === 'dark' ? 'Dark' : 'Light');
    b.title = 'Appearance: ' + (p === 'system' ? 'following your system setting' : p) + ' — click to change';
  }
}
/** Cycles Light → Dark → Auto, so the current state is always readable. */
async function toggleTheme() {
  const order = ['light', 'dark', 'system'];
  const cur = Settings.get('theme') || 'light';
  const next = order[(order.indexOf(cur) + 1) % order.length];
  await Settings.set('theme', next);
  applyTheme(next);
  toast('Appearance: ' + (next === 'system' ? 'following your system setting' : next), 'info', 2200);
}

const ROUTES = {};
async function go(view, arg) {
  if (State.session && State.session.status === 'active' && view !== 'runner') {
    // Route through the exact same confirm-and-clean-up the runner's own
    // Exit/Pause button uses (State.runnerStop is runSession()'s
    // leaveGuarded), rather than a second, differently-worded confirm here
    // that used to skip the real-time gap stamp, the save, and clearing
    // State.session — which made this same guard re-fire on every later
    // nav click forever, and let a non-pausable mock's timer effectively
    // freeze for free while "away".
    if (State.runnerStop) {
      const left = await State.runnerStop();
      if (!left) return;
    }
  }
  State.view = view;
  $$('.nav-item').forEach(b => b.setAttribute('aria-current', b.dataset.view === view ? 'page' : 'false'));
  closeMobileNav();
  const target = $('#view');
  if (!target) return;   // the shell has not rendered yet; nothing to draw into
  target.textContent = '';

  try {

  }
  refreshBadges();
