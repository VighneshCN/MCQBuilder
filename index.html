        method: 'DELETE', headers: { 'Authorization': 'Bearer ' + this.accessToken }
      });
      return res.ok || res.status === 404;
    } catch (e) { return false; }
  },

  async _applyRemote(payload) {
    const names = syncStores();
    for (const s of names) {
      const rows = Array.isArray(payload.stores[s]) ? payload.stores[s] : [];
      await DB.clearRaw(s);
      if (rows.length) await DB.putManyRaw(s, rows);
    }
    FileStore._cache = null;
    State.invalidate();
    this._pendingChange = false; this._firstUnpushedChangeAt = null;
    this._remoteQuestionCount = (payload.stores.questions || []).length;
    await FileStore.setMeta('driveQuestionCount', this._remoteQuestionCount);
    await FileStore.delMeta('driveDirtySince');
    toast('Loaded the Drive copy.', 'ok');
    if (typeof State !== 'undefined' && State.view) await go(State.view);
  },

  /** A manual pull, for "I answered questions on my phone, catch this
      browser up" — offered from Settings, always asks first since it can
      discard unsynced local changes. Boot-time catching-up happens on its
      own now (see init()); this is for forcing it early. */
  async pullNow() {
    let remote;
    try { remote = await this.pull(); }
    catch (e) { toast('Could not reach Google Drive: ' + e.message, 'bad'); return; }
    const localCount = (await DB.all('questions')).length;
    const remoteCount = (remote.stores.questions || []).length;
    const ok = await confirmBox('Load the Drive copy?',
      'Drive holds ' + remoteCount + ' question(s), saved ' + fmtDate(remote.savedAt, true) + '. This replaces what is in this browser (' + localCount + ' question(s)) with that copy. A safety backup of what is in this browser is taken first, automatically.', true, 'Load');
    if (ok && (await requireSafetyBackup('loading the Drive copy over this browser’s bank'))) {
      await this._applyRemote(remote); await this._recordSyncedStamp();
    }
  },

  /** A one-off "sync with Drive" while a local folder stays the persistent
      connection — offered from Settings alongside it, not instead of it.
      Pulls whatever is on Drive, merges it with what is here, writes the
      merged bank back to both the local file and Drive, then leaves Drive
      exactly as disconnected as it was before this call. Distinct from
      connect(): this never makes Drive the active backend, and never
      disconnects the folder. */
  async syncBridge() {
    // A double-click (easy on a touchscreen, or while waiting for the
    // Google popup) would otherwise race two calls' save/restore of
    // this.connected below, and the loser could leave it stuck true —
    // silently turning on background pushes to Drive with the local
    // folder still shown as the active connection. One flag makes a
    // second call while one is already running a harmless no-op instead.
    if (this._bridging) { toast('Already syncing with Drive — please wait for it to finish.', 'info'); return; }
    this._bridging = true;
    try {
      await this._syncBridgeRun();
    } finally {
      this._bridging = false;
    }
  },

  async _syncBridgeRun() {
    const clientId = effectiveDriveClientId();
    if (!clientId) {
      await modal({ title: 'Add a Google OAuth client ID first', body: h('p', {}, 'Settings → "Where your data lives" has the one-time setup steps — about ten minutes, free, and only you can do it (it needs your own Google account).') });
      return;
    }
    if (!this.hasLiveToken()) {
      try { await this._loadGis(); await this._requestToken(false); }
      catch (e) { toast('Could not sign in to Google: ' + e.message, 'bad', 8000); return; }
    }
    // pull()/push() both require this.connected — flip it only for the
    // duration of this call. The local folder, not Drive, is the real
    // persistent connection throughout; nothing here changes FileStore.
    const wasConnected = this.connected;
    this.connected = true;
    try {
      let fileId = this.fileId || await FileStore.meta('driveFileId');
      try {
        if (!fileId) fileId = (await this._findExisting()) || (await this._createFile());
      } catch (e) {
        toast('Could not reach Google Drive: ' + (e.message || e), 'bad', 8000);
        return;
      }
      this.fileId = fileId;

      let remote;
      try { remote = await this.pull(); }
      catch (e) { toast('Could not reach Google Drive: ' + e.message, 'bad'); return; }

      if (!(remote.stores.questions || []).length) {
        // Nothing on Drive yet — this is a first push, not a merge.
        const ok = await this.push();
        toast(ok ? 'Pushed your bank to Google Drive.' : ('Could not sync — ' + (this.problem || 'unknown error')), ok ? 'ok' : 'bad');
        return;
      }
      if (!(await requireSafetyBackup('merging this browser’s bank with Google Drive'))) return;
      const localPayload = await FileStore.buildPayload();
      const { merged, report } = await mergeBankPayloads(localPayload, remote);
      await applyMergedBank(merged);
      await FileStore.flushNow();
      const pushOk = await this.push();
      await showMergeReport(report, 'Synced with Google Drive', pushOk
        ? 'Both copies were combined, written to your file, and pushed to Drive — all three now match.'
        : 'Both copies were combined and written to your file, but pushing to Drive failed: ' + (this.problem || 'unknown error') + '. Try Sync again once that is fixed.');
    } finally {
      clearTimeout(this._debounceTimer);
      this.connected = wasConnected;
      updateStorageBar();
    }
  },

  status() {
    if (!this.connected) return this.setupError ? { tone: 'bad', label: 'Drive: ' + this.setupError } : null;
    if (this.problem) return { tone: 'bad', label: this.problem };
    if (this._pendingChange) return { tone: 'ok', label: 'Drive: syncing…' };
    return { tone: 'ok', label: this.lastPushedAt ? 'Drive synced ' + fmtDate(this.lastPushedAt, true) : 'Drive connected — syncing…' };
  }
};

/* ============================================================================
   Course notes — your own revision material (a scanned handwritten module
   summary, anything worth a quick look right before a practice session)
   stored the same way your question bank is: the actual bytes live wherever
   that already lives — a "notes" subfolder next to your connected folder, or
   its own file in Drive when that is connected — never duplicated into
   IndexedDB on top of that, so this cannot make the app itself heavier. Only
   with neither connected does a note's content sit in IndexedDB directly,
   capped in size — the same trade-off images already make. ========================================================================== */

const NOTES_SUBFOLDER = 'notes';
const NOTES_ACCEPT = '.pdf,.png,.jpg,.jpeg,.webp,.txt,.md,.html,.htm';

function blobToDataUrl(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(new Error('Could not read that file.'));
    r.readAsDataURL(blob);
  });
}

const NotesStore = {
  /** Where a new note's bytes would land right now, so the UI can say so
      before the person commits to uploading. Folder wins over Drive when
      both are connected — it is instant and needs no network round trip. */
  target() {
    if (FileStore.dirHandle) return 'folder';
    if (DriveSync.connected) return 'drive';
    return 'indexeddb';
  },

  async save(file, meta) {
    const target = this.target();
    const rec = {
      id: uuid(), courseId: meta.courseId, domainId: meta.domainId || null, topic: (meta.topic || '').trim(),
      title: (meta.title || file.name).trim(), filename: file.name, mimeType: file.type || 'application/octet-stream',
      sizeKB: Math.round(file.size / 1024), storage: target, folderFilename: null, driveFileId: null, content: null,
      createdAt: nowISO(), updatedAt: nowISO()
    };
    if (target === 'folder') {
      const dir = await FileStore.dirHandle.getDirectoryHandle(NOTES_SUBFOLDER, { create: true });
      const safe = rec.id + '-' + file.name.replace(/[\\/:*?"<>|]/g, '_');
      const fh = await dir.getFileHandle(safe, { create: true });
      const w = await fh.createWritable();
      await w.write(await file.arrayBuffer());
      await w.close();
      rec.folderFilename = safe;
    } else if (target === 'drive') {
      rec.driveFileId = await DriveSync.uploadNoteFile(file, rec.title);
    } else {
      const cap = Settings.get('notesMaxKB');
      if (rec.sizeKB > cap) throw new Error('That file is ' + rec.sizeKB + ' KB, above the ' + cap + ' KB limit for notes kept in the browser. Connect a folder or Google Drive (Settings) to store larger files.');
      rec.content = await blobToDataUrl(file);
    }
    await DB.put('notes', rec);
    return rec;
  },

  async readBlob(rec) {
    if (rec.storage === 'indexeddb') { const res = await fetch(rec.content); return await res.blob(); }
    if (rec.storage === 'folder') {
      if (!FileStore.dirHandle) throw new Error('Connect the same folder this note was saved in to open it.');
      const dir = await FileStore.dirHandle.getDirectoryHandle(NOTES_SUBFOLDER, { create: false });
      const fh = await dir.getFileHandle(rec.folderFilename, { create: false });
      return await fh.getFile();
    }
    if (rec.storage === 'drive') {
      if (!(await DriveSync._ensureToken())) throw new Error('Reconnect Google Drive to open this note.');
      const res = await fetch('https://www.googleapis.com/drive/v3/files/' + rec.driveFileId + '?alt=media', { headers: { 'Authorization': 'Bearer ' + DriveSync.accessToken } });
      if (!res.ok) throw new Error('Drive returned ' + res.status);
      return await res.blob();
    }
    throw new Error('This note has no readable storage location.');
  },

  /** Returns whether the underlying file was actually deleted: true if
      removed, false if the note has a separate file but it could not be
      reached or removeEntry/deleteDriveFile threw, null if there was never
      a separate file to begin with (IndexedDB-only storage). The DB record
      is always deleted regardless — that is what "this note exists" means
      to the app, so a file that could not be cleaned up (folder
      disconnected, Drive unreachable) still leaves the note correctly gone
      from here rather than stuck because of an orphaned file. */
  async remove(rec) {
    let fileDeleted = null;
    try {
      if (rec.storage === 'folder' && FileStore.dirHandle) {
        const dir = await FileStore.dirHandle.getDirectoryHandle(NOTES_SUBFOLDER, { create: false });
        await dir.removeEntry(rec.folderFilename);
        fileDeleted = true;
      } else if (rec.storage === 'drive' && DriveSync.connected) {
        await DriveSync.deleteDriveFile(rec.driveFileId);
        fileDeleted = true;
      } else if (rec.storage === 'folder' || rec.storage === 'drive') {
        fileDeleted = false;
      }
    } catch (e) { fileDeleted = false; }
    await DB.del('notes', rec.id);
    return fileDeleted;
  },

  async list(courseId) {
    return (await DB.byIndex('notes', 'courseId', courseId)).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  }
};

/** Notes stored in a folder or Drive keep their real bytes outside
    IndexedDB entirely — the ordinary bank backup (requireSafetyBackup)
    only ever preserves the notes STORE's metadata row, not the file
    itself, so it can't actually protect against removing one of these.
    Downloading a real copy of the file, the same way every other
    permanent-delete flow in this app takes a backup first, is what
    genuinely works for all three storage kinds uniformly. */
async function requireNoteBackup(rec) {
  toast('Backing up “' + rec.title + '” first…');
  try {
    const blob = await NotesStore.readBlob(rec);
    download(rec.filename || (rec.title + '.bin'), blob);
    const proceed = await modal({
      title: 'Backup saved',
      body: h('div', { class: 'stack' }, [
        h('div', { class: 'notice ok small' }, 'A copy of “' + rec.title + '” was downloaded (' + bytes(rec.sizeKB * 1024) + '). Check your downloads folder before continuing.'),
        h('p', { class: 'small muted' }, 'Removing it here is permanent — the copy just downloaded is the way back.')
      ]),
      actions: [{ label: 'Stop here', value: false }, { label: 'Continue', value: true, kind: 'primary' }]
    });
    return !!proceed;
  } catch (e) {
    const proceed = await modal({
      title: 'Could not back up this note',
      body: h('div', { class: 'stack' }, [
        h('div', { class: 'notice bad' }, e.message || String(e)),
        h('p', {}, 'Nothing has been deleted. Removing it now would leave no way back to it.'),
        h('p', { class: 'small muted' }, 'The safe course is to stop, fix the problem (reconnect the folder or Drive), and try again.')
      ]),
      actions: [{ label: 'Stop — do not delete', value: false, kind: 'primary' }, { label: 'Delete anyway, without a backup', value: true, kind: 'danger' }]
    });
    return !!proceed;
  }
}

/* ---------- storage status bar ---------- */
function updateStorageBar() {
  const bar = $('#storagebar');
  if (!bar) return;
  // Whichever backend is actually active carries the main indicator — only
  // one ever is, so there is nothing useful left to show about the other.
  const driveActive = typeof DriveSync !== 'undefined' && DriveSync.connected;
  const st = driveActive ? { key: 'drive', tone: DriveSync.status().tone, label: DriveSync.status().label } : FileStore.status();
  bar.dataset.tone = st.tone;
  bar.textContent = '';

  const dot = h('span', { class: 'sb-dot' });
  const label = h('span', { class: 'sb-label', text: st.label });
  bar.appendChild(dot); bar.appendChild(label);

  if (driveActive) {
    bar.appendChild(h('span', {
      class: 'sb-sub tiny',
      text: DriveSync._pendingChange ? 'unsaved changes…' : (DriveSync.lastPushedAt ? 'synced ' + fmtDate(DriveSync.lastPushedAt, true) : '')
    }));
  } else if (FileStore.connected) {
    bar.appendChild(h('span', {
      class: 'sb-sub tiny',
      text: FileStore.dirty ? 'unsaved changes…' : (FileStore.lastSavedAt ? 'saved ' + fmtDate(FileStore.lastSavedAt, true) : '')
    }));
  }
  if (st.key === 'missing' || st.key === 'changed' || st.key === 'loss') {
    bar.appendChild(h('button', { class: 'btn sm primary', onclick: () => recoveryFlow(FileStore.problem), text: 'Fix this' }));
  } else if (st.key === 'reconnect') {
    bar.appendChild(h('button', { class: 'btn sm primary', onclick: () => reconnectFlow(), text: 'Reconnect' }));
  } else if (st.key === 'local') {
    bar.appendChild(h('button', { class: 'btn sm', onclick: () => connectFlow(), text: 'Connect a folder' }));
  }
}

/**
 * The file is gone, or someone else wrote it. Both are recoverable, but only
 * the person knows which copy they meant to keep, so this asks rather than
 * assumes. Nothing is written until they choose.
 */
async function recoveryFlow(kind) {
  if (FileStore._recovering) return;
  FileStore._recovering = true;
  try {
    const qHere = await DB.count('questions');

    if (kind === 'missing') {
      const choice = await modal({
        title: 'Your data file is gone',
        body: h('div', { class: 'stack' }, [
          h('p', {}, [h('b', { text: DATA_FILE }), ' is no longer in ', h('b', { text: FileStore.locationName || 'that folder' }), '. It may have been deleted, moved, or renamed, or the folder itself may have gone.']),
          h('div', { class: 'notice small' }, 'Nothing has been lost yet. This browser still holds your full bank — ' + qHere + ' question(s) — including everything answered since the file was last written. The app has stopped writing so it cannot quietly recreate a file you meant to remove.'),
          h('p', { class: 'small muted' }, 'If you deleted it on purpose, disconnect instead: Settings → Where your data lives.')
        ]),
        actions: [
          { label: 'Stay read-only', value: '' },
          { label: 'Choose a different folder…', value: 'reconnect' },
          { label: 'Write the file again here', value: 'recreate', kind: 'primary' }
        ]
      });
      if (choice === 'recreate') {
        FileStore.connected = true; FileStore.needsReconnect = false; FileStore.problem = null;
        FileStore._stamp = null; FileStore.needSnapshot = true; FileStore.dirty = true;
        const ok = await FileStore.flushNow('snapshot');
        toast(ok ? 'Your data file has been written again.' : 'Could not write the file.', ok ? 'ok' : 'bad');
      } else if (choice === 'reconnect') {
        FileStore._recovering = false;
        await FileStore.forget();
        await connectFlow();
        return;
      }
    }

    if (kind === 'changed') {
      let theirs = null, theirsPayload = null;
      try {
        const fh = await FileStore.fileHandleFor(false);
        const payload = JSON.parse(await (await fh.getFile()).text());
        theirsPayload = payload;
        theirs = { savedAt: payload.savedAt, questions: (payload.stores && payload.stores.questions || []).length };
      } catch (e) { /* unreadable — treated as unknown below */ }

      const choice = await modal({
        title: 'That file was changed outside the app',
        body: h('div', { class: 'stack' }, [
          h('p', {}, 'Something other than this tab wrote to your data file — another copy of the app, a sync client pulling a version from a different machine, or a restored backup.'),
          h('div', { class: 'grid g2' }, [
            h('div', { class: 'card' }, [h('div', { class: 'card-b tight' }, [
              h('div', { class: 'eyebrow', text: 'On disk' }),
              h('b', { text: theirs ? theirs.questions + ' question(s)' : 'unreadable' }),
              h('div', { class: 'tiny dim', text: theirs && theirs.savedAt ? 'saved ' + fmtDate(theirs.savedAt, true) : '' })
            ])]),
            h('div', { class: 'card' }, [h('div', { class: 'card-b tight' }, [
              h('div', { class: 'eyebrow', text: 'In this browser' }),
              h('b', { text: qHere + ' question(s)' }),
              h('div', { class: 'tiny dim', text: FileStore.lastSnapshotAt ? 'written ' + fmtDate(FileStore.lastSnapshotAt, true) : '' })
            ])])
          ]),
          h('div', { class: 'notice warn small' }, 'Whichever you discard is not recoverable from here. Take a backup first from Backup & Restore if you are unsure.')
        ]),
        actions: [
          { label: 'Stay read-only', value: '' },
          { label: 'Keep what is on disk', value: 'file' },
          { label: 'Keep this browser\u2019s version', value: 'browser', kind: 'primary' }
        ]
      });
      if (choice === 'file') {
        if (!await requireSafetyBackup('discarding this browser’s bank for the file on disk')) { toast('Nothing was changed.', 'ok'); return; }
        FileStore.connected = true; FileStore.needsReconnect = false; FileStore.problem = null;
        try {
          await FileStore.loadFromDisk();
          toast('Reloaded your bank from the file on disk.', 'ok');
        } catch (e) {
          toast('Could not read that file: ' + e.message, 'bad', 9000);
          FileStore.connected = false; FileStore.needsReconnect = true; FileStore.problem = 'changed';
        }
      } else if (choice === 'browser') {
        if (theirsPayload && !await requireExternalBackup(theirsPayload, 'mcq-mastery-file', 'the file on disk', 'overwriting the on-disk file with this browser’s bank')) { toast('Nothing was changed.', 'ok'); return; }
        FileStore.connected = true; FileStore.needsReconnect = false; FileStore.problem = null;
        FileStore._stamp = null; FileStore.needSnapshot = true; FileStore.dirty = true;
        const ok = await FileStore.flushNow('snapshot');
        toast(ok ? 'The file now matches this browser.' : 'Could not write the file.', ok ? 'ok' : 'bad');
      }
    }

    if (kind === 'noaccess') {
      // requestPermission() only succeeds when it runs synchronously from a
      // real user gesture — this recovery flow is invoked automatically
      // (setTimeout from onProblem()), so calling it straight away here was
      // always going to be silently refused by the browser, surfacing as
      // nothing more than a generic toast. The button below IS the gesture.
      const choice = await modal({
        title: 'Your browser needs permission again',
        body: h('div', { class: 'stack' }, [
          h('p', {}, 'Access to your data file was lost — often just from the tab being backgrounded for a while, or a browser restart. Nothing has been lost: this browser still holds your full bank, and the app has only stopped writing until permission is granted again.'),
          h('p', { class: 'small muted' }, 'If you deleted or moved the file on purpose, disconnect instead from Settings → "Where your data lives".')
        ]),
        actions: [{ label: 'Stay read-only', value: false }, { label: 'Grant permission', value: true, kind: 'primary' }]
      });
      if (choice) await reconnectFlow();
    }
  } finally {
    FileStore._recovering = false;
    updateStorageBar();
    if (typeof State !== 'undefined' && State.view) await go(State.view);
  }
}

async function reconnectFlow() {
  try {
    const ok = await FileStore.reconnect();
    if (!ok) { toast('Permission was not granted. Still read-only.', 'bad'); updateStorageBar(); return; }
    const res = await FileStore.loadFromDisk();
    if (res === 'loaded') toast('Reconnected. Your bank was reloaded from your file.', 'ok');
    else { await FileStore.flushNow(); toast('Reconnected.', 'ok'); }
    updateStorageBar();
    await go(State.view || 'dashboard');
  } catch (e) {
    toast('Could not reconnect: ' + (e.message || e.name), 'bad', 7000);
    updateStorageBar();
  }
}

/* ============================================================================
   Bank merge engine
   Combines this browser's current state with a payload pulled from
   somewhere else (Google Drive, or an existing local file) into one bank
   that keeps everything both sides have, instead of the earlier
   all-or-nothing "keep this / discard that" choice. Used at every point
   local and remote content meet: first connecting a folder or Drive when
   both already hold data, switching between backends, and the explicit
   "Sync with Drive" bridge action — merge is the default there; discarding
   one whole side remains available only as a secondary, danger-styled
   escape hatch.

   Strategy per store:
   - questions, courses, sources, batches, presets, notes: keyed rows —
     newest `updatedAt` (falling back to `createdAt`) wins per key, with
     every key unique to one side carried over untouched. questions are
     then re-checked (rescanCourseForPairs) against the merged bank, so a
     genuine disagreement between two independently-edited copies lands in
     the review queue instead of one side silently winning.
   - sessions: keyed the same way — a session has a real id, not an
     auto-increment one, and the same id can genuinely be touched from two
     devices (started on a phone, resumed later on a laptop).
   - attempts, questionVersions, audit: append-only logs whose keys are
     auto-increment integers assigned independently by each IndexedDB — the
     same integer on both sides is almost never the same real event, so
     these merge by matching content instead, never by colliding key.
   - tombstones: union by qid. A retirement recorded on either side is
     retired everywhere; it never needs "newest wins".
   - idRegister: never "newest wins" — that could roll the Question ID
     watermark backwards and let an already-used id be re-issued to a
     different question. The higher lastSeq always wins, with both sides'
     allocation histories unioned underneath it.
   - settings: not merged key-by-key — a device's preferences are one
     coherent set, not independent facts. Whichever whole payload has the
     newer top-level `savedAt` is adopted wholesale.
   - images: keyed union — captured once, essentially never edited after.
   ========================================================================== */

/** Generic keyed-store merge: newest `updatedAt`/`createdAt` wins per key,
    every key unique to one side is carried over untouched. Ties (including
    both sides missing a timestamp) keep the local row. */
function mergeKeyedRows(localRows, remoteRows, keyField) {
  const byKey = new Map((localRows || []).map(r => [r[keyField], r]));
  let added = 0, updated = 0;
  const touchedKeys = [];
  (remoteRows || []).forEach(r => {
    const k = r[keyField];
    const mine = byKey.get(k);
    if (!mine) { byKey.set(k, r); added++; touchedKeys.push(k); return; }
    const mineT = Date.parse(mine.updatedAt || mine.createdAt || 0) || 0;
    const theirT = Date.parse(r.updatedAt || r.createdAt || 0) || 0;
    if (theirT > mineT) { byKey.set(k, r); updated++; touchedKeys.push(k); }
  });
  return { rows: Array.from(byKey.values()), added, updated, touchedKeys };
}

/** Keyed union with no time comparison — for stores where "newest wins"
    makes no sense (a retirement is never un-retired; a captured image is
    never re-captured under the same id). */
function mergeKeyedRowsUnionOnly(localRows, remoteRows, keyField) {
  const byKey = new Map((localRows || []).map(r => [r[keyField], r]));
  let added = 0;
  (remoteRows || []).forEach(r => { if (!byKey.has(r[keyField])) { byKey.set(r[keyField], r); added++; } });
  return { rows: Array.from(byKey.values()), added };
}

/** A stable identity for one append-only row, ignoring its meaningless
    auto-increment key — two independent IndexedDBs assign that key from
    their own counters, so the same integer on both sides is almost never
    the same real event, and the real event's own fields are what make it
    unique. */
function appendOnlyContentKey(store, row) {
  if (store === 'attempts') return row.sessionId + '|' + row.questionUuid + '|' + row.ts;
  if (store === 'questionVersions') return row.questionUuid + '|' + row.version;
  if (store === 'audit') return row.ts + '|' + row.action + '|' + row.entityType + '|' + row.entityId;
  return JSON.stringify(row);
}
function mergeAppendOnlyRows(store, localRows, remoteRows) {
  const seen = new Map((localRows || []).map(r => [appendOnlyContentKey(store, r), r]));
  let added = 0;
  (remoteRows || []).forEach(r => {
    const k = appendOnlyContentKey(store, r);
    if (!seen.has(k)) {
      // These stores key by an auto-increment integer assigned
      // independently by each IndexedDB — writing a genuinely-new remote
      // row back with its original id could silently overwrite an
      // unrelated local row that happens to share the same auto-assigned
      // number, which is exactly the corruption this whole function
      // exists to avoid. Strip it so IndexedDB hands out a fresh,
      // guaranteed non-colliding one on write.
      const clean = Object.assign({}, r); delete clean.id;
      seen.set(k, clean); added++;
    }
  });
  return { rows: Array.from(seen.values()), added };
}

/** idRegister is the one store a plain "newest wins" merge would actively
    corrupt: rolling lastSeq backwards would let IdRegister.next() re-issue
    a Question ID already assigned, on either side, to a different
    question. The watermark can only ever move forward; allocation
    histories (already capped at 500 entries each) are unioned underneath
    it and re-capped the same way. */
function mergeIdRegisterRows(localRows, remoteRows) {
  const byId = new Map((localRows || []).map(r => [r.courseId, Object.assign({ lastSeq: 0, allocations: [] }, r)]));
  let touched = 0;
  const allocKey = a => a.ts + '|' + a.from + '|' + a.to + '|' + a.count;
  (remoteRows || []).forEach(r => {
    const mine = byId.get(r.courseId);
    if (!mine) { byId.set(r.courseId, Object.assign({ lastSeq: 0, allocations: [] }, r)); touched++; return; }
    const merged = Object.assign({}, mine);
    merged.lastSeq = Math.max(mine.lastSeq || 0, r.lastSeq || 0);
    const allocMap = new Map((mine.allocations || []).map(a => [allocKey(a), a]));
    let allocGrew = false;
    (r.allocations || []).forEach(a => { if (!allocMap.has(allocKey(a))) { allocMap.set(allocKey(a), a); allocGrew = true; } });
    merged.allocations = Array.from(allocMap.values()).sort((x, y) => new Date(x.ts) - new Date(y.ts)).slice(-500);
    if (merged.lastSeq !== mine.lastSeq || allocGrew) touched++;
    byId.set(r.courseId, merged);
  });
  return { rows: Array.from(byId.values()), touched };
}

/** Merge two whole bank payloads (each shaped like FileStore.buildPayload()
    / DriveSync.pull()'s result: { savedAt, stores: { <storeName>: [...] } })
    into one. Pure and DB-free — apply the result with applyMergedBank(). */
async function mergeBankPayloads(localPayload, remotePayload) {
  const report = { stores: {} };
  const merged = { stores: {} };

  const localNewer = (Date.parse(localPayload.savedAt || 0) || 0) >= (Date.parse(remotePayload.savedAt || 0) || 0);
  merged.stores.settings = ((localNewer ? localPayload : remotePayload).stores.settings || []).slice();
  report.stores.settings = { kept: localNewer ? 'local' : 'remote' };

  // Tombstones first, and ahead of everything else: a retirement recorded
  // on either side (from the backed-up, danger-styled "Wipe course" flow)
  // must actually stay retired once merged, or the one device that hasn't
  // caught up yet would silently resurrect a question — and its old attempt
  // history — the moment it merges. This is the one exception to "merging
  // keeps everything both sides hold".
  const tr = mergeKeyedRowsUnionOnly(localPayload.stores.tombstones || [], remotePayload.stores.tombstones || [], 'qid');
  merged.stores.tombstones = tr.rows;
  report.stores.tombstones = { added: tr.added };
  const retiredUuids = new Set(tr.rows.map(t => t.uuid).filter(Boolean));

  ['courses', 'sources', 'batches', 'presets', 'notes', 'sessions'].forEach(s => {
    const r = mergeKeyedRows(localPayload.stores[s] || [], remotePayload.stores[s] || [], 'id');
    merged.stores[s] = r.rows;
    report.stores[s] = { added: r.added, updated: r.updated };
  });

  const qr = mergeKeyedRows(localPayload.stores.questions || [], remotePayload.stores.questions || [], 'uuid');
  const revivedQuestions = qr.rows.filter(q => retiredUuids.has(q.uuid)).length;
  merged.stores.questions = qr.rows.filter(q => !retiredUuids.has(q.uuid));
  report.stores.questions = { added: qr.added, updated: qr.updated, tombstoned: revivedQuestions };
  merged.touchedQuestionUuids = qr.touchedKeys.filter(k => !retiredUuids.has(k));

  ['attempts', 'questionVersions', 'audit'].forEach(s => {
    const r = mergeAppendOnlyRows(s, localPayload.stores[s] || [], remotePayload.stores[s] || []);
    const rows = s === 'attempts' ? r.rows.filter(a => !retiredUuids.has(a.questionUuid)) : r.rows;
    merged.stores[s] = rows;
    report.stores[s] = { added: r.added, tombstoned: s === 'attempts' ? (r.rows.length - rows.length) : 0 };
  });

  const ir = mergeIdRegisterRows(localPayload.stores.idRegister || [], remotePayload.stores.idRegister || []);
  merged.stores.idRegister = ir.rows;
  report.stores.idRegister = { touched: ir.touched };

  const imr = mergeKeyedRowsUnionOnly(localPayload.stores.images || [], remotePayload.stores.images || [], 'id');
  merged.stores.images = imr.rows;
  report.stores.images = { added: imr.added };

  report.questionsBefore = { local: (localPayload.stores.questions || []).length, remote: (remotePayload.stores.questions || []).length };
  report.questionsAfter = merged.stores.questions.length;
  return { merged, report };
}

/** Write a merged bank into IndexedDB (guarded writes, so whichever backend
    is currently connected picks the change up through its normal dirty-
    tracking, the same as any other edit) and re-check every question a
    merge actually touched against the rest of its course, so a new
    disagreement the merge surfaced lands in the review queue rather than
    silently resolving itself. */
async function applyMergedBank(merged) {
  for (const s of BACKUP_STORES) {
    if (s === 'questions') continue;
    await DB.putMany(s, merged.stores[s] || []);
  }
  await DB.putMany('questions', merged.stores.questions || []);

  // FileStore.buildPayload() caches its last snapshot and only refreshes the
  // stores its own touch() marked dirty — which never fires for a store this
  // write pass touched while FileStore itself was not the connected backend
  // (a Drive-only merge). Force the next buildPayload() to rebuild from
  // scratch so a push right after this never uploads pre-merge data.
  FileStore._cache = null;

  const touched = new Set(merged.touchedQuestionUuids || []);
  if (touched.size) {
    const byCourse = new Map();
    merged.stores.questions.forEach(q => { if (touched.has(q.uuid)) { if (!byCourse.has(q.courseId)) byCourse.set(q.courseId, []); byCourse.get(q.courseId).push(q.uuid); } });
    for (const courseId of byCourse.keys()) await rescanCourseForPairs(courseId);
  }
  State.invalidate();
}

/** Shared summary dialog for every merge point below. */
async function showMergeReport(report, title, intro) {
  const rows = Object.keys(report.stores)
    .map(s => {
      const r = report.stores[s];
      if (s === 'settings') return null;

      if (r.updated) bits.push(r.updated + ' updated');
      if (r.touched) bits.push(r.touched + ' extended');

      tombstonedQ ? h('div', { class: 'notice warn small' }, tombstonedQ + ' question(s) stayed deleted — they were removed here or on the other side since these last matched, so the merge did not bring them back.') : null,

    ])

      ]),

      }

      await FileStore.flushNow();
      toast('Your file now holds this browser\u2019s bank.', 'ok');
      break;
    } else if (choice === 'merge') {
      if (!(await requireSafetyBackup('merging this browser\u2019s bank with the file already in that folder'))) {
        await FileStore.forget(); updateStorageBar(); return;
      }
      const localPayload = await FileStore.buildPayload();

      await applyMergedBank(merged);
      FileStore._diskQuestionCount = existing.count;
      await FileStore.flushNow();
      await showMergeReport(report, 'Merged with your file', 'Both copies were combined and written to the file \u2014 this browser and the file now match.');

    }

  } else if (existing.status === 'unreadable') {
    const proceed = await modal({
      title: 'That folder already has a file, but it can\u2019t be read',
      body: h('div', { class: 'stack' }, [
        h('p', {}, 'There is already a file where MCQ Mastery keeps its data in that folder, but its contents aren\u2019t readable \u2014 it may have been caught mid-write by another program (a cloud-sync tool, for example) or edited into a broken state.'),

    FileStore.allowShrink('confirmed by the user, overwriting an unreadable file in the connected folder');
    await FileStore.flushNow();

  } else {
    await FileStore.flushNow();

  }
  FileStore.startWatch();
  updateStorageBar();
  await go(State.view || 'dashboard');
}

/** Peek at the target without touching IndexedDB.
    Returns { status, count, payload, rawText } — status is 'missing' |
    'empty' | 'unreadable' | 'has-data', count is the existing file's
    question count (0 unless status is 'has-data'), payload is the parsed
    file content when available. The count matters even before anything is
    loaded: it is what lets an "overwrite" choice be judged against what it
    would actually discard, rather than the loss-guard seeing an untouched
    _diskQuestionCount of 0 and assuming there is nothing to lose. The
    payload lets that discarded content be backed up before it happens.
    'unreadable' means real bytes are there but aren't a readable MCQ
    Mastery file (mid-write by a sync tool, hand-edited into a broken
    state) — never treated as 'empty', since that would silently license
    overwriting something that might actually matter; rawText carries what
    could be read, so it can still be saved off before being overwritten. */
FileStore.loadFromDiskPreview = async function () {
  let fh;
  try { fh = await this.fileHandleFor(false); } catch (e) { return { status: 'missing', count: 0, payload: null }; }
  if (!fh) return { status: 'missing', count: 0, payload: null };
  const file = await fh.getFile();
  if (!file.size) return { status: 'empty', count: 0, payload: null };
  const rawText = await file.text();
  try {
    const payload = JSON.parse(rawText);
    if (!payload || !payload.stores) return { status: 'unreadable', count: 0, payload: null, rawText };
    const count = (payload.stores.questions || []).length;
    return count ? { status: 'has-data', count, payload } : { status: 'empty', count: 0, payload: null };
  } catch (e) {
    // Bytes are there but not valid JSON — a half-synced cloud-drive
    // conflict, a truncated write, a manual edit gone wrong. This is not
    // the same as an empty folder and must never be treated as one: an
    // empty folder is safe to write into silently, but something
    // unreadable might be a real bank the student can't afford to lose.
    return { status: 'unreadable', count: 0, payload: null, rawText };
  }
};

const TESTS = [];
const test = (name, fn) => TESTS.push({ name, fn });
function assert(cond, msg) { if (!cond) throw new Error(msg || 'assertion failed'); }
function eq(a, b, msg) { if (a !== b) throw new Error((msg || 'not equal') + ' — got ' + JSON.stringify(a) + ', expected ' + JSON.stringify(b)); }

const mkQ = (stem, opts, correctIx, extra) => {
  const q = blankQuestion('test-course');
  q.stem = stem;
  q.options = opts.map(t => makeOption(t));
  if (correctIx != null) q.correctOptionId = q.options[correctIx].id;
  return Object.assign(q, extra || {});
};

/* ---- randomisation ---- */
test('Seeded shuffle is reproducible and loses nothing', () => {
  const arr = Array.from({ length: 40 }, (_, i) => i);
  const a = shuffle(arr, mulberry32(12345));
  const b = shuffle(arr, mulberry32(12345));
  eq(a.join(','), b.join(','), 'same seed must give the same order');
  assert(shuffle(arr, mulberry32(999)).join(',') !== a.join(','), 'a different seed should give a different order');
  eq(a.slice().sort((x, y) => x - y).join(','), arr.join(','), 'every element must survive the shuffle');
});
test('Option shuffling never changes which option is correct', () => {
  const q = mkQ('Which control is preventive?', ['Log review', 'Access matrix', 'Reconciliation', 'Audit trail'], 1);
  const correctText = q.options.find(o => o.id === q.correctOptionId).text;
  for (let s = 0; s < 50; s++) {
    const order = shuffle(q.options.map(o => o.id), mulberry32(s));
    const shown = order.map(id => q.options.find(o => o.id === id));
    const pickedByScoring = shown.find(o => o.id === q.correctOptionId);
    eq(pickedByScoring.text, correctText, 'scoring by option id must stay stable at seed ' + s);
  }
});
test('Locked option order is respected', () => {
  const q = mkQ('Which of the following is true of Option A?', ['First', 'Second', 'All of the above', 'None'], 0);
  assert(autoLockOrder(q.stem, q.options), 'a stem naming Option A must be locked');
  const q2 = mkQ('Which is the strongest control?', ['MFA', 'Password length', 'All of the above', 'CCTV'], 0);
  assert(autoLockOrder(q2.stem, q2.options), '"All of the above" must lock the order');
  const q3 = mkQ('Which is the strongest control?', ['MFA', 'Password length', 'Firewall', 'CCTV'], 0);
  assert(!autoLockOrder(q3.stem, q3.options), 'an ordinary question should not be locked');
});

/* ---- duplicate detection ---- */
test('Punctuation-only differences are treated as exact duplicates', async () => {
  const a = mkQ('An IS auditor finds a control weakness. What should be done FIRST?', ['Report it', 'Corroborate it', 'Fix it', 'Ignore it'], 1);
  const b = mkQ('An IS auditor finds a control weakness — what should be done FIRST?', ['Report it.', 'Corroborate it.', 'Fix it.', 'Ignore it.'], 1);
  await recomputeFingerprint(a); await recomputeFingerprint(b);
  eq(a.fingerprint, b.fingerprint, 'normalised fingerprints must match');

});
test('Same stem with materially different options is not a duplicate merge', async () => {
  const a = mkQ('Which control BEST prevents unauthorised production changes?', ['Segregation of duties', 'Log review', 'Annual recertification', 'Change minutes'], 0);
  const b = mkQ('Which control BEST prevents unauthorised production changes?', ['Encryption at rest', 'Biometric entry', 'Firewall rules', 'Data classification'], 0);
  await recomputeFingerprint(a); await recomputeFingerprint(b);

});

  const b = mkQ('Who approves the audit charter?', ['Audit committee', 'CIO', 'External auditor', 'Process owner'], 0);

test('Conflicting correct answers are detected, not merged', async () => {
  const a = mkQ('Which is a detective control?', ['Firewall', 'Log review', 'Encryption', 'Training'], 1);
  const b = mkQ('Which is a detective control?', ['Firewall', 'Log review', 'Encryption', 'Training'], 0);

test('Same question from two sources merges to one canonical record', async () => {

test('An externally rewritten file is a conflict, but a re-synced identical one is not', async () => {
  const was = { c: FileStore.connected, d: FileStore.dirHandle, s: FileStore._stamp, snap: FileStore.lastSnapshotAt, p: FileStore.problem };
  try {
    FileStore.connected = true;
    FileStore.lastSnapshotAt = '2026-01-01T00:00:00.000Z';
    FileStore._stamp = { size: 100, lastModified: 1000 };

    const fileWith = (text, size, lastModified) => ({
      getFileHandle: async () => ({ getFile: async () => ({ size, lastModified, text: async () => text }) })
    });

    // Unchanged metadata — nothing to do.
    FileStore.dirHandle = fileWith('{}', 100, 1000);
    eq(await FileStore.verifyFile(), 'ok', 'matching size and timestamp means no change');

    // A sync client rewrote identical content: timestamp moved, savedAt did not.
    FileStore.dirHandle = fileWith(JSON.stringify({ savedAt: '2026-01-01T00:00:00.000Z', stores: {} }), 100, 99999);
    eq(await FileStore.verifyFile(), 'ok', 'same content with a new timestamp must not raise a false conflict');

    // Someone genuinely wrote a different version.
    FileStore._stamp = { size: 100, lastModified: 1000 };
    FileStore.dirHandle = fileWith(JSON.stringify({ savedAt: '2026-06-01T00:00:00.000Z', stores: {} }), 250, 88888);
    eq(await FileStore.verifyFile(), 'changed', 'a newer save from elsewhere is a real conflict');

    // Unreadable contents count as changed rather than being overwritten.
    FileStore._stamp = { size: 100, lastModified: 1000 };
    FileStore.dirHandle = fileWith('not json at all', 60, 77777);
    eq(await FileStore.verifyFile(), 'changed', 'an unreadable file must never be blindly overwritten');
  } finally {
    FileStore.connected = was.c; FileStore.dirHandle = was.d;
    FileStore._stamp = was.s; FileStore.lastSnapshotAt = was.snap; FileStore.problem = was.p;
  }
});

test('An empty or badly shrunken bank cannot overwrite a full file', () => {
  const was = { d: FileStore._diskQuestionCount, s: FileStore._shrinkOk };
  try {
    FileStore._diskQuestionCount = 2700;
    FileStore._shrinkOk = null;

    assert(FileStore.lossCheck(0), 'an empty bank must never overwrite a full file');
    assert(FileStore.lossCheck(10), 'a collapse from 2700 to 10 must be refused');
    assert(FileStore.lossCheck(1000), 'losing well over half the bank must be refused');
    assert(!FileStore.lossCheck(2700), 'an unchanged bank must save normally');
    assert(!FileStore.lossCheck(2699), 'deleting one question must save normally');
    assert(!FileStore.lossCheck(5000), 'a larger bank must save normally');
    assert(!FileStore.lossCheck(1400), 'a modest reduction must still save');

    // A deliberate deletion is allowed through, once, and then re-armed.
    FileStore.allowShrink('test wipe');
    assert(!FileStore.lossCheck(0), 'a deletion you asked for must be permitted');

    // Nothing on disk yet means nothing to protect.
    FileStore._diskQuestionCount = 0; FileStore._shrinkOk = null;
    assert(!FileStore.lossCheck(0), 'a first save to an empty folder must not be blocked');
  } finally { FileStore._diskQuestionCount = was.d; FileStore._shrinkOk = was.s; }
});

    assert(DriveSync.driveLossCheck(0), 'an empty bank must never overwrite a Drive file with 1341 questions');
    assert(DriveSync.driveLossCheck(10), 'a collapse from 1341 to 10 must be refused');
    assert(DriveSync.driveLossCheck(600), 'losing well over half the bank must be refused');
    assert(!DriveSync.driveLossCheck(1341), 'an unchanged bank must sync normally');
    assert(!DriveSync.driveLossCheck(1340), 'deleting one question must sync normally');
    assert(!DriveSync.driveLossCheck(2000), 'a larger bank must sync normally');
    assert(!DriveSync.driveLossCheck(700), 'a modest reduction must still sync');

    // A deliberate deletion is allowed through, once, and then re-armed.
    DriveSync.allowDriveShrink('test wipe');
    assert(!DriveSync.driveLossCheck(0), 'a deletion you asked for must be permitted');

    // Nothing known on Drive yet means nothing to protect.
    DriveSync._remoteQuestionCount = 0; DriveSync._driveShrinkOk = null;
    assert(!DriveSync.driveLossCheck(0), 'a first sync to an empty Drive file must not be blocked');
  } finally { DriveSync._remoteQuestionCount = was.c; DriveSync._driveShrinkOk = was.s; }
});

/* ---- bank merge engine ---- */
test('mergeKeyedRows keeps every exclusive row and lets the newer one win on a shared key', () => {
  const local = [
    { id: 'a', updatedAt: '2026-01-01T00:00:00Z', v: 'local-a' },
    { id: 'shared', updatedAt: '2026-01-01T00:00:00Z', v: 'local-shared-older' },
    { id: 'c', updatedAt: '2026-01-01T00:00:00Z', v: 'local-c' }
  ];
  const remote = [
    { id: 'shared', updatedAt: '2026-02-01T00:00:00Z', v: 'remote-shared-newer' },
    { id: 'b', updatedAt: '2026-01-01T00:00:00Z', v: 'remote-b' }
  ];
  const r = mergeKeyedRows(local, remote, 'id');
  eq(r.rows.length, 4, 'a, b, c and shared must all survive — nothing exclusive to either side is dropped');
  eq(r.added, 1, 'only b is new from remote');
  eq(r.updated, 1, 'only shared was actually overwritten');
  const shared = r.rows.find(x => x.id === 'shared');
  eq(shared.v, 'remote-shared-newer', 'the newer updatedAt must win on a shared key');
  assert(r.touchedKeys.indexOf('shared') >= 0 && r.touchedKeys.indexOf('b') >= 0, 'touchedKeys must list every row that came from remote');
});
test('mergeKeyedRows keeps the local row on a tie or when neither side has a timestamp', () => {
  const r1 = mergeKeyedRows([{ id: 'x', v: 'local' }], [{ id: 'x', v: 'remote' }], 'id');
  eq(r1.rows[0].v, 'local', 'with no updatedAt/createdAt on either side, local must win rather than picking arbitrarily');
  const r2 = mergeKeyedRows(
    [{ id: 'x', updatedAt: '2026-01-01T00:00:00Z', v: 'local' }],
    [{ id: 'x', updatedAt: '2026-01-01T00:00:00Z', v: 'remote' }], 'id');
  eq(r2.rows[0].v, 'local', 'an exact tie must keep the local row');
});
test('mergeAppendOnlyRows dedupes by content, not by the meaningless auto-increment key', () => {
  const local = [{ id: 1, sessionId: 's1', questionUuid: 'q1', ts: 't1' }, { id: 2, sessionId: 's1', questionUuid: 'q2', ts: 't2' }];
  // id 2 on the remote side is a completely different real attempt that
  // happened to get the same auto-increment integer on that device.
  const remote = [{ id: 1, sessionId: 's1', questionUuid: 'q1', ts: 't1' }, { id: 2, sessionId: 's2', questionUuid: 'q3', ts: 't3' }];
  const r = mergeAppendOnlyRows('attempts', local, remote);
  eq(r.rows.length, 3, 'the true duplicate (id 1) must be dropped but the colliding-key-different-event row (remote id 2) must be kept');
  eq(r.added, 1);
  assert(r.rows.some(x => x.questionUuid === 'q3'), 'the remote-only attempt must survive despite sharing an id with a local row');
});
test('mergeIdRegisterRows never lets the Question ID watermark move backwards', () => {
  const local = [{ courseId: 'c1', lastSeq: 50, allocations: [{ ts: '2026-01-01T00:00:00Z', from: 'Q-Q-000041', to: 'Q-Q-000050', count: 10 }] }];
  const remote = [{ courseId: 'c1', lastSeq: 30, allocations: [{ ts: '2025-06-01T00:00:00Z', from: 'Q-Q-000021', to: 'Q-Q-000030', count: 10 }] }];
  const r = mergeIdRegisterRows(local, remote);
  eq(r.rows[0].lastSeq, 50, 'the higher watermark must always win, even though remote is the "incoming" side');
  eq(r.rows[0].allocations.length, 2, 'both allocation histories must be unioned underneath the winning watermark');

  const local2 = [{ courseId: 'c2', lastSeq: 10, allocations: [] }];
  const remote2 = [{ courseId: 'c2', lastSeq: 75, allocations: [] }];
  const r2 = mergeIdRegisterRows(local2, remote2);
  eq(r2.rows[0].lastSeq, 75, 'a higher remote watermark must be adopted, or a later next() could re-issue an id already used on Drive');
});
test('mergeBankPayloads merges questions and reports the before/after counts, without touching settings key-by-key', () => {
  const local = {
    savedAt: '2026-01-01T00:00:00Z',
    stores: {
      questions: [{ uuid: 'q1', updatedAt: '2026-01-01T00:00:00Z', stem: 'local q1' }],
      courses: [], sources: [], batches: [], attempts: [], sessions: [], settings: [{ k: 'theme', v: 'dark' }],
      audit: [], images: [], idRegister: [], tombstones: [], presets: [], notes: [], questionVersions: []
    }
  };
  const remote = {
    savedAt: '2026-03-01T00:00:00Z',
    stores: {
      questions: [{ uuid: 'q2', updatedAt: '2026-01-01T00:00:00Z', stem: 'remote q2' }],
      courses: [], sources: [], batches: [], attempts: [], sessions: [], settings: [{ k: 'theme', v: 'light' }],
      audit: [], images: [], idRegister: [], tombstones: [], presets: [], notes: [], questionVersions: []
    }
  };
  return mergeBankPayloads(local, remote).then(({ merged, report }) => {
    eq(merged.stores.questions.length, 2, 'q1 and q2 must both survive the merge');
    eq(report.questionsBefore.local, 1); eq(report.questionsBefore.remote, 1); eq(report.questionsAfter, 2);
    eq(merged.stores.settings[0].v, 'light', 'settings must come wholesale from the newer payload (remote here), never merged key-by-key');
    eq(report.stores.settings.kept, 'remote');
  });
});

test('The shrink consent is one-shot, not a standing permission', async () => {
  const was = { d: FileStore._diskQuestionCount, s: FileStore._shrinkOk, c: FileStore.connected, dir: FileStore.dirHandle, st: FileStore._stamp, lg: FileStore._lastGoodText };
  try {
    FileStore._diskQuestionCount = 100;
    FileStore._lastGoodText = null;
    FileStore._stamp = null;
    FileStore.connected = true;
    FileStore.allowShrink('deliberate');
    assert(FileStore._shrinkOk, 'consent should be armed');

    // A snapshot consumes it.
    FileStore.dirHandle = {
      getFileHandle: async () => ({
        createWritable: async () => ({ write: async () => { }, close: async () => { } }),
        getFile: async () => ({ size: 20, lastModified: 1, text: async () => JSON.stringify({ stores: { questions: [] } }) })
      })
    };
    FileStore._cache = { questions: [] }; FileStore._dirtyStores = new Set();
    await FileStore._writeSnapshot();
    assert(!FileStore._shrinkOk, 'consent must be consumed by the save it was granted for');

    // So a second unexplained collapse is refused again.
    FileStore._diskQuestionCount = 100;
    assert(FileStore.lossCheck(0), 'the guard must re-arm after being used once');
  } finally {
    FileStore._diskQuestionCount = was.d; FileStore._shrinkOk = was.s;
    FileStore.connected = was.c; FileStore.dirHandle = was.dir;
    FileStore._stamp = was.st; FileStore._lastGoodText = was.lg; FileStore._cache = null;
  }
});

test('A save that cannot be read back is reported, not trusted', async () => {
  const bad = (text, size) => ({ getFile: async () => ({ size: size, lastModified: 1, text: async () => text }) });

  let r = await FileStore.verifyWritten(bad('', 0), 5);
  assert(!r.ok, 'an empty file must fail verification');

  r = await FileStore.verifyWritten(bad('{ truncated', 11), 5);
  assert(!r.ok, 'unparseable JSON must fail verification');

  r = await FileStore.verifyWritten(bad(JSON.stringify({ savedAt: 'x' }), 20), 5);
  assert(!r.ok, 'a file with no stores must fail verification');

  r = await FileStore.verifyWritten(bad(JSON.stringify({ stores: { questions: [1, 2] } }), 30), 5);
  assert(!r.ok, 'a wrong question count must fail verification');

  r = await FileStore.verifyWritten(bad(JSON.stringify({ stores: { questions: [1, 2, 3, 4, 5] } }), 40), 5);
  assert(r.ok, 'a correct file must pass verification');
});

/* ---- scaling ---- */
test('Duplicate detection stays fast as the bank grows', () => {
  const mk = (stem) => {
    const q = mkQ(stem, ['alpha option text', 'beta option text', 'gamma option text', 'delta option text'], 0);
    q.status = 'active'; q.answerVerified = 'verified';
    return q;
  };
  const words = ['ledger', 'payroll', 'firewall', 'vendor', 'cloud', 'backup', 'audit', 'cipher', 'router', 'invoice'];
  const bank = [];
  for (let i = 0; i < 3000; i++) {
    bank.push(mk('Which control best addresses ' + words[i % 10] + ' exposure in scenario number ' + i + ' of the review?'));
  }
  const cands = [];
  for (let i = 0; i < 100; i++) cands.push(mk('Which control best addresses ' + words[i % 10] + ' exposure in scenario number ' + i + ' of the review?'));

  const started = Date.now();
  const verdicts = detectDuplicates(cands, bank);
  const ms = Date.now() - started;

  // Every candidate is a word-for-word copy of a bank entry.
  let found = 0;
  cands.forEach(q => { if (verdicts.get(q.uuid)) found++; });
  eq(found, 100, 'every exact duplicate must still be caught');

  // Generous, but a return to the quadratic scan blows straight past it.
  assert(ms < 8000, 'duplicate detection took ' + ms + 'ms for 100 candidates against 3000 — far slower than expected');
});

test('Comparison caches never reach the data file', () => {
  const q = mkQ('cached question', ['a', 'b'], 0);
  simParts(q);
  assert(q.__sim, 'the cache should exist on the object');
  const round = JSON.parse(JSON.stringify(q));
  assert(!('__sim' in round), 'the cache must not be serialised into your data file');
  assert(!('__simGen' in round), 'the cache generation must not be serialised either');
});

test('Editing a question invalidates its cached comparison data', () => {
  const q = mkQ('the original stem about firewalls', ['a', 'b'], 0);
  const before = simParts(q).tok;
  assert(before.has('original'), 'the cache should reflect the original stem');
  q.stem = 'a completely different stem about payroll reconciliation';
  bumpSimGen();                      // what a question write does
  const after = simParts(q).tok;
  assert(after.has('payroll'), 'the cache must be rebuilt after an edit');
  assert(!after.has('original'), 'stale tokens must not survive an edit');
});

/* ---- supplied question files ---- */
test('The app never advertises question files it has not confirmed', async () => {
  const realFetch = globalThis.fetch;
  try {
    // No catalogue at all: nothing should be offered.
    globalThis.fetch = async () => ({ ok: false, status: 404 });
    _catalogue = null;
    eq((await starterCatalogue()).length, 0, 'a missing catalogue must offer nothing');

    // A catalogue listing a file that is not actually there.
    globalThis.fetch = async (url, opts) => {
      if (String(url).indexOf('starter-index') >= 0) {
        return { ok: true, json: async () => ({ files: [{ file: 'data/ghost.json', course: 'CISA', label: 'Ghost', questions: 999 }] }) };
      }
      return { ok: false, status: 404 };     // the listed file does not exist
    };
    _catalogue = null;
    const cat = await starterCatalogue();
    eq(cat.length, 1, 'the catalogue itself is readable');
    const probe = await probeStarterFile(cat[0]);
    assert(!probe.ok, 'a listed but absent file must fail its check, so no card is shown');

    // A file that is present reports its size.
    globalThis.fetch = async () => ({ ok: true, headers: { get: () => '2048' } });
    const good = await probeStarterFile({ file: 'data/real.json' });
    assert(good.ok, 'a present file must pass');
    eq(good.size, 2048, 'the size should come from the response, not from a constant');
  } finally {
    globalThis.fetch = realFetch;
    _catalogue = null;
  }
});

/* ---- eligibility gate ---- */
test('Only active, verified questions can enter a session', () => {
  const base = () => { const q = mkQ('q', ['a', 'b'], 0); q.status = 'active'; q.answerVerified = 'verified'; return q; };
  assert(isPracticeEligible(base()));
  const c = base(); c.conflict = true; assert(!isPracticeEligible(c), 'a conflict must be blocked');
  const u = base(); u.answerVerified = 'unverified'; assert(!isPracticeEligible(u), 'an unverified answer must be blocked');
  const d = base(); d.status = 'draft'; assert(!isPracticeEligible(d), 'a draft must be blocked');
  const x = base(); x.correctOptionId = 'nope'; assert(!isPracticeEligible(x), 'a dangling correct-option id must be blocked');
});

/* ---- archive round trip ---- */
test('ZIP write then read returns the same bytes', async () => {
  if (typeof self.CompressionStream !== 'function' || !HAS_CS) { return 'skipped — this browser has no Compression Streams'; }
  const payload = JSON.stringify({ hello: 'world', n: Array.from({ length: 400 }, (_, i) => i) });
  const blob = await zipFiles([{ name: 'a/b.json', data: payload }, { name: 'note.txt', data: 'plain' }]);
  const zip = await unzip(await blob.arrayBuffer());
  eq(await zip.text('a/b.json'), payload);
  eq(await zip.text('note.txt'), 'plain');
});
test('CSV round trip survives quotes, commas and newlines', () => {
  const rows = [['a', 'b,c', 'd"e', 'f\ng']];
  const back = parseCSV(toCSV(rows));
  eq(back[0][1], 'b,c'); eq(back[0][2], 'd"e'); eq(back[0][3], 'f\ng');
});
test('Attempt history stays linked to the version answered', () => {
  const prev = mkQ('Original wording', ['a', 'b'], 0);
  const att = { questionUuid: prev.uuid, questionVersion: prev.version, correct: true };
  const next = JSON.parse(JSON.stringify(prev));
  next.stem = 'Edited wording';
  assert(materiallyDifferent(prev, next), 'a stem change is material');
  next.version = prev.version + 1;
  eq(att.questionVersion, 1, 'the old attempt must still point at version 1');
  eq(next.version, 2);
});

async function runSelfTests() {
  const body = h('div', { class: 'stack' });
  const summary = h('div', { class: 'notice' }, 'Running…');
  const list = h('div', { class: 'stack' });
  body.appendChild(summary); body.appendChild(list);
  const dlg = modal({ title: 'Built-in tests', wide: true, body, actions: [{ label: 'Close', value: null }] });
  let pass = 0, fail = 0, skip = 0;
  for (const t of TESTS) {
    let row;
    try {
      const r = await t.fn();
      if (typeof r === 'string' && r.indexOf('skipped') === 0) { skip++; row = h('div', { class: 'row small' }, [h('span', { class: 'badge b-draft', text: 'SKIP' }), h('span', { text: t.name }), h('span', { class: 'tiny dim', text: r })]); }
      else { pass++; row = h('div', { class: 'row small' }, [h('span', { class: 'badge b-active', text: 'PASS' }), h('span', { text: t.name })]); }
    } catch (e) {
      fail++;
      row = h('div', {}, [
        h('div', { class: 'row small' }, [h('span', { class: 'badge b-conflict', text: 'FAIL' }), h('span', { text: t.name })]),
        h('div', { class: 'srcline', style: 'color:var(--pencil)', text: e.message })
      ]);
    }
    list.appendChild(row);
  }
  summary.className = 'notice ' + (fail ? 'bad' : 'ok');
  summary.textContent = pass + ' passed · ' + fail + ' failed · ' + skip + ' skipped, out of ' + TESTS.length + ' checks.';
  await audit('test', 'system', '', null, { pass, fail, skip }, '');
  return dlg;
}

/* ============================================================================
   Boot
   ========================================================================== */
async function boot() {
  const app = $('#app');
  try {
    await DB.open();
  } catch (e) {
    app.innerHTML = '';
    app.appendChild(h('div', { style: 'padding:40px;max-width:620px;margin:0 auto' }, [
      h('div', { class: 'eyebrow', text: 'Cannot start' }),
      h('h1', { class: 'page-title', style: 'margin:8px 0 12px', text: 'Local storage is not available' }),
      h('div', { class: 'notice bad' }, e.message),
      h('p', { class: 'muted', style: 'margin-top:14px' }, 'You opened this file directly from disk, and browsers block the local database for file:// pages. It has to be served over http instead — which stays entirely on your own machine.'),
      h('p', { class: 'muted', style: 'margin:8px 0 0' }, 'On Windows: double-click "Start MCQ Mastery.bat" in this same folder. Otherwise, from a terminal in the folder containing index.html:'),
      h('pre', { style: 'background:var(--surface-2);border:1px solid var(--rule);padding:12px;border-radius:6px;overflow:auto' },
        'npx --yes serve .\n# or\npython3 -m http.server 8080'),
      h('p', { class: 'muted' }, 'Then open the address it prints. Private or incognito windows also block persistent storage in some browsers.')
    ]));
    return;
  }
  await FileStore.init();
  if (FileStore.connected) {
    try {
      const res = await FileStore.loadFromDisk();
      if (res === 'loaded') {
        FileStore.startWatch();
      } else {
        // A remembered folder that no longer holds our file. Recreating it
        // here would quietly undo a deletion the person may have meant, and
        // would look identical to nothing being wrong. Stop and ask instead.
        await FileStore.onProblem('missing');
      }
    } catch (e) {
      FileStore.connected = false;
      FileStore.needsReconnect = true;
      FileStore.problem = 'changed';
      setTimeout(() => toast('Could not read your data file: ' + e.message, 'bad', 12000), 800);
    }
  }
  await Settings.load();
  applyTheme();
  State.courses = await ensureSeedCourse();
  const wanted = Settings.get('activeCourseId');
  State.course = State.courses.find(c => c.id === wanted && !c.archived) || State.courses.find(c => !c.archived) || State.courses[0];
  if (State.course.id !== wanted) await Settings.set('activeCourseId', State.course.id);
  if (!HAS_CS) setTimeout(() => toast('This browser has no Compression Streams, so .docx, .xlsx and ZIP backups will not work. Use a current Chrome, Edge, Safari or Firefox.', 'warn', 9000), 900);

  renderShell();
  applyTheme();
  updateStorageBar();
  // Never blocks boot on Google's servers — a silent reconnect attempt that
  // updates the storage bar whenever (if ever) it resolves.
  DriveSync.init();
  await go('dashboard');

  // When appearance is set to Auto, follow the system if it changes mid-session.
  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const onChange = () => { if ((Settings.get('theme') || 'light') === 'system') applyTheme(); };
    if (mq.addEventListener) mq.addEventListener('change', onChange);
    else if (mq.addListener) mq.addListener(onChange);
  }

  // A debounced save may still be pending when the tab closes.
  window.addEventListener('beforeunload', (e) => {
    if (FileStore.connected && FileStore.dirty) {
      FileStore.flushNow('snapshot');
      e.preventDefault();
      e.returnValue = '';
    }
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && FileStore.connected && FileStore.dirty) FileStore.flushNow('snapshot');
    // Not hooked into beforeunload like the local write above: a fetch()
    // started that late routinely gets killed before it completes, especially
    // for a payload of any size. Going hidden fires earlier — backgrounding a
    // tab or switching apps on a phone — and the page usually survives long
    // enough afterward for the upload to actually finish.
    if (document.visibilityState === 'hidden' && typeof DriveSync !== 'undefined' && DriveSync.connected) DriveSync.maybePush(true);
  });
  // A blocked write should read as an explanation, not as a stack trace —
  // and any other DB failure (storage full, the shared connection closed
  // out from under the tab) must never be silent either: losing an answer
  // mid-session with zero feedback is exactly the quiet failure this app
  // exists to prevent. AbortError is excluded since it's the established
  // signal throughout this app for "the student cancelled a picker/prompt
  // on purpose", not a failure worth a red toast.
  window.addEventListener('unhandledrejection', (e) => {
    const r = e && e.reason;
    if (!r || !r.name || r.name === 'AbortError') return;
    e.preventDefault();
    if (r.name === 'ReadOnlyError') { toast(r.message, 'bad', 8000); return; }
    if (r.name === 'QuotaExceededError' || /quota/i.test(r.message || '')) {
      toast('Your last change could not be saved — your browser’s storage is full. Free up space (Settings → Backup & Restore) and try again.', 'bad', 10000);
      return;
    }
    toast('Something didn’t save: ' + (r.message || r.name) + '. If this keeps happening, back up from Settings and reload the app.', 'bad', 9000);
  });

  if (FileStore.tier !== 'manual' && !FileStore.everConnected) {
    setTimeout(() => toast('Your bank currently lives only in this browser. Connect a folder to keep it in a file you own.', 'warn', 9000), 1500);
  }

  // global shortcuts
  document.addEventListener('keydown', e => {
    if (e.target.matches('input,textarea,select') || $('.modal-bg')) return;
    if (e.key === '?') { e.preventDefault(); showShortcuts(); }
  });
  // paste an image from anywhere
  document.addEventListener('paste', e => {
    if (State.view === 'import' || $('.modal-bg')) return;
    const items = Array.from((e.clipboardData || {}).items || []);
    const img = items.find(i => i.type.indexOf('image') === 0);
    if (img) { e.preventDefault(); imageWorkflow(img.getAsFile()); }
  });
  window.addEventListener('beforeunload', (e) => {
    if (State.session && State.session.status === 'active' && State.session.mode === 'mock') { e.preventDefault(); e.returnValue = ''; return; }
    // A staged import batch lives only in memory (State.staging) until
    // "Admit this batch" is clicked — the in-app Discard button already
    // warns this is lost on purpose ("nothing has been written to the
    // bank yet"); an accidental refresh or closed tab must warn just as
    // clearly, or a long review session (domains assigned, duplicates
    // resolved question by question) can vanish with zero notice.
    if (State.staging) { e.preventDefault(); e.returnValue = ''; return; }
    if (window._imageWorkflowOpen) { e.preventDefault(); e.returnValue = ''; }
  });
  // expose a small surface for debugging without opening the internals
  self.MCQ = { State, DB, Settings, runSelfTests, runIntegrity, APP };
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
